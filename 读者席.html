          if (!raw) throw new Error('模型没有返回可解析的 JSON');
          return buildCritiqueFromLLM(raw, ctx, res);
        });
      },
      respond(ctx) {
        const cfg = ctx.providerConfig || {};
        return callChat(cfg, [
          { role: 'system', content: RESPOND_SYSTEM },
          { role: 'user', content: buildRespondPrompt(ctx) }
        ]).then((res) => {
          const raw = parseJSON(res.content);
          if (!raw) throw new Error('模型没有返回可解析的 JSON');
          return buildRespondFromLLM(raw, ctx);
        });
      },
      deepCritique(ctx) {
        const cfg = ctx.providerConfig || {};
        return callChat(cfg, [
          { role: 'system', content: DEEP_SYSTEM },
          { role: 'user', content: buildDeepPrompt(ctx) }
        ]).then((res) => {
          const raw = parseJSON(res.content);
          if (!raw) throw new Error('模型没有返回可解析的 JSON');
          return buildDeepFromLLM(raw, ctx, res);
        });
      },
      test(cfg) {
        return callChat(cfg, [{ role: 'user', content: '只回复两个字：就绪' }])
          .then((res) => ({ ok: true, msg: '连接成功 · ' + (res.model || '') + ' · ' + res.elapsedMs + 'ms' }));
      }
    };
  }

  const PROVIDERS = {
    rule: ruleProvider,
    ollama: makeLLMProvider('ollama', '本地 Ollama', '$0 · 需本地跑模型',
      '完全免费、断网可用。用 Ollama 起一个中文模型（推荐 qwen2.5:7b），这里只填地址和模型名。'),
    openrouter: makeLLMProvider('openrouter', 'OpenRouter 免费档', '$0 · 需 API Key',
      'OpenRouter 上的免费模型（默认 Nemotron 550B 免费档）。注意真约束是请求数配额，不是钱。')
  };

  /* ================= 记录 LLM 调用（报告 4.2 的 llm_calls） ================= */
  const calls = [];
  function logCall(rec) {
    calls.push(Object.assign({ ts: Date.now() }, rec));
    if (calls.length > 200) calls.shift();
  }

  global.RCS_PROVIDERS = {
    list: () => Object.keys(PROVIDERS).map((k) => PROVIDERS[k]),
    get: (id) => PROVIDERS[id] || ruleProvider,
    rule: ruleProvider,
    defaults: { endpoint: defaultEndpoint, model: defaultModel },
    listLocalModels: listLocalModels,
    calls: calls,
    logCall: logCall,
    /* 供测试与工具链复用 */
    internals: { makeQuoteChecker, parseJSON, metricSummary, buildCritiquePrompt, buildRespondPrompt }
  };
})(typeof window !== 'undefined' ? window : globalThis);

})();
</script>
<script>
(function () {
/* 读者席 · 应用逻辑（多页面版） */
(function () {
  'use strict';

  const E = window.RCS_ENGINE;
  const L = window.RCS_LEXICON;
  const PR = window.RCS_PROVIDERS;
  const KEY = 'reader-seat.v3';
  const OLD_KEY = 'reader-seat.v2';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = E.esc;
  const fmt = (n) => Number(n || 0).toLocaleString('zh-CN');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const RET_ORDER = ['hook', 'immersion', 'payoff', 'expectation', 'conflict', 'poison'];

  const state = {
    data: null,
    route: { name: 'shelf' },
    busy: false,
    metrics: null,
    selected: null,
    workView: 'chat',
    reportRound: null,
    lexOpen: null
  };

  /* UI 折叠状态单独落盘，不混入作品数据 */
  let uiState = { inspHidden: false, focus: false, folds: {} };
  function loadUI() {
    try { uiState = Object.assign(uiState, JSON.parse(localStorage.getItem('reader-seat.ui') || '{}')); } catch (e) { /* 忽略 */ }
  }
  function saveUI() {
    try { localStorage.setItem('reader-seat.ui', JSON.stringify(uiState)); } catch (e) { /* 忽略 */ }
  }
  const uiFolded = (id, dft) => (uiState.folds[id] == null ? !!dft : !!uiState.folds[id]);

  /* ================= 存储 ================= */
  function seed() {
    const id = 'w' + Date.now().toString(36);
    return {
      version: 3,
      settings: {
        strict: 50,
        animate: true,
        provider: 'rule',
        providerConfig: {
          ollama: { endpoint: PR.defaults.endpoint('ollama'), model: PR.defaults.model('ollama'), apiKey: '' },
          openrouter: { endpoint: PR.defaults.endpoint('openrouter'), model: PR.defaults.model('openrouter'), apiKey: '' }
        }
      },
      calls: [],
      activeWorkId: id,
      customPersonas: [],
      works: [{
        id: id,
        title: L.sample.title,
        genre: L.sample.genre,
        text: L.sample.text,
        createdAt: Date.now(),
        log: [],
        checked: [],
        chapterRuns: [],
        active: E.PERSONAS.map((p) => p.id)
      }]
    };
  }

  function normalize(d) {
    d.settings = Object.assign({
      strict: 50, animate: true, provider: 'rule',
      providerConfig: {
        ollama: { endpoint: PR.defaults.endpoint('ollama'), model: PR.defaults.model('ollama'), apiKey: '' },
        openrouter: { endpoint: PR.defaults.endpoint('openrouter'), model: PR.defaults.model('openrouter'), apiKey: '' }
      }
    }, d.settings || {});
    // 兼容旧数据缺 providerConfig 的情况
    const pc = d.settings.providerConfig || (d.settings.providerConfig = {});
    ['ollama', 'openrouter'].forEach((k) => {
      pc[k] = Object.assign({
        endpoint: PR.defaults.endpoint(k), model: PR.defaults.model(k), apiKey: ''
      }, pc[k] || {});
    });
    if (!PR.get(d.settings.provider)) d.settings.provider = 'rule';
    d.calls = Array.isArray(d.calls) ? d.calls : [];
    d.customPersonas = Array.isArray(d.customPersonas) ? d.customPersonas : [];
    d.customGenres = (d.customGenres && typeof d.customGenres === 'object' && !Array.isArray(d.customGenres)) ? d.customGenres : {};
    d.works.forEach((w) => {
      w.log = Array.isArray(w.log) ? w.log : [];
      w.checked = w.checked || [];
      w.chapterRuns = Array.isArray(w.chapterRuns) ? w.chapterRuns : [];
      w.active = w.active && w.active.length ? w.active : E.PERSONAS.map((p) => p.id);
    });
    return d;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.works) && d.works.length) return normalize(d);
      }
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const d = JSON.parse(old);
        if (d && Array.isArray(d.works) && d.works.length) {
          d.customPersonas = [];
          d.version = 3;
          return normalize(d);
        }
      }
    } catch (e) { /* 损坏则重置 */ }
    return seed();
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state.data)); } catch (e) { /* 忽略配额 */ }
    // 引擎的类型诊断读 window.RCS_CUSTOM_GENRES，落盘时同步
    window.RCS_CUSTOM_GENRES = (state.data.customGenres && typeof state.data.customGenres === 'object') ? state.data.customGenres : {};
  }

  /* ================= 基础数据 ================= */
  function allPersonas() {
    return E.PERSONAS.concat(state.data.customPersonas || []);
  }

  function personaOf(id) {
    return allPersonas().find((p) => p.id === id) || E.PERSONAS[0];
  }

  function isCustom(id) {
    return (state.data.customPersonas || []).some((p) => p.id === id);
  }

  function work() {
    const d = state.data;
    return d.works.find((w) => w.id === d.activeWorkId) || d.works[0];
  }

  function workById(id) {
    return state.data.works.find((w) => w.id === id);
  }

  function effectivePersona(p) {
    const s = state.data.settings.strict == null ? 50 : state.data.settings.strict;
    return Object.assign({}, p, { bias: p.bias * (0.55 + (s / 100) * 0.9) });
  }

  function activePersonas(w) {
    return allPersonas().filter((p) => (w.active || []).indexOf(p.id) >= 0);
  }

  const critsOf = (w) => w.log.filter((x) => x.type === 'critique');
  const roundsOf = (w) => Array.from(new Set(critsOf(w).map((c) => c.round))).sort((a, b) => a - b);
  const roundCrits = (w, r) => critsOf(w).filter((c) => c.round === r);
  const latestRound = (w) => { const r = roundsOf(w); return r.length ? r[r.length - 1] : 0; };
  const avg = (list) => (list.length ? Math.round(list.reduce((a, c) => a + c.score, 0) / list.length) : null);

  /* ================= 聚合简报 =================
   * 把一轮 N 位读者的批评归并：同 id 的问题算共识，只一人提的算独有观点，
   * 按「提到人数 → 严重度」排序，附可勾选改稿清单（勾选状态存 w.checked）。 */
  function buildDigest(w, round) {
    const crits = roundCrits(w, round);
    const map = new Map();
    const locMap = new Map();
    crits.forEach((c) => {
      const p = personaOf(c.personaId);
      (c.issues || []).forEach((is) => {
        const key = is.id || String(is.title || '').trim() || is.dim;
        if (!map.has(key)) {
          map.set(key, {
            id: key, title: String(is.title || '').trim() || (E.DIM_LABEL[is.dim] || is.dim),
            dim: is.dim, sev: Number(is.severity) || 2, count: 0, pids: [], pnames: [],
            detail: is.detail || '', fix: is.fix || '', quote: is.quote || '',
            para: null, ch: 0, chTitle: ''
          });
        }
        const g = map.get(key);
        g.count += 1;
        g.sev = Math.max(g.sev, Number(is.severity) || 2);
        if (p && g.pids.indexOf(p.id) < 0) { g.pids.push(p.id); g.pnames.push(p.name); }
        if (!g.quote && is.quote) g.quote = is.quote;
        if (!g.fix && is.fix) g.fix = is.fix;
        if (g.para == null && is.para != null) { g.para = is.para; g.ch = is.ch || 0; g.chTitle = is.chTitle || ''; }
        if (is.ch) {
          const lk = is.ch;
          if (!locMap.has(lk)) locMap.set(lk, { ch: lk, chTitle: is.chTitle || '', n: 0, first: is.para != null ? is.para : null });
          locMap.get(lk).n += 1;
          if (locMap.get(lk).first == null && is.para != null) locMap.get(lk).first = is.para;
        }
      });
    });
    const rank = (a, b) => (b.count - a.count) || (b.sev - a.sev);
    const all = Array.from(map.values());
    const shared = all.filter((g) => g.count >= 2).sort(rank);
    const unique = all.filter((g) => g.count === 1).sort(rank);
    const locs = Array.from(locMap.values()).sort((a, b) => b.n - a.n).slice(0, 6);
    const scores = crits.map((c) => c.score).filter((n) => typeof n === 'number');
    const gid = E.genreOf(w.genre);
    const genre = gid ? E.analyzeGenre(E.analyze(w.text), gid) : null;
    return {
      type: 'digest', round: round, ts: Date.now(),
      count: crits.length,
      avg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null,
      best: scores.length ? Math.max.apply(null, scores) : null,
      worst: scores.length ? Math.min.apply(null, scores) : null,
      shared: shared, unique: unique, locs: locs,
      total: all.length, genre: genre
    };
  }

  function avgDimsOf(list) {
    const o = {};
    E.DIMS.forEach((k) => {
      o[k] = list.length ? Math.round(list.reduce((a, c) => a + c.dims[k], 0) / list.length) : 0;
    });
    return o;
  }

  function hashText(t) {
    let h = 2166136261;
    const s = String(t || '');
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }

  function isStale(w) {
    const subs = w.log.filter((x) => x.type === 'submit');
    if (!subs.length) return false;
    return subs[subs.length - 1].textHash !== hashText(w.text);
  }

  function refreshMetrics() {
    state.metrics = E.analyze(work().text);
  }

  function globalStats() {
    let rounds = 0;
    const scores = [];
    state.data.works.forEach((w) => {
      rounds += roundsOf(w).length;
      const s = avg(roundCrits(w, latestRound(w)));
      if (s != null) scores.push(s);
    });
    return {
      works: state.data.works.length,
      rounds: rounds,
      readers: allPersonas().length,
      avg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null
    };
  }

  /* ================= 路由 ================= */
  function parseRoute() {
    const h = (location.hash || '#/shelf').replace(/^#/, '');
    const parts = h.split('/').filter(Boolean);
    if (!parts.length) return { name: 'shelf' };
    const known = ['shelf', 'work', 'readers', 'reader', 'report', 'settings'];
    if (known.indexOf(parts[0]) < 0) return { name: 'shelf' };
    return { name: parts[0], id: parts[1] || null };
  }

  function go(path) {
    if (location.hash === path) render();
    else location.hash = path;
  }

  /* ================= 渲染骨架 ================= */
  function render() {
    const r = parseRoute();
    if (r.name === 'work' && r.id) {
      if (r.id !== state.data.activeWorkId) state.reportRound = null;
      if (workById(r.id)) state.data.activeWorkId = r.id;
    }
    state.route = r;
    state.selected = r.name === 'work' ? state.selected : null;

    document.getElementById('app').classList.toggle('no-inspector', r.name !== 'work');
    document.getElementById('app').classList.toggle('insp-hidden', !!uiState.inspHidden);
    document.getElementById('app').classList.toggle('focus', !!uiState.focus && r.name === 'work');
    renderRail();
    renderSidebar();
    renderMain();
    if (r.name === 'work') renderInspector();
    else $('#inspector').innerHTML = '';

    if (r.name !== 'work') { const m = $('#main'); if (m) m.scrollTop = 0; }
  }

  function renderRail() {
    const r = state.route.name;
    const map = { shelf: 'shelf', work: 'shelf', readers: 'readers', reader: 'readers', report: 'report', settings: 'settings' };
    $$('.rail-btn[data-route]').forEach((b) => {
      b.classList.toggle('active', b.getAttribute('data-route') === map[r]);
    });
  }

  function sbGroup(id, title, count, body, dftOpen) {
    const folded = uiFolded('sb:' + id, !dftOpen);
    return '<section class="sb-group' + (folded ? ' folded' : '') + '" data-sb-group="sb:' + id + '">' +
      '<button class="sb-group-head"><span class="chev">▾</span><span>' + title + '</span>' +
      (count ? '<span class="cnt">' + count + '</span>' : '') + '</button>' +
      '<div class="sb-group-body">' + body + '</div></section>';
  }

  function renderSidebar() {
    const r = state.route;
    const el = $('#sidebar');
    const w = work();

    if (r.name === 'readers' || r.name === 'reader') {
      const rows = allPersonas().map((p) => {
        const on = (w.active || []).indexOf(p.id) >= 0;
        const active = (r.name === 'reader' && r.id === p.id) ? 'selected' : '';
        return '<button class="reader-row ' + active + '" data-go-reader="' + p.id + '">' +
          '<span class="avatar sm" style="background:' + p.color + '">' + esc(p.initial) + '</span>' +
          '<span class="rr-main"><span class="rr-name">' + esc(p.name) + '</span>' +
          '<span class="rr-role">' + esc(p.role) + '</span></span>' +
          '<span class="switch ' + (on ? 'on' : '') + '" data-toggle="' + p.id + '" role="switch" tabindex="0"></span>' +
          '</button>';
      }).join('');

      el.innerHTML = sbHead('读者团', '<button class="icon-btn" id="sb-new-reader" title="捏一个读者">+</button>') +
        '<div class="sb-panel">' +
        sbGroup('roster', '在场读者', allPersonas().length, rows, true) +
        sbGroup('hint', '说明', '',
          '<div class="muted-note" style="padding:4px 8px 10px">拨动开关决定下一轮谁在场。关掉的人说过的话仍留在记录里。</div>', false) +
        '</div>' +
        '<div class="sb-foot"><button class="report-btn" data-new-reader>捏一个自己的读者</button></div>';
      return;
    }

    if (r.name === 'report') {
      const rounds = roundsOf(w);
      const rows = rounds.length
        ? rounds.slice().reverse().map((n) => {
          const s = avg(roundCrits(w, n));
          const active = (state.reportRound || latestRound(w)) === n;
          return '<button class="work-item ' + (active ? 'active' : '') + '" data-round="' + n + '">' +
            '<span class="wi-main"><span class="wi-title">第 ' + n + ' 轮</span>' +
            '<span class="wi-meta">' + roundCrits(w, n).length + ' 位读者 · ' + (s == null ? '—' : s + ' 分') + '</span></span></button>';
        }).join('')
        : '<div class="muted-note" style="padding:4px 8px 10px">还没有批评记录。</div>';

      el.innerHTML = sbHead('批评报告', '') +
        '<div class="sb-panel">' + sbGroup('rounds', '轮次', rounds.length, rows, true) + '</div>' +
        '<div class="sb-foot"><button class="report-btn" data-print>打印 / 存为 PDF</button></div>';
      return;
    }

    if (r.name === 'settings') {
      el.innerHTML = sbHead('设置', '') +
        '<div class="sb-panel">' + sbGroup('about', '关于', '',

      '<div class="sb-panel">' +
      sbGroup('works', '我的稿子', state.data.works.length, items, true) +

  /* ================= 雷达图 ================= */
  function radarSVG(dims, size, labels, noPoly) {
    const keys = Object.keys(dims);
    const n = keys.length;
    const cx = size / 2, cy = size / 2;
    const r = size / 2 - (labels === false ? 6 : 36);
    const pt = (i, ratio) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * r * ratio, cy + Math.sin(a) * r * ratio];
    };
    let grid = '';
    [0.25, 0.5, 0.75, 1].forEach((k) => {
      const p = keys.map((_, i) => pt(i, k).join(',')).join(' ');
      grid += '<polygon points="' + p + '" fill="none" stroke="#e9dfc8" stroke-width="1"/>';
    });
    let axes = '';
    keys.forEach((_, i) => {
      const q = pt(i, 1);
      axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + q[0] + '" y2="' + q[1] + '" stroke="#e9dfc8"/>';
    });
    const poly = keys.map((k, i) => pt(i, Math.max(0.08, dims[k] / 100)).join(',')).join(' ');
    const lbs = labels === false ? '' : keys.map((k, i) => {
      const q = pt(i, 1.15);
      return '<text x="' + q[0] + '" y="' + (q[1] + 3) + '" font-size="10" fill="#9b8c71" text-anchor="middle">' +
        E.DIM_LABEL[k] + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="' + size + '">' +
      grid + axes +
      (noPoly ? '' : '<polygon points="' + poly + '" fill="rgba(184,72,42,.15)" stroke="#b8482a" stroke-width="2" stroke-linejoin="round"/>') +
      lbs + '</svg>';
  }

  /* ================= 书架 ================= */
  function statCard(k, v, unit, text) {
    return '<div class="stat-card"><div class="sc-k">' + k + '</div><div class="sc-v' +
      (text ? ' text' : '') + '">' + (v == null || v === '' ? '—' : v) +
      '<small>' + (unit || '') + '</small></div></div>';
  }

  /* 书架工具条：搜索 + 排序，状态存 uiState */
  function shelfSortKey(x, k) {
    if (k === 'score') {
      const s = avg(roundCrits(x, latestRound(x)));
      return s == null ? -1 : s;
    }
    if (k === 'chars') return E.analyze(x.text).charCount;
    let t = x.createdAt || 0;
    (x.log || []).forEach((l) => { if (l.ts > t) t = l.ts; });
    return t;
  }

  function shelfList() {
    const q = String(uiState.shelfQ || '').trim().toLowerCase();
    const k = uiState.shelfSort || 'update';
    let list = state.data.works.slice();
    if (q) list = list.filter((x) =>
      (x.title || '').toLowerCase().indexOf(q) >= 0 || (x.genre || '').toLowerCase().indexOf(q) >= 0);
    list.sort((a, b) => shelfSortKey(b, k) - shelfSortKey(a, k));
    return list;
  }

      '<circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>' +

      '</div>' +

        '<button class="ss-opt' + (k === o.v ? ' on' : '') + '" data-sort="' + o.v + '">' + o.t + '</button>').join('') +

  function shelfGridHTML() {
    const list = shelfList();
    const cards = list.map((x, idx) => {
      const lr = latestRound(x);
      const cs = roundCrits(x, lr);
      const score = avg(cs);
      const dims = cs.length ? avgDimsOf(cs) : null;
      const topIssue = cs.length ? (cs.slice().sort((a, b) => b.score - a.score)[0].issues[0] || null) : null;
      const charCount = E.analyze(x.text).charCount;
      return '<div class="work-card">' +
        '<div class="wc-cover c' + (idx % 4) + '">' +
        '<span class="wc-cover-char">' + esc((x.title || '稿').slice(0, 1)) + '</span>' +
        '<span class="wc-genre">' + esc(x.genre || '未分类') + '</span>' +
        (isStale(x) ? '<span class="badge-stale">待重评</span>' : '') + '</div>' +
        '<h3 data-open="' + x.id + '">' + esc(x.title) + '</h3>' +
        '<div class="wc-meta">' + fmt(charCount) + ' 字 · ' + (lr ? '第 ' + lr + ' 轮' : '尚未开评') + '</div>' +
        '<div class="wc-bottom">' +
        '<div class="wc-radar">' + (dims ? radarSVG(dims, 92, false) : radarSVG({ prose: 0, rhythm: 0, character: 0, plot: 0, theme: 0, dialogue: 0, novelty: 0 }, 92, false, true)) + '</div>' +
        (score == null
          ? '<div class="wc-unrated">未评</div>'
          : '<div class="wc-score">' + score + '<small>综合</small></div>') +
        '</div>' +
        '<div class="wc-issue">' + (topIssue ? '最近问题：' + esc(topIssue.title) : '还没有读者开口') + '</div>' +
        '<div class="wc-actions">' +
        '<button class="btn sm" data-open="' + x.id + '">' + (lr ? '继续批改' : '开始批评') + '</button>' +
        '<button class="btn sm ghost danger" data-del="' + x.id + '">删除</button>' +
        '</div></div>';
    }).join('');
    const empty = list.length
      ? ''
      : '<div class="shelf-empty">没有找到匹配的稿子。换一个关键词，或清空搜索框。</div>';
    return empty + cards +
      '<button class="work-card new-card" data-new-work><span class="plus">+</span><span>贴一篇新稿子</span></button>';
  }

  function renderShelfGrid() {
    const el = $('#work-grid');

  function shelfHTML() {
    const st = globalStats();
    const w = work();

    const feedItems = [];
    state.data.works.forEach((x) => {
      critsOf(x).slice(-2).forEach((c) => {
        const is = (c.issues && c.issues[0]) || null;
        if (!is) return;
        feedItems.push({ ts: c.ts || 0, p: personaOf(c.personaId), work: x, is: is, score: c.score, round: c.round });
      });
    });

      '<div class="feed-item" data-open="' + f.work.id + '">' +

      '<div class="fi-main"><div class="fi-head"><b>' + esc(f.p.name) + '</b> 评《' + esc(f.work.title) + '》第 ' +
      f.round + ' 轮 · ' + f.score + ' 分</div>' +
      '<div class="fi-text">' + esc(f.is.title) + '——' + esc(firstSentence(f.is.detail)) + '</div></div></div>'
    ).join('') || '<div class="muted-note">还没有批注。打开一篇稿子，让读者开口。</div>';

    const strip = allPersonas().slice(0, 8).map((p) =>
      '<button class="rp-chip" data-go-reader="' + p.id + '"><span class="avatar xs" style="background:' + p.color + '">' +
      esc(p.initial) + '</span><span>' + esc(p.name) + '</span></button>').join('');

    return '<div class="page-head"><div><h1>书架</h1>' +
      '<p>' + st.works + ' 篇稿子 · ' + st.rounds + ' 轮批评 · ' + st.readers + ' 位读者</p></div>' +
      '<div class="head-actions"><button class="btn primary" data-new-work>新建作品</button></div></div>' +
      '<div class="stat-row">' +
      statCard('作品', st.works, '篇') +
      statCard('累计批评', st.rounds, '轮') +
      statCard('最近综合分', st.avg, st.avg == null ? '' : '/100') +
      statCard('在场读者', activePersonas(w).length, '位') +
      '</div>' +
      '<div class="sec-row"><div class="sec-title">我的稿子</div><span class="sec-hint">同一篇可以反复提交，每一轮都会重新读</span></div>' +
      shelfToolsHTML() +
      '<div class="work-grid" id="work-grid">' + shelfGridHTML() + '</div>' +
      '<div class="shelf-grid">' +
      '<div><div class="sec-title">最近批注</div><div class="feed">' + feed + '</div></div>' +
      '<div><div class="sec-title">读者团</div><div class="rp-strip">' + strip + '</div>' +
      '<button class="btn ghost sm" data-goto-readers style="margin-top:10px">管理读者与标准</button></div>' +
      '</div>';
  }

  function firstSentence(s) {
    const t = String(s || '');
    const i = t.indexOf('。');
    return i > 0 ? t.slice(0, i + 1) : t.slice(0, 80);
  }

  /* ================= 工作台 ================= */
  const VIEW_TABS = [
    { v: 'chat', label: '读者对话', desc: '读者逐个开口，逐条追问', icon: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-2 2V11.5a8.5 8.5 0 0 1 8.5-8.5h1a8.5 8.5 0 0 1 8.5 8.5z"/></svg>' },
    { v: 'ms', label: '手稿批注', desc: '边注落在段落旁边', icon: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>' },
    { v: 'gold', label: '三章体检', desc: '黄金三章，开篇留人', icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>' },
    { v: 'curve', label: '弃读曲线', desc: '追读率一路画到底', icon: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M4 16l5-6 4 3 7-9"/></svg>' },
    { v: 'ch', label: '逐章阅读', desc: '一章一章看弃读点', icon: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' }
  ];

  function renderWorkShell() {
    const w = work();
    state.metrics = E.analyze(w.text);
    const m = state.metrics;
    const lr = latestRound(w);

    const tabs = VIEW_TABS.map((t) =>
      '<button class="view-tab' + (state.workView === t.v ? ' on' : '') + '" data-view="' + t.v + '">' +
      '<span class="vt-ico">' + t.icon + '</span><span class="vt-txt"><b>' + t.label + '</b><small>' + t.desc + '</small></span></button>'
    ).join('');

    $('#main').innerHTML =
      '<header class="topbar">' +
      '<div class="tb-left"><h1 id="work-title">' + esc(w.title) + '</h1>' +
      '<div class="tb-meta" id="work-meta">' + esc(topMeta(w, m, lr)) + '</div></div>' +
      '<div class="tb-actions">' +
      '<button class="btn ghost btn-insp-toggle' + (uiState.inspHidden ? ' insp-on' : '') + '" id="btn-insp-toggle" title="收起或展开检视栏">检视栏</button>' +
      '<button class="btn ghost btn-focus' + (uiState.focus ? ' on' : '') + '" id="btn-focus" title="专注：隐藏侧栏与检视栏，只剩正文">专注</button>' +
      '<button class="btn ghost" id="btn-edit">编辑稿件</button>' +
      '<button class="btn ghost" id="btn-full" title="一键跑完：逐章分析、逐章模拟、黄金三章、整轮批评">全套</button>' +
      '<button class="btn primary" id="btn-run">' +
      '<svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg>' + (lr ? '再评一轮' : '开始批评') +
      '</button></div></header>' +
      '<nav class="view-tabs" id="view-tabs">' + tabs + '</nav>' +
      '<div class="stream' + (state.workView === 'ms' ? ' ms-stream' : '') + '" id="stream"></div>' +
      '<div class="composer">' +
      '<div class="quick-chips" id="quick-chips">' +
      '<button class="chip" data-q="这段为什么让人觉得假？">这段为什么假</button>' +
      '<button class="chip" data-q="到底该怎么改？">到底怎么改</button>' +
      '<button class="chip" data-q="举个例子，改一句给我看">改一句给我看</button>' +
      '<button class="chip" data-q="结尾有什么问题？">结尾怎么办</button>' +
      '</div>' +
      '<div class="composer-box"><textarea id="input" rows="1" placeholder="追问某位读者，先用 @ 点名，例如：@老周 这段为什么要删？"></textarea>' +
      '<button class="send" id="btn-send" title="发送"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>' +
      '<div class="composer-hint">Enter 发送 · Shift + Enter 换行 · @ 点名指定读者</div></div>';

    bindWork();
    renderStreamArea();
  }

  function topMeta(w, m, lr) {
    const bits = [
      w.genre || '未分类',
      fmt(m.charCount) + ' 字',
      activePersonas(w).length + ' 位读者在场',
      lr ? '已评 ' + lr + ' 轮' : '尚未开评'
    ];
    if (isStale(w)) bits.push('稿件已修改');
    return bits.join(' · ');
  }

  function bindWork() {
    $('#btn-edit').addEventListener('click', () => openEditor(false));
    $('#btn-run').addEventListener('click', runRound);
    const fullBtn = $('#btn-full');
    if (fullBtn) fullBtn.addEventListener('click', runFullSuite);

    const inspToggle = $('#btn-insp-toggle');
    if (inspToggle) inspToggle.addEventListener('click', () => {
      uiState.inspHidden = !uiState.inspHidden;
      saveUI();
      $('#app').classList.toggle('insp-hidden', uiState.inspHidden);
      inspToggle.classList.toggle('insp-on', uiState.inspHidden);
    });

    const focusBtn = $('#btn-focus');
    if (focusBtn) focusBtn.addEventListener('click', () => {
      uiState.focus = !uiState.focus;
      saveUI();
      $('#app').classList.toggle('focus', uiState.focus);
      focusBtn.classList.toggle('on', uiState.focus);
    });

    $$('#view-tabs button').forEach((b) => {
      b.addEventListener('click', () => {
        const v = b.getAttribute('data-view');
        if (state.workView === v) return;
        state.workView = v;
        $$('#view-tabs button').forEach((x) => x.classList.toggle('on', x === b));
        $('#stream').classList.toggle('ms-stream', v === 'ms');
        renderStreamArea();
      });
    });

    const input = $('#input');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(132, input.scrollHeight) + 'px';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const v = input.value;
        input.value = '';
        input.style.height = 'auto';
        ask(v);
      }
    });
    $('#btn-send').addEventListener('click', () => {
      const v = input.value;
      input.value = '';
      input.style.height = 'auto';
      ask(v);
    });

    $('#quick-chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const w = work();
      const cs = critsOf(w);
      const who = state.selected
        ? personaOf(state.selected)
        : (cs.length ? personaOf(cs[cs.length - 1].personaId) : allPersonas()[0]);
      input.value = '@' + who.name + ' ' + chip.getAttribute('data-q');
      input.focus();
      input.dispatchEvent(new Event('input'));
    });

    $('#stream').addEventListener('click', (e) => {
      if (e.target.closest('#empty-run')) { runRound(); return; }
      if (e.target.closest('[data-export-ms]')) { exportAnnotated(); return; }
      const jp = e.target.closest('[data-go-para]');
      if (jp) { jumpToPara(Number(jp.getAttribute('data-go-para'))); return; }
      const dg = e.target.closest('[data-dg-key]');
      if (dg) {
        const w = work();
        const k = dg.getAttribute('data-dg-key');
        const arr = w.checked || (w.checked = []);
        const i = arr.indexOf(k);
        if (i >= 0) arr.splice(i, 1); else arr.push(k);
        save();
        renderStream({ scroll: false });
        return;
      }
      const cm = e.target.closest('[data-curve-mode]');
      if (cm) {
        uiState.curveMode = cm.getAttribute('data-curve-mode');
        saveUI();
        renderStreamArea();
        return;
      }
      const pid = e.target.closest('[data-pid]');
      if (pid && e.target.closest('.msg.bot')) {
        state.selected = pid.getAttribute('data-pid');
        renderInspector();
      }
    });
  }

  function refreshWorkChrome() {
    const w = work();
    const m = E.analyze(w.text);
    state.metrics = m;
    const lr = latestRound(w);
    const t = $('#work-title');
    if (t) t.textContent = w.title;
    const meta = $('#work-meta');
    if (meta) meta.textContent = topMeta(w, m, lr);
    const run = $('#btn-run');
    if (run) {
      run.disabled = state.busy;
      run.innerHTML = state.busy
        ? '<svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg>批评中…'
        : '<svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg>' + (lr ? '再评一轮' : '开始批评');
    }
    const full = $('#btn-full');
    if (full) full.disabled = state.busy;
    renderSidebar();
  }

  function renderStreamArea() {
    if (state.workView === 'ms') renderManuscript();
    else if (state.workView === 'ch') renderChapterView();
    else if (state.workView === 'curve') renderCurveView();
    else if (state.workView === 'gold') renderGoldenView();
    else renderStream({ scroll: true });
  }

  /* 落点跳转：从对话/简报/报告的段落标签跳去手稿批注视图，滚动到对应段并高亮 */
  function jumpToPara(n) {
    const w = work();
    if (state.route.name !== 'work') {
      state.workView = 'ms';
      go('#/work/' + w.id);
    } else if (state.workView !== 'ms') {
      state.workView = 'ms';
      renderStreamArea();
      $$('#view-tabs button').forEach((b) => b.classList.toggle('on', b.getAttribute('data-view') === 'ms'));
    }
    let tries = 0;
    const find = () => {
      const el = document.getElementById('ms-para-' + n);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ms-flash');
        setTimeout(() => el.classList.remove('ms-flash'), 1800);
      } else if (tries++ < 12) {
        setTimeout(find, 50);
      }
    };
    find();
  }

  /* ================= 黄金三章体检视图 ================= */
  function renderGoldenView() {
    const w = work();
    const el = $('#stream');
    if (!el) return;
    const g = E.analyzeGolden(w.text);
    if (!g || !g.ok) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">三</div>' +
        '<h2>没有可体检的正文</h2><p>先把稿子贴进来，再来看黄金三章。</p></div>';
      return;
    }

    const label = E.R_DIM_LABEL || {};
    const bars = RET_ORDER.map((k) => {
      const v = g.scores[k];
      return '<div class="rd-row"><span class="rd-name">' + (label[k] || k) + '</span>' +
        '<div class="rd-track"><div class="rd-fill" style="width:' + v + '%"></div></div>' +
        '<span class="rd-val">' + v + '</span></div>';
    }).join('');

    const chapterCards = g.chapters.map((c) =>
      '<div class="gold-ch">' +
      '<div class="gold-ch-head"><span class="gold-ch-title">' + esc(c.title) + '</span>' +
      '<span class="gold-ch-meta">' + fmt(c.chars) + ' 字 · ' + c.paraCount + ' 段</span>' +
      '<span class="risk-pill risk-' + c.riskLevel + '">风险 ' + c.riskLevel + '</span></div>' +
      '<div class="gold-ch-stats">' +
      '<div class="gstat hot"><b>' + c.retentionEst + '%</b><i>追读率预估</i></div>' +
      '<div class="gstat"><b>' + c.openHook + '</b><i>开篇钩子</i></div>' +
      '<div class="gstat"><b>' + c.endHook + '</b><i>章末钩子</i></div>' +
      '<div class="gstat"><b>' + c.payoffCount + '</b><i>爽点标记</i></div>' +
      '<div class="gstat"><b>' + c.conflictCount + '</b><i>冲突标记</i></div>' +
      '<div class="gstat"><b>' + Math.round(c.infoRatio * 100) + '%</b><i>说明段占比</i></div>' +
      '</div></div>').join('');

    const risks = g.riskParas.length
      ? g.riskParas.map((r) =>
        '<div class="gold-risk"><span class="gold-risk-ch">' + esc(r.chTitle) + '</span>' +
        '<div class="gold-risk-quote">' + esc(r.quote) + '</div>' +
        '<div class="gold-risk-tags">' + r.reasons.map((x) => '<span class="gold-risk-tag">' + esc(x) + '</span>').join('') +
        '</div></div>').join('')
      : '<div class="gold-risk-none">前三章没检出明显劝退点。</div>';

    const note = g.hasTitles
      ? (g.totalChapters > 3 ? '体检只取前三章（黄金三章），全文共 ' + g.totalChapters + ' 章。' : '全文 ' + g.totalChapters + ' 章都在体检范围内。')
      : '未检测到「第X章」标题，暂把全篇当作一章体检；给章节加上标题后数据会更准。';

    el.innerHTML =
      '<div class="gold-wrap">' +
      '<div class="gold-head"><div>' +
      '<div class="gold-score">' + g.overall + '<span> /100</span></div>' +
      '<div class="gold-score-label">黄金三章 · 追读分</div></div>' +
      '<div class="gold-note">' + esc(note) + '</div></div>' +
      '<div class="gold-bars">' + bars + '</div>' +
      '<div class="sec-title">逐章卡</div><div class="gold-chs">' + chapterCards + '</div>' +
      '<div class="sec-title">劝退风险点</div><div class="gold-risks">' + risks + '</div>' +
      '</div>';
  }

  /* ================= 弃读曲线视图 =================
   * 内置版逐章追读曲线：不依赖 reader-mirror 导入，
   * 直接用规则引擎 analyzeChapters 的全文逐章指标画出来。 */
  function curvePoisonTags(c) {
    const tags = [];
    if (c.stoopCount) tags.push('憋屈 ×' + c.stoopCount);
    if (c.saintCount) tags.push('圣母 ×' + c.saintCount);
    if (c.infodumpCount) tags.push('设定糊脸 ×' + c.infodumpCount);
    if (c.infoRatio > 0.4) tags.push('说明段占 ' + Math.round(c.infoRatio * 100) + '%');
    return tags;
  }

  function curveModeHTML(mode) {
    return '<div class="curve-mode">' +
      '<button class="cm-opt' + (mode === 'total' ? ' on' : '') + '" data-curve-mode="total">总览曲线</button>' +
      '<button class="cm-opt' + (mode === 'readers' ? ' on' : '') + '" data-curve-mode="readers">分读者曲线</button>' +
      '</div>';
  }

  /* 分读者模式：每位读者一条兴趣线（1—5），× 是弃读点 */
  function renderCurveReaders(el, w, a) {
    const sim = E.simulateReading(w.text, activePersonas(w));
    const chs = a.chapters;
    const MAXC = 60;
    const vis = chs.slice(0, MAXC);
    const step = 46, padL = 46, padR = 30;
    const H = 262, top = 16, bottom = H - 36;
    const W = padL + vis.length * step + padR;
    const yOf = (v) => (top + (5 - v) / 5 * (bottom - top)).toFixed(1);
    const xOf = (i) => (padL + i * step + step / 2).toFixed(1);

    let grid = '';
    [1, 2, 3, 4, 5].forEach((v) => {
      grid += '<line x1="' + padL + '" y1="' + yOf(v) + '" x2="' + (padL + vis.length * step) + '" y2="' + yOf(v) +
        '" stroke="#eadfc6" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (+yOf(v) + 3) + '" font-size="10" fill="#9b8c71" text-anchor="end">' + v + '</text>';
    });
    const xEvery = vis.length <= 14 ? 1 : Math.ceil(vis.length / 14);
    let xlabs = '';
    vis.forEach((c, i) => {
      if (i % xEvery !== 0 && i !== vis.length - 1) return;
      xlabs += '<text x="' + xOf(i) + '" y="' + (H - 10) + '" font-size="10" text-anchor="middle" fill="#9b8c71">' + (i + 1) + '</text>';
    });
    xlabs += '<text x="' + (padL + vis.length * step) / 2 + '" y="' + (H - 22) + '" font-size="10" fill="#b3a68c" text-anchor="middle">章节</text>';
    grid += '<text x="10" y="' + (top + bottom) / 2 + '" font-size="10" fill="#b3a68c" transform="rotate(-90 10 ' + (top + bottom) / 2 + ')" text-anchor="middle">兴趣 1—5</text>';

    let lines = '';
    let marks = '';
    let names = '';
    sim.results.forEach((r, k) => {
      const log = r.state.reading_log || [];
      const color = r.color || '#999';
      const pts = log.map((lg, i) => xOf(i) + ',' + yOf(lg.interest)).join(' ');
      lines += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>';
      const ex = r.state.exit_chapter;
      if (ex != null && log[ex]) {
        const x = +xOf(ex), y = +yOf(log[ex].interest);
        marks += '<path d="M' + (x - 4) + ' ' + (y - 4) + ' L' + (x + 4) + ' ' + (y + 4) + ' M' + (x + 4) + ' ' + (y - 4) + ' L' + (x - 4) + ' ' + (y + 4) + '" stroke="#b03a2e" stroke-width="2.5" stroke-linecap="round"/>';
      }
      if (log.length) {
        const lastI = log.length - 1;
        const dy = (k % 4) * 13 - 19;
        names += '<text x="' + (+xOf(lastI) + 7) + '" y="' + (+yOf(log[lastI].interest) + dy) + '" font-size="11" font-weight="600" fill="' + color + '">' + esc(r.name) + '</text>';
      }
    });

    const svg = '<div class="curve-scroll"><svg class="curve-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
      grid + lines + marks + names + xlabs + '</svg></div>';

    const legend = sim.results.map((r) => {
      const ex = r.state.exit_chapter;
      return '<span><i class="lg" style="background:' + (r.color || '#999') + '"></i>' + esc(r.name) +
        ' · ' + (ex == null ? '读完' : '第 ' + (ex + 1) + ' 章走') + '</span>';
    }).join('');

    const exits = sim.results.map((r) => {
      const ex = r.state.exit_chapter;
      return '<div class="curve-exit-row">' +
        '<span class="cer-dot" style="background:' + (r.color || '#999') + '"></span>' +
        '<span class="cer-name">' + esc(r.name) + '</span>' +
        '<span class="cer-where' + (ex == null ? ' ok' : '') + '">' + (ex == null ? '读完全稿' : '第 ' + (ex + 1) + ' 章弃读') + '</span>' +
        '<span class="cer-reason">' + esc(r.state.exit_reason || '') + '</span></div>';
    }).join('');

    el.innerHTML =
      '<div class="curve-wrap">' +
      '<div class="curve-head"><div><h2>逐章弃读曲线 · 分读者</h2>' +
      '<p>每位读者按自己的耐心逐章读：兴趣随钩子/爽点/冲突涨、随说明段/憋屈跌，退出意愿攒到阈值就弃读。× 是弃读点，规则模拟供自检参考。</p></div>' +
      (chs.length > MAXC ? '<div class="gold-note">全文 ' + chs.length + ' 章，曲线只画前 ' + MAXC + ' 章。</div>' : '') +
      '</div>' +
      curveModeHTML('readers') +
      '<div class="curve-legend">' + legend + '</div>' +
      svg +
      '<div class="sec-title" style="margin:20px 0 10px">谁在哪一章走了</div>' +
      '<div class="curve-exits">' + exits + '</div>' +
      '</div>';
  }

  function renderCurveView() {
    const w = work();
    const el = $('#stream');
    if (!el) return;
    const a = E.analyzeChapters(w.text);
    if (!a || !a.ok) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">线</div>' +
        '<h2>没有可画曲线的正文</h2><p>先把稿子贴进来，再来画逐章追读曲线。</p></div>';
      return;
    }
    if (!a.hasTitles) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">线</div>' +
        '<h2>检测不到章节标题</h2><p>弃读曲线要按「第X章」逐章画。给章节加上标题（如「第1章 废柴少年」），曲线会自动出来。</p></div>';
      return;
    }
    if (a.totalChapters < 2) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">线</div>' +
        '<h2>章节太少，画不出曲线</h2><p>至少两章才有「追读走势」。目前只检测到 1 章，把下一章写进来再看。</p></div>';
      return;
    }

    const mode = uiState.curveMode || 'total';
    if (mode === 'readers') { renderCurveReaders(el, w, a); return; }

    const chs = a.chapters;
    const ret = chs.map((c) => c.retentionEst);
    const cum = [];
    let acc = 100;
    chs.forEach((c) => { acc = Math.round(acc * c.retentionEst / 100 * 10) / 10; cum.push(acc); });

    const drops = [];
    for (let i = 1; i < chs.length; i++) {
      const d = ret[i - 1] - ret[i];
      if (d >= 10) drops.push({ i: i, d: d, from: ret[i - 1], to: ret[i] });
    }
    const poison = chs.map((c, i) => ({ i: i, tags: curvePoisonTags(c) })).filter((x) => x.tags.length);

    /* ---- SVG 曲线 ---- */
    const MAXC = 60;
    const vis = chs.slice(0, MAXC);
    const step = 46, padL = 46, padR = 26;
    const H = 262, top = 16, bottom = H - 36;
    const W = padL + vis.length * step + padR;
    const yOf = (v) => (top + (100 - v) / 100 * (bottom - top)).toFixed(1);
    const xOf = (i) => (padL + i * step + step / 2).toFixed(1);

    let grid = '';
    [0, 25, 50, 75, 100].forEach((v) => {
      grid += '<line x1="' + padL + '" y1="' + yOf(v) + '" x2="' + (padL + vis.length * step) + '" y2="' + yOf(v) +
        '" stroke="#eadfc6" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (+yOf(v) + 3) + '" font-size="10" fill="#9b8c71" text-anchor="end">' + v + '</text>';
    });

    const xEvery = vis.length <= 14 ? 1 : Math.ceil(vis.length / 14);
    let xlabs = '';
    vis.forEach((c, i) => {
      if (i % xEvery !== 0 && i !== vis.length - 1) return;
      xlabs += '<text x="' + xOf(i) + '" y="' + (H - 10) + '" font-size="10" text-anchor="middle" fill="' +
        (poison.some((p) => p.i === i) ? '#ad6a1c' : '#9b8c71') + '">' + (i + 1) + '</text>';
    });
    xlabs += '<text x="' + (padL + vis.length * step) / 2 + '" y="' + (H - 22) + '" font-size="10" fill="#b3a68c" text-anchor="middle">章节</text>';
    grid += '<text x="10" y="' + (top + bottom) / 2 + '" font-size="10" fill="#b3a68c" transform="rotate(-90 10 ' + (top + bottom) / 2 + ')" text-anchor="middle">追读率 %</text>';

    const retPts = vis.map((c, i) => xOf(i) + ',' + yOf(ret[i])).join(' ');
    const cumPts = vis.map((c, i) => xOf(i) + ',' + yOf(cum[i])).join(' ');
    let dots = '';
    vis.forEach((c, i) => {
      const isDrop = drops.some((d) => d.i === i);
      const isPoi = poison.some((p) => p.i === i);
      dots += '<circle cx="' + xOf(i) + '" cy="' + yOf(ret[i]) + '" r="' + (isDrop ? 5 : 3.2) + '" fill="#b8482a"' +
        (isPoi ? ' stroke="#ad6a1c" stroke-width="2.5"' : '') + '>' +
        '<title>第 ' + (i + 1) + ' 章《' + esc(c.title) + '》\n追读率 ' + ret[i] + '% · 累计留存 ' + cum[i] + '%' +
        (isPoi ? '\n毒点：' + curvePoisonTags(c).join('、') : '') + '</title></circle>';
    });
    const dropLabs = drops.map((d, k) => {
      const prevClose = k > 0 && drops[k - 1].i === d.i - 1;
      const ly = prevClose ? (+yOf(ret[d.i]) - 26) : (+yOf(ret[d.i]) - 13);
      return '<text x="' + xOf(d.i) + '" y="' + ly + '" font-size="11" font-weight="700" fill="#b03a2e" text-anchor="middle">↓' + d.d + '</text>';
    }).join('');

    const svg = '<div class="curve-scroll"><svg class="curve-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
      grid +
      '<polyline points="' + cumPts + '" fill="none" stroke="#3f7a4e" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/>' +
      '<polyline points="' + retPts + '" fill="none" stroke="#b8482a" stroke-width="2.5" stroke-linejoin="round"/>' +
      dots + dropLabs + xlabs + '</svg></div>';

    /* ---- 概览统计 ---- */
    const low = chs.reduce((m, c, i) => (ret[i] < ret[m] ? i : m), 0);
    const stats =
      '<div class="curve-stats">' +
      '<div class="curve-stat"><b>' + ret[0] + '%</b><i>第 1 章追读率</i></div>' +
      '<div class="curve-stat"><b>' + ret[chs.length - 1] + '%</b><i>最后一章追读率</i></div>' +
      '<div class="curve-stat"><b>' + cum[cum.length - 1] + '%</b><i>全本累计留存</i></div>' +
      '<div class="curve-stat warn"><b>第 ' + (low + 1) + ' 章</b><i>最低谷 · ' + ret[low] + '%</i></div>' +
      '</div>';

    /* ---- 弃读高发点 ---- */
    const dropCards = drops.slice(0, 6).map((d) => {
      const c = chs[d.i];
      const tags = curvePoisonTags(c);
      return '<div class="curve-drop-card">' +
        '<div class="curve-drop-head"><span class="curve-drop-ch">第 ' + (d.i + 1) + ' 章《' + esc(c.title) + '》</span>' +
        '<span class="curve-drop-arrow">' + d.from + ' → ' + d.to + '（↓' + d.d + '）</span></div>' +
        '<div class="curve-tags">' +
        (tags.length ? tags.map((t) => '<span class="curve-tag">' + esc(t) + '</span>').join('')
          : '<span class="curve-tag none">本段风险信号弱，掉队多半是钩子松了</span>') +
        '</div></div>';
    }).join('') || '<div class="gold-risk-none">没有检测到断崖式掉队，追读曲线整体平稳。</div>';

    /* ---- 逐章表 ---- */
    const rows = chs.map((c, i) => {
      const d = drops.find((x) => x.i === i);
      const tags = curvePoisonTags(c);
      const cls = d ? ' drop' : (ret[i] <= 45 ? ' low' : '');
      return '<tr class="' + cls + '">' +
        '<td>' + (i + 1) + '</td><td class="tt">' + esc(c.title) + '</td>' +
        '<td><b>' + ret[i] + '</b></td>' +
        '<td class="muted-cell">' + cum[i] + '%</td>' +
        '<td>' + c.openHook + '</td><td>' + c.endHook + '</td>' +
        '<td>' + c.payoffCount + '</td><td>' + c.conflictCount + '</td>' +
        '<td><span class="risk-pill risk-' + c.riskLevel + '">' + c.riskLevel + '</span></td>' +
        '<td class="muted-cell">' + (tags.length ? esc(tags.join('、')) : '—') + '</td></tr>';
    }).join('');

    el.innerHTML =
      '<div class="curve-wrap">' +
      '<div class="curve-head"><div><h2>逐章弃读曲线</h2>' +
      '<p>' + chs.length + ' 章 · 由规则引擎按钩子、爽点、冲突、说明段占比逐章估算，自检参考，不等同于真实数据</p></div>' +
      (chs.length > MAXC ? '<div class="gold-note">全文 ' + chs.length + ' 章，曲线只画前 ' + MAXC + ' 章，表格覆盖全文。</div>' : '') +
      '</div>' +
      curveModeHTML(mode) +
      stats +
      '<div class="curve-legend"><span><i class="lg ret"></i>逐章追读率</span><span><i class="lg cum"></i>累计留存（100 人开读）</span>' +
      '<span><i class="lg drop"></i>陡降 · 弃读高发点</span><span><i class="lg poi"></i>毒点章</span></div>' +
      svg +
      '<div class="sec-title" style="margin:20px 0 10px">弃读高发点</div>' +
      '<div class="curve-drops">' + dropCards + '</div>' +
      '<div class="sec-title" style="margin:22px 0 10px">逐章明细</div>' +
      '<table class="call-table curve-table"><thead><tr><th>章</th><th>标题</th><th>追读率</th><th>留存</th><th>开篇钩子</th><th>章末钩子</th><th>爽点</th><th>冲突</th><th>风险</th><th>弃读信号</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '</div>';
  }

  /* ================= 逐章阅读视图 =================
   * 优先展示 reader-mirror 导入的 JSON（逐章无前瞻状态机）；
   * 没有导入时用内置规则模拟：每位读者带耐心逐章推进兴趣与退出意愿。
   * 前端只负责展示，不重算。 */
  function chapterData(w) {
    return (w.chapterRuns && w.chapterRuns.length) ? w.chapterRuns[0] : null;
  }

  function chapterRunHTML(d, builtin) {
    const runs = d.results || [];
    const nCh = d.chapters || 0;
    const exits = runs.map((r) => ({
      name: r.name, id: r.profile, color: r.color, patience: r.patience,
      exit: r.state.exit_chapter, thr: r.exit_threshold,
      reason: r.state.exit_reason, read: r.state.chapters_read
    }));
    const uniq = new Set(exits.map((e) => e.exit)).size;

    const head = '<div class="ch-head">' +
      '<h2>逐章阅读</h2>' +
      '<p>' + nCh + ' 章 · ' + runs.length + ' 位读者 · ' +
      (builtin
        ? '规则引擎内置模拟（读者耐心 × 逐章钩子/爽点/毒点信号）'
        : '生成后端 ' + esc(d.provider || '?') + (d.model ? '（' + esc(d.model) + '）' : '')) +
      '</p>' +
      (uniq > 1
        ? '<div class="ch-verdict ok">✓ ' + uniq + ' 个不同的弃读位置——画像差异确实产生了不同信号。</div>'
        : '<div class="ch-verdict bad">✗ 所有画像在同一章弃读——硬阈值没有起作用，先修参数，别往下走。</div>') +
      '<div class="ch-head-actions">' +
      (builtin
        ? '<button class="btn ghost sm" id="ch-import">导入 reader-mirror JSON</button>' +
          '<input type="file" id="ch-file" accept="application/json,.json" style="display:none" />'
        : '<button class="btn ghost sm" id="ch-builtin">改用内置模拟</button>') +
      '</div></div>';

    const exitTable = '<div class="ch-exits"><div class="sec-title">谁在第几章走了</div>' +
      '<table class="call-table"><thead><tr><th>读者</th><th>退出阈值</th><th>弃读于</th><th>读了几章</th><th>原因</th></tr></thead><tbody>' +
      exits.map((e) => '<tr>' +
        '<td><span class="ch-name"><i style="background:' + esc(e.color || '#999') + '"></i>' + esc(e.name) + '</span></td>' +
        '<td>' + e.thr + (builtin ? ' 分' : ' 段') + '</td>' +
        '<td>' + (e.exit == null ? '读完全稿' : '第 ' + (e.exit + 1) + ' 章') + '</td>' +
        '<td>' + e.read + '</td>' +
        '<td class="muted-cell">' + esc(e.reason || (e.exit == null ? '' : '—')) + '</td></tr>').join('') +
      '</tbody></table></div>';

    const charts = runs.map((r) => {
      const log = r.state.reading_log || [];
      const cells = log.map((lg) => {
        const isExit = r.state.exit_chapter === lg.chapter_index;
        return '<div class="ch-cell' + (isExit ? ' exit' : '') + '" title="' +
          esc(lg.title + ' · 兴趣 ' + lg.interest + '/5 · 退出意愿 ' + lg.exit_intent + '/3 · ' + (lg.summary || '')) + '">' +
          '<div class="ch-bar int"><span style="height:' + (lg.interest / 5 * 100) + '%"></span></div>' +
          '<div class="ch-bar ext"><span style="height:' + (lg.exit_intent / 3 * 100) + '%"></span></div>' +
          '<div class="ch-num">' + (lg.chapter_index + 1) + '</div>' +
          '</div>';
      }).join('');
      const anns = (r.state.annotations || []).length;
      const dropRate = r.state.total_quotes
        ? Math.round(r.state.dropped_quotes / r.state.total_quotes * 100) : 0;
      return '<div class="ch-persona">' +
        '<div class="ch-p-head"><span class="ft">' + esc(r.name) + '</span>' +
        '<span class="fd">' + (builtin
          ? '退出意愿阈值 ' + r.exit_threshold + ' 分 · 规则模拟 · ' +
            (r.state.exit_chapter == null ? '读完全稿' : '弃读于第 ' + (r.state.exit_chapter + 1) + ' 章')
          : '退出阈值 ' + r.exit_threshold + ' 段 · 批注 ' + anns + ' 条 · 引用丢弃率 ' + dropRate + '%') +
        '</span></div>' +
        '<div class="ch-grid">' + cells + '</div></div>';
    }).join('');

    const conflicts = runs.reduce((acc, r) => acc.concat((r.state.conflicts || [])), []);
    const conflictHTML = conflicts.length
      ? '<div class="ch-conflicts"><div class="sec-title">规则层与读者层的冲突</div>' +
        '<div class="muted-note" style="margin-bottom:8px">机器读数说这一章没问题，读者说没新东西。' +
        '这类冲突单独呈现，不被聚合层抹平。</div>' +
        conflicts.map((c) => '<div class="conf-row"><span class="cf-ch">第 ' + (c.chapter_index + 1) + ' 章《' + esc(c.title) + '》</span>' +
          '<span class="cf-m">' + esc(c.machine_says) + '</span>' +
          '<span class="cf-r">' + esc(c.reader_says) + '</span></div>').join('') +
        '</div>'
      : '';

    return head + exitTable + '<div class="sec-title" style="margin:20px 0 10px">兴趣与退出意愿曲线</div>' +
      '<div class="ch-legend"><span><i class="lg int"></i>兴趣（1—5）</span><span><i class="lg ext"></i>退出意愿（0—3）</span>' +
      '<span><i class="lg exit"></i>弃读章</span></div>' +
      charts + conflictHTML;
  }

  function renderChapterView() {
    const w = work();
    const el = $('#stream');
    if (!el) return;
    const d = chapterData(w);

    if (d) {
      el.innerHTML = chapterRunHTML(d, false);
      const btn = $('#ch-builtin');
      if (btn) btn.addEventListener('click', () => {
        if (!window.confirm('清空导入的 reader-mirror 数据，改用内置规则模拟？')) return;
        w.chapterRuns = [];
        save();
        renderChapterView();
        toast('已切换为内置模拟');
      });
      return;
    }

    /* ---- 内置模拟 ---- */
    const a = E.analyzeChapters(w.text);
    if (!a.ok) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">章</div>' +
        '<h2>没有可模拟的正文</h2><p>先把稿子贴进来，读者才知道从哪一章读起。</p></div>';
      return;
    }
    if (!a.hasTitles) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">章</div>' +
        '<h2>检测不到章节标题</h2><p>逐章模拟要按「第X章」推进。给章节加上标题（如「第1章 废柴少年」），模拟会自动跑起来。</p></div>';
      return;
    }
    if (a.totalChapters < 2) {
      el.innerHTML = '<div class="ch-empty"><div class="badge">章</div>' +
        '<h2>章节太少</h2><p>至少两章才有「谁先走」。目前只检测到 1 章，把下一章写进来再看。</p></div>';
      return;
    }

    const sim = E.simulateReading(w.text, activePersonas(w));
    el.innerHTML = chapterRunHTML(sim, true);
    const btn = $('#ch-import');
    const file = $('#ch-file');
    if (btn && file) {
      btn.addEventListener('click', () => file.click());
      file.addEventListener('change', () => {
        const f = file.files && file.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const obj = JSON.parse(rd.result);
            if (!obj || !Array.isArray(obj.results)) throw new Error('文件结构不对');
            w.chapterRuns = [obj];
            save();
            renderChapterView();
            toast('已导入：' + obj.results.length + ' 位读者');
          } catch (e) {
            toast('导入失败：' + e.message);
          }
        };
        rd.readAsText(f);
      });
    }
  }

  /* ================= 对话流 ================= */
  /* 落点标签：显示某条批评落在第几章第几段，点击跳去手稿 */
  function locLabel(b, paraIdx) {
    const seg = (b.para != null ? b.para : paraIdx) + 1;
    return b.ch
      ? '第' + b.ch + '章 · 第' + seg + '段'
      : '第' + seg + '段';
  }

  function renderBlocks(blocks) {
    return (blocks || []).map((b) => {
      if (b.type === 'p') return '<p>' + b.html + '</p>';
      if (b.type === 'quote') {
        const loc = b.para != null
          ? '<button class="loc-chip xs" data-go-para="' + (b.para + 1) + '" title="' + esc(b.chTitle || '') + '">' +
            esc(locLabel(b)) + '</button>'
          : '';
        return '<div class="quote">' + loc + '<span class="quote-text">' + esc(b.text) + '</span>' +
          '<span class="quote-note">' + esc(b.note || '') + '</span></div>';
      }
      if (b.type === 'list') {
        return '<div class="fix-list"><div class="fl-title">' + esc(b.title || '') + '</div><ol>' +
          (b.items || []).map((i) => '<li>' + esc(i) + '</li>').join('') + '</ol></div>';
      }
      return '';
    }).join('');
  }

  const scoreClass = (s) => (s >= 82 ? 'high' : s >= 66 ? 'mid' : 'low');

  /* 耐心档 → 阅读习惯（与 reader-mirror 的退出阈值语义对齐） */
  const READING_STYLE = {
    veryLow: '极没耐心。翻开前两章没有立刻发生什么，他就已经在找理由关掉了。',
    low: '没耐心。习惯追更，遇到没有冲突的段落会直接往下划。',
    mid: '普通耐心。能读完，但不会为重复的描写多停留。',
    high: '有耐心。愿意陪作者铺陈，但要求每一段都有回报。',
    veryHigh: '很有耐心。愿意一路读到最后，通常不弃读，只在真正说不过去时才放手。'
  };

  const PAT_LABEL = {
    veryLow: '极没耐心', low: '没耐心', mid: '普通耐心', high: '有耐心', veryHigh: '很有耐心'
  };

  function personaMessage(p, entry) {
    const dims = entry.dims
      ? '<div class="dims">' + E.DIMS.map((k) =>
        '<span class="dim">' + E.DIM_LABEL[k] + ' <b>' + entry.dims[k] + '</b></span>').join('') + '</div>'
      : '';
    const r = entry.retention;
    const retHtml = r
      ? '<div class="ret-box"><div class="ret-head">追读视角 · 追读分 <b>' + r.score + '</b>' +
        (r.source === 'rule' ? '<span class="ret-src">规则层</span>' : '<span class="ret-src llm">模型自评</span>') + '</div>' +
        '<div class="ret-dims">' + RET_ORDER.map((k) =>
          '<span class="ret-dim' + (r.dims[k] < 60 ? ' low' : '') + '">' + (E.R_DIM_LABEL[k] || k) + ' <b>' + r.dims[k] + '</b></span>').join('') + '</div>' +
        (r.issues && r.issues.length
          ? '<div class="ret-issues">' + r.issues.slice(0, 3).map((i) =>
            '<div class="ret-issue">' +
            (i.para != null
              ? '<button class="loc-chip xs" data-go-para="' + (i.para + 1) + '" title="' + esc(i.chTitle || '') + '">' +
                esc(locLabel(i)) + '</button>'
              : '') +
            '<span class="ret-issue-title">' + esc(i.title) + '</span>' +
            '<span class="ret-issue-detail">' + esc(i.detail) + '</span></div>').join('') + '</div>'
          : '') +
        (r.verdict ? '<div class="ret-verdict">' + esc(r.verdict) + '</div>' : '') +
        '</div>'
      : '';
    const tags = entry.tags && entry.tags.length
      ? '<div class="tags">' + entry.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'
      : '';
    const pill = entry.score != null
      ? '<span class="score-pill ' + scoreClass(entry.score) + '">' + entry.score + ' 分</span>'
      : '';
    return '<div class="msg bot" data-pid="' + p.id + '">' +
      '<div class="avatar" style="background:' + p.color + '">' + esc(p.initial) + '</div>' +
      '<div class="msg-body"><div class="msg-head">' +
      '<span class="name">' + esc(p.name) + '</span>' +
      '<span class="role">' + esc(p.role) + '</span>' + pill + '</div>' +
      '<div class="bubble">' + renderBlocks(entry.blocks) + tags + dims + retHtml + '</div></div></div>';

  function debateMessage(item) {
    const from = personaOf(item.fromId);
    const to = personaOf(item.toId);
    return '<div class="msg debate">' +
      '<span class="avatar xs" style="background:' + from.color + '">' + esc(from.initial) + '</span>' +
      '<div class="msg-body"><div class="msg-head"><span class="name">' + esc(from.name) + '</span>' +
      '<span class="role">回 ' + esc(to.name) + '</span></div>' +
      '<div class="debate-bubble">' + esc(item.text) + '</div></div></div>';

  /* ================= 聚合简报卡片 ================= */
  function digestMessage(item, w) {
    const shared = item.shared || [];
    const unique = item.unique || [];
    const checks = w.checked || [];
    const keyOf = (g) => 'r' + item.round + ':' + g.id;
    const doneOf = (g) => checks.indexOf(keyOf(g)) >= 0;
    const line = (g) =>
      '<div class="dg-item' + (doneOf(g) ? ' done' : '') + '" data-dg-key="' + esc(keyOf(g)) + '">' +
      '<span class="dg-check">' + (doneOf(g) ? '✓' : '') + '</span>' +
      '<span class="dg-body"><span class="dg-title">' + esc(g.title) +
      (g.para != null
        ? '<button class="loc-chip xs" data-go-para="' + (g.para + 1) + '" title="' + esc(g.chTitle || '') + '">' +
          (g.ch ? '第' + g.ch + '章 · 第' + (g.para + 1) + '段' : '第' + (g.para + 1) + '段') + '</button>'
        : '') +
      '<i class="dg-cnt">' + (g.count > 1 ? g.count + ' 人提到' : esc((g.pnames || [])[0] || '一位读者')) + '</i></span>' +
      (g.quote ? '<span class="dg-quote">「' + esc(E.truncate(g.quote, 36)) + '」</span>' : '') +
      (g.fix ? '<span class="dg-fix">' + esc(g.fix) + '</span>' : '') +
      '</span></div>';
    const scoreLine = item.avg != null
      ? '均分 ' + item.avg + ' · 最高 ' + item.best + ' · 最低 ' + item.worst
      : '';
    const sharedHTML = shared.length
      ? shared.slice(0, 5).map(line).join('')
      : '<div class="dg-none">没有两人以上共同提到的问题——分歧大，或稿子没有明显短板。</div>';
    const uniqueHTML = unique.length
      ? unique.slice(0, 4).map(line).join('')
      : '';
    /* 类型诊断：类型化词库对比读者默认期待，缺什么列什么 */
    const gi = (item.genre && item.genre.ok ? item.genre.issues || [] : []).map((i) => ({
      id: i.id, title: i.title, fix: i.fix || '', quote: i.quote || '',
      count: 1, pnames: ['类型诊断'], sev: i.severity
    }));
    const genreHTML = (item.genre && item.genre.ok)
      ? '<div class="dg-sec dg-genre"><div class="dg-sec-title">类型诊断 · ' + esc(item.genre.label) + '</div>' +
        '<div class="dg-gstats"><span class="dg-gs">爽点词 ' + item.genre.payoffs.length + '</span>' +
        '<span class="dg-gs">钩子词 ' + item.genre.hooks.length + '</span>' +
        '<span class="dg-gs">套路 ' + item.genre.tropes.length + '</span></div>' +
        (gi.length ? gi.slice(0, 3).map(line).join('') : '<div class="dg-none">爽点和钩子都齐了，套路也没撞车——这个类型的读者期待你接住了。</div>') +
        '</div>'
      : '';
    /* 批评落点：读者点名最多的章节分布 */
    const locsHTML = (item.locs && item.locs.length)
      ? '<div class="dg-sec"><div class="dg-sec-title">批评落点</div><div class="dg-locs">' +
        item.locs.map((l) =>
          '<button class="dg-loc" data-go-para="' + (l.first != null ? l.first + 1 : 1) + '" title="' + esc(l.chTitle || '') + '">' +
          '第' + l.ch + '章 <b>' + l.n + '</b> 处</button>').join('') +
        '</div></div>'
      : '';
    const checklist = gi.concat(shared, unique).slice(0, 8);
    const doneN = checklist.filter(doneOf).length;
    return '<div class="msg digest-card">' +
      '<div class="dg-head"><span class="dg-badge">简报</span>' +
      '<span class="dg-head-title">第 ' + item.round + ' 轮总评</span>' +
      '<span class="dg-score">' + item.count + ' 位读者 · ' + esc(scoreLine) + '</span></div>' +
      genreHTML +
      locsHTML +
      '<div class="dg-sec"><div class="dg-sec-title">共识问题</div>' + sharedHTML + '</div>' +
      (uniqueHTML ? '<div class="dg-sec"><div class="dg-sec-title">独有观点</div>' + uniqueHTML + '</div>' : '') +
      '<div class="dg-sec"><div class="dg-sec-title">改稿清单 <i class="dg-prog">' + doneN + '/' + checklist.length + '</i></div>' +
      (checklist.length ? checklist.map(line).join('') : '<div class="dg-none">这一轮没有可列出的修改项。</div>') +
      '</div></div>';
  }

  /* ================= 深度批评卡片（主笔） ================= */
  function deepLocsHTML(item) {
    const map = new Map();
    (item.issues || []).forEach((i) => {
      if (!i.ch) return;
      if (!map.has(i.ch)) map.set(i.ch, { ch: i.ch, chTitle: i.chTitle || '', n: 0, first: i.para != null ? i.para : null });
      map.get(i.ch).n += 1;
      if (map.get(i.ch).first == null && i.para != null) map.get(i.ch).first = i.para;
    });
    const locs = Array.from(map.values()).sort((a, b) => b.n - a.n).slice(0, 6);
    if (!locs.length) return '';
    return '<div class="deep-locs">主笔落点：' +
      locs.map((l) =>
        '<button class="loc-chip xs" data-go-para="' + (l.first != null ? l.first + 1 : 1) + '" title="' + esc(l.chTitle || '') + '">' +
        '第' + l.ch + '章 <b>' + l.n + '</b> 处</button>').join('') +
      '</div>';
  }

  function deepMessage(item) {
    return '<div class="msg deep">' +
      '<div class="avatar" style="background:#7a5c2e">主</div>' +
      '<div class="msg-body"><div class="msg-head">' +
      '<span class="name">深度批评</span>' +
      '<span class="role">主笔 · ' + esc(item.model || item.provider || 'LLM') + '</span>' +
      '<span class="score-pill deep-pill">整篇</span></div>' +

  function renderItem(item, w) {
    if (item.type === 'submit') {
      return '<div class="msg user"><div class="msg-body">' +
        '<div class="msg-head"><span class="role">你 · 第 ' + item.round + ' 轮</span></div>' +
        '<div class="bubble user-b">提交《' + esc(w.title) + '》<br>' + fmt(item.charCount) + ' 字，请各位读一读。</div>' +
        '</div></div>';
    }
    if (item.type === 'critique') return personaMessage(personaOf(item.personaId), item);
    if (item.type === 'debate') return debateMessage(item);
    if (item.type === 'digest') return digestMessage(item, w);
    if (item.type === 'deep') return deepMessage(item);
    if (item.type === 'ask') {
      return '<div class="msg user"><div class="msg-body">' +
        '<div class="msg-head"><span class="role">你 → ' + esc(personaOf(item.targetId).name) + '</span></div>' +
        '<div class="bubble user-b">' + esc(item.text) + '</div></div></div>';
    }
    if (item.type === 'reply') return personaMessage(personaOf(item.personaId), { blocks: item.blocks });
    if (item.type === 'system') return '<div class="system-note">' + esc(item.text) + '</div>';
    return '';

  function emptyState(w) {
    const m = E.analyze(w.text);
    const active = activePersonas(w);
    const faces = active.slice(0, 7).map((p) =>
      '<div class="avatar" style="background:' + p.color + '">' + esc(p.initial) + '</div>').join('');
    return '<div class="empty"><div class="badge">席</div>' +
      '<h2>稿子已经放在桌上了</h2>' +
      '<p>《' + esc(w.title) + '》共 ' + fmt(m.charCount) + ' 字。点右上角「开始批评」，' + active.length +
      ' 位读者会依次开口。<br>他们看的东西不一样——有人数你用了几个“很”，有人只想知道人物疼不疼。</p>' +
      '<div class="faces">' + faces + '</div>' +
      '<button class="btn primary" id="empty-run">让读者开始读</button></div>';

  function renderStream(opts) {
    const el = $('#stream');
    if (!el) return;
    const w = work();
    const log = w.log || [];
    let html = '<div class="stream-inner">';

    if (!log.length) {
      html += emptyState(w);
    } else {
      let round = 0;
      log.forEach((item) => {
        if (item.type === 'submit' && item.round !== round) {
          round = item.round;
          html += '<div class="divider">第 ' + round + ' 轮批评 · ' + fmt(item.charCount) + ' 字</div>';
        }
        html += renderItem(item, w);
      });
    }
    html += '</div>';
    el.innerHTML = html;
    if (opts && opts.scroll) {
      el.scrollTop = el.scrollHeight;
      requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
    }
  }

  /* ================= 手稿批注 ================= */
  function paragraphAffinity(issue, p, st) {
    if (issue.id === 'adv') return st.adv * 3;
    if (issue.id === 'cliche') return st.cliche * 4;
    if (issue.id === 'deheavy') return (p.match(/的/g) || []).length;
    if (issue.id === 'tell') return st.tell * 3;
    if (issue.id === 'longpara') return st.len / 100;
    if (issue.id === 'ending') return 0;
    if (issue.id === 'nodialogue' || issue.id === 'noshort' || issue.id === 'monotone') return st.len / 150;
    if (issue.id === 'saidtag' || issue.id === 'flatdialogue') return st.isDialogue ? 2 : 0;
    return 0;
  }

  function annotationsFor(w, round) {
    const paras = E.splitParagraphs(w.text);
    const stats = paras.map((p) => E.paragraphStats(p));
    const usage = paras.map(() => 0);
    const map = paras.map(() => []);
    const crits = roundCrits(w, round);
    const pl = E.paraLocate(w.text);

    crits.forEach((c) => {
      const mine = {};
      (c.issues || []).forEach((is) => {
        const q = is.quote || '';
        /* 显式段落锚点（读者点名的那一段）优先，直接落段，不再猜 */
        if (is.para != null && is.para >= 0 && is.para < paras.length) {
          mine[is.para] = 1;
          usage[is.para] += 1;
          map[is.para].push({
            pid: c.personaId,
            id: is.id,
            title: is.title,
            note: firstSentence(is.detail),
            fix: is.fix,
            quote: q,
            word: is.word || '',
            para: is.para,
            ch: is.ch || 0,
            chTitle: is.chTitle || ''
          });
          return;
        }
        const qKey = q.slice(0, 10).replace(/\s+/g, '');
        const contains = [];
        if (qKey) {
          paras.forEach((p, i) => { if (p.replace(/\s+/g, '').indexOf(qKey) >= 0) contains.push(i); });
        }
        const contentOnly = paras.map((_, i) => i).filter((i) => !stats[i].isDialogue);
        const pool = contains.length
          ? contains
          : (is.dim === 'dialogue' || !contentOnly.length ? paras.map((_, i) => i) : contentOnly);
        let best = -1, bestScore = -1e9;
        pool.forEach((i) => {
          let score = paragraphAffinity(is, paras[i], stats[i]);
          if (contains.indexOf(i) >= 0) score += 8;
          score -= usage[i] * 4;
          if (mine[i]) score -= 100;
          if (is.id === 'ending') score += (i === paras.length - 1 ? 30 : -30);
          if (score > bestScore) { bestScore = score; best = i; }
        });
        if (best < 0) return;
        mine[best] = 1;
        usage[best] += 1;
        map[best].push({
          pid: c.personaId,
          id: is.id,
          title: is.title,
          note: firstSentence(is.detail),
          fix: is.fix,
          quote: q,
          word: is.word || '',
          para: best,
          ch: pl.chOf[best] || 0,
          chTitle: pl.chTitleOf[best] || ''
        });
      });
    });
    return { paras: paras, map: map, crits: crits };
  }

  function groupNotes(notes) {
    const out = [];
    notes.forEach((n) => {
      let g = out.find((x) => x.title === n.title);
      if (!g) {
        g = {
          id: n.id, title: n.title, note: n.note, fix: n.fix, quote: n.quote, word: n.word || '',
          para: n.para != null ? n.para : null, ch: n.ch || 0, chTitle: n.chTitle || '', pids: []
        };
        out.push(g);
      }
      if (g.pids.indexOf(n.pid) < 0) g.pids.push(n.pid);
    });
    return out;
  }

  function markWord(p, word) {
    const idx = word ? p.indexOf(word) : -1;
    if (idx < 0) return null;
    return esc(p.slice(0, idx)) + '<mark>' + esc(p.slice(idx, idx + word.length)) + '</mark>' +
      esc(p.slice(idx + word.length));
  }

  function highlightPara(p, groups) {
    // 先按精准词定位（问题直接命中的那个词）
    for (let i = 0; i < groups.length; i++) {
      const w = (groups[i].word || '').trim();
      if (w.length >= 2) {
        const hit = markWord(p, w);
        if (hit) return hit;
      }
    }
    // 再按引文原句定位
    for (let i = 0; i < groups.length; i++) {
      const hit = markWord(p, (groups[i].quote || '').slice(0, 10));
      if (hit) return hit;
    }
    // 引文不在这段时，按问题类型找该段的证据词
    for (let i = 0; i < groups.length; i++) {
      const id = groups[i].id;
      let bank = null;
      if (id === 'cliche') bank = L.cliches;
      else if (id === 'adv') bank = L.adverbs;
      else if (id === 'tell') bank = L.tellWords;
      else if (id === 'saidtag') bank = L.saidTags;
      else if (id === 'coincidence') bank = L.coincidence;
      else if (id === 'noTurn') bank = L.transitions;
      else if (id === 'abstract') bank = L.abstractWords;
      if (bank) {
        for (let j = 0; j < bank.length; j++) {
          const hit = markWord(p, bank[j]);
          if (hit) return hit;
        }
      }
    }
    return esc(p);
  }

  function renderManuscript() {
    const el = $('#stream');
    if (!el) return;
    const w = work();
    const round = latestRound(w);
    const data = round ? annotationsFor(w, round) : null;
    const paras = data ? data.paras : E.splitParagraphs(w.text);
    const riskTags = E.paraRiskTags(w.text);
    const groupsByPara = data ? data.map.map((ns) => groupNotes(ns)) : paras.map(() => []);
    const shownNotes = groupsByPara.reduce((a, x) => a + x.length, 0);
    const riskCount = riskTags.reduce((a, x) => a + x.length, 0);
    el.scrollTop = 0;

    const locCount = new Map();
    (data ? data.map : []).forEach((ns) => {
      ns.forEach((n) => {
        if (n.ch) {
          const k = n.ch;
          if (!locCount.has(k)) locCount.set(k, { ch: k, chTitle: n.chTitle || '', n: 0, first: n.para != null ? n.para : null });
          locCount.get(k).n += 1;
          if (locCount.get(k).first == null && n.para != null) locCount.get(k).first = n.para;
        }
      });
    });
    const locChips = Array.from(locCount.values())
      .sort((a, b) => b.n - a.n).slice(0, 8)
      .map((l) => '<button class="loc-chip" data-go-para="' + ((l.first != null ? l.first : 0) + 1) + '" title="' +
        esc(l.chTitle || '') + '">第' + l.ch + '章 <b>' + l.n + '</b> 处</button>').join('');

    let html = '<div class="ms-head">' +
      (data
        ? '<div><b>第 ' + round + ' 轮批注</b><span>' + data.crits.length + ' 位读者 · ' + shownNotes +
          ' 条边注 · 共 ' + paras.length + ' 段</span>' +
          (locChips ? '<div class="ms-locs">' + locChips + '</div>' : '') +
          '</div>' +
          '<button class="btn sm ghost" data-export-ms>导出批注稿</button>'
        : '<div><b>追读风险标注</b><span>规则检测 · 共 ' + riskCount + ' 处风险 · 等读者开评后这里会叠加批注</span></div>') +
      '</div>';

    html += '<div class="ms-doc">';
    paras.forEach((p, i) => {
      const st = E.paragraphStats(p);
      const flags = [];
      if (st.len > 165) flags.push('段落 ' + st.len + ' 字');
      if (st.adv >= 3) flags.push('副词 ' + st.adv + ' 处');
      if (st.cliche > 0) flags.push('熟句 ' + st.cliche + ' 处');
      const risks = riskTags[i] || [];

      const groups = groupsByPara[i] || [];
      html += '<div class="ms-para ' + ((groups.length || risks.length) ? 'has-note' : '') + '" id="ms-para-' + (i + 1) + '" data-para="' + (i + 1) + '">' +
        '<div class="ms-no">' + pad2(i + 1) + '</div>' +
        '<div class="ms-text ' + (st.isDialogue ? 'dlg' : '') + '">' + highlightPara(p, groups) +
        (risks.length
          ? '<span class="ms-risks">' + risks.map((r) => '<span class="ms-risk">' + esc(r) + '</span>').join('') + '</span>'
          : '') +
        (flags.length ? '<span class="ms-flags">' + flags.join(' · ') + '</span>' : '') + '</div>' +
        '<div class="ms-notes">' + groups.map((g) => {
          const first = personaOf(g.pids[0]);
          const names = g.pids.map((id) => personaOf(id).name).join('、');
          const locTag = g.ch
            ? '<button class="loc-chip xs" data-go-para="' + (g.para != null ? g.para + 1 : i + 1) + '">' +
              '第' + g.ch + '章 · 第' + (g.para != null ? g.para + 1 : i + 1) + '段</button>'
            : '';
          return '<div class="ms-note" style="border-left-color:' + first.color + '">' +
            '<div class="mn-head"><span class="mn-name" style="color:' + first.color + '">' + esc(names) +
            '</span>' + locTag + '<span class="mn-title">' + esc(g.title) + '</span></div>' +

  function renderInspector() {

    if (crits.length) {

      let body = '<div class="radar-wrap">' + radarSVG(dimAvg, 210) + '</div>' +
        '<div class="dim-bars">' + E.DIMS.map((k) =>

          dimAvg[k] + '%"></span></span><span class="num">' + dimAvg[k] + '</span></div>').join('') + '</div>';

      if (crits.length >= 2) {
        const spread = E.DIMS.map((k) => {
          const vals = crits.map((c) => c.dims[k]);
          return { k: k, sp: Math.max.apply(null, vals) - Math.min.apply(null, vals) };

          '<div class="muted-note" style="margin-top:6px">分歧本身是信息：它说明这一项没有客观标准，只有口味。</div></div>';
      }

      html += inspGroup('overall', '本轮综合', '<span class="big">' + score + '<small>/100</small></span>', body, true);
    } else {
      html += inspGroup('overall', '本轮综合', '',
        '<div class="muted-note">还没有批评记录。先让读者读一遍，这里会出现七维评分和分歧提示。</div>', true);
    }

    const sel = state.selected ? personaOf(state.selected) : null;
    let pbody;

        (entry ? '<span class="score-pill ' + scoreClass(entry.score) + '" style="margin-left:auto">' + entry.score + '</span>' : '') +
        '</div><p class="pc-bio">' + esc(sel.bio) + '</p>' +
        '<div class="like-row"><span class="lb">在意</span>' + sel.likes.slice(0, 3).map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
        '<div class="like-row"><span class="lb">讨厌</span>' + sel.hates.slice(0, 3).map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
        '<div class="like-row"><span class="lb"></span><button class="link-btn" data-go-reader="' + sel.id + '">看他的完整档案 →</button></div>';
    } else {

        '<br><br>点对话里的头像，能看到这个人的标准。</div>';
    }

  /* ================= 读者团 ================= */

  }
