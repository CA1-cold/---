    const sdSent = std(lens, avgSent);
    const shortRatio = sentCount ? lens.filter((n) => n <= 12).length / sentCount : 0;
    const longRatio = sentCount ? lens.filter((n) => n >= 45).length / sentCount : 0;

    const quoteMatches = full.match(/[“"「『][^”"」』\n]{0,300}[”"」』]/g) || [];
    const quoteLens = quoteMatches.map((q) => q.replace(/[“”"「」『』]/g, '').replace(/\s/g, '').length);
    const dialogueChars = sum(quoteLens);
    const dialogueParas = paragraphs.filter((p) => /[“"「『]/.test(p)).length;
    const dialogueRatio = charCount ? dialogueChars / charCount : 0;

    const advCount = L.adverbs.reduce((a, w) => a + countOcc(full, w), 0);
    const tellCount = L.tellWords.reduce((a, w) => a + countOcc(full, w), 0);
    const deCount = countOcc(full, '的');
    const sensoryCount = Object.values(L.sensory).flat().reduce((a, w) => a + countOcc(full, w), 0);
    const transCount = L.transitions.reduce((a, w) => a + countOcc(full, w), 0);
    const coincCount = L.coincidence.reduce((a, w) => a + countOcc(full, w), 0);
    const saidCount = L.saidTags.reduce((a, w) => a + countOcc(full, w), 0);

    const clicheHits = [];
    L.cliches.forEach((w) => {
      const c = countOcc(full, w);
      if (c > 0) clicheHits.push({ phrase: w, count: c });
    });
    const clicheCount = sum(clicheHits.map((x) => x.count));

    const abstractHits = [];
    L.abstractWords.forEach((w) => {
      const c = countOcc(full, w);
      if (c > 0) abstractHits.push({ phrase: w, count: c });
    });
    const imageHits = [];
    L.images.forEach((w) => {
      const c = countOcc(full, w);
      if (c > 0) imageHits.push({ phrase: w, count: c });
    });
    const tropes = L.tropes.filter((w) => countOcc(full, w) > 0);

    // 高频二字组
    const grams = new Map();
    const chs = full.replace(/\s/g, '').split('');
    for (let i = 0; i < chs.length - 1; i++) {
      const a = chs[i], b = chs[i + 1];
      if (!/[\u4e00-\u9fa5]/.test(a) || !/[\u4e00-\u9fa5]/.test(b)) continue;
      if (L.stopChars.indexOf(a) >= 0 || L.stopChars.indexOf(b) >= 0) continue;
      const g = a + b;
      grams.set(g, (grams.get(g) || 0) + 1);
    }
    const repeated = [...grams.entries()].filter(([, c]) => c >= 3)
      .sort((a, b) => b[1] - a[1]).slice(0, 5).map(([gram, count]) => ({ gram, count }));

    const paraLens = paragraphs.map((p) => p.replace(/\s/g, '').length);
    const avgPara = mean(paraLens);
    const sdPara = std(paraLens, avgPara);
    const paraCv = avgPara ? sdPara / avgPara : 0;

    const tagCharacter = /(是|像)一个[^。，！？]{0,18}的人/.test(full);
    const ending = sentences.length ? sentences[sentences.length - 1].text : '';
    const opening = sentences.length ? sentences[0].text : '';
    const weakEnding = /(道理|明白|释然|遗憾|人生|错过|回不来|一个人走)/.test(ending);
    const openingHook = /[“"「『]/.test(opening) || /[0-9]/.test(opening) || opening.length <= 22;

    // 代表性样本句（每类取多条，供不同读者抽到不同句子）
    const shortest = sentences.filter((s) => s.len >= 4).sort((a, b) => a.len - b.len)[0];
    const byLen = sentences.slice().sort((a, b) => b.len - a.len)[0];
    const bestPool = sentences.filter((s) =>
      s.len >= 14 && s.len <= 55 && s.cliche === 0 && s.adv <= 1 && !s.isDialogue);

    const sortTop = (key, n) => sentences.filter((s) => s[key] > 0)
      .sort((a, b) => b[key] - a[key]).slice(0, n || 3).map((s) => s.text);
    const pools = {
      adv: sortTop('adv'),
      cliche: sortTop('cliche'),
      tell: sortTop('tell'),
      de: sortTop('de'),
      long: sentences.filter((s) => s.len >= 40).sort((a, b) => b.len - a.len).slice(0, 3).map((s) => s.text),
      short: sentences.filter((s) => s.len >= 4 && s.len <= 14 && !s.isDialogue && s.adv === 0 && s.cliche === 0)
        .sort((a, b) => a.len - b.len).slice(0, 3).map((s) => s.text),
      dialogue: sentences.filter((s) => s.isDialogue && s.len >= 6).slice(0, 4).map((s) => s.text),
      action: sentences.filter((s) => /她|他/.test(s.text) && s.len >= 8 && s.len <= 60 && s.cliche === 0 && s.tell === 0 && s.adv <= 1)
        .slice(0, 4).map((s) => s.text),
      best: bestPool.slice().sort((a, b) => b.len - a.len).slice(0, 3).map((s) => s.text)
    };
    if (!pools.short.length) pools.short = [shortest ? shortest.text : ''].filter(Boolean);

    const byAdv = sentences.slice().sort((a, b) => b.adv - a.adv)[0];
    const byTell = sentences.slice().sort((a, b) => b.tell - a.tell)[0];
    const byDe = sentences.slice().sort((a, b) => b.de - a.de)[0];
    const byCliche = sentences.slice().sort((a, b) => b.cliche - a.cliche)[0];
    const dialogueSample = sentences.find((s) => s.isDialogue && s.len >= 6);
    const best = bestPool[0] || byLen;

    return {
      text, full, paragraphs, charCount,
      paraCount: paragraphs.length,
      sentCount, avgSent, sdSent, shortRatio, longRatio,
      avgPara, sdPara, paraCv,
      dialogueChars, dialogueParas, dialogueRatio,
      quoteLens, avgQuoteLen: mean(quoteLens), quoteCount: quoteMatches.length,
      advCount, advDensity: charCount ? advCount / charCount * 100 : 0,
      tellCount, tellDensity: charCount ? tellCount / charCount * 100 : 0,
      deCount, deRatio: charCount ? deCount / charCount : 0,
      sensoryCount, sensoryDensity: charCount ? sensoryCount / charCount * 100 : 0,
      transCount, coincCount, saidCount,
      clicheHits, clicheCount,
      abstractHits, abstractCount: sum(abstractHits.map((x) => x.count)),
      imageHits, imageDistinct: imageHits.length,
      tropes, repeated,
      topGram: repeated[0] || null,
      tagCharacter, ending, opening, weakEnding, openingHook, pools,
      samples: {
        longest: byLen ? byLen.text : '',
        shortest: shortest ? shortest.text : '',
        adv: byAdv && byAdv.adv > 0 ? byAdv.text : '',
        tell: byTell && byTell.tell > 0 ? byTell.text : '',
        de: byDe && byDe.de >= 3 ? byDe.text : '',
        cliche: byCliche && byCliche.cliche > 0 ? byCliche.text : '',
        dialogue: dialogueSample ? dialogueSample.text : '',
        best: best ? best.text : ''
      }
    };
  }

  /* ---------- 问题诊断 ---------- */
  function detectIssues(m) {
    const out = [];
    const push = (o) => out.push(o);

    if (m.advDensity >= 2.2 && m.samples.adv) {
      const th = topHit(m.full, L.adverbs);
      const sn = th ? snippetAround(m.full, th.w) : null;
      push({
        id: 'adv', dim: 'prose', title: '副词在替你做表情',
        severity: clamp((m.advDensity - 1.8) / 3.2, 0.32, 0.95),
        detail: `每 100 字里有 ${m.advDensity.toFixed(1)} 次副词（很、非常、忽然、慢慢地这类）。情绪不是靠程度词加码加出来的——写三遍“很难过”，不如写一次她端杯子的手。`,
        fix: '把“很 / 非常 / 忽然”删掉一半，情绪改用动作和物件承接',
        quote: sn && sn.quote ? sn.quote : m.samples.adv,
        word: sn ? sn.word : '', quotes: m.pools.adv
      });
    }

    if (m.clicheCount > 0) {
      const top = m.clicheHits.slice().sort((a, b) => b.count - a.count).slice(0, 3).map((x) => '“' + x.phrase + '”');
      const topPhrase = m.clicheHits.slice().sort((a, b) => b.count - a.count)[0];
      const sn = topPhrase ? snippetAround(m.full, topPhrase.phrase) : null;
      push({
        id: 'cliche', dim: 'prose', title: '句子是从别人那儿借的',
        severity: clamp(0.3 + m.clicheCount * 0.11, 0.3, 0.92),
        detail: `全篇检出 ${m.clicheCount} 处熟句/熟词，最多的三个是 ${top.join('、')}。这些短语本身没错，错在它们已经不再让你自己看见画面了，读者也看不见。`,
        fix: '凡是能整句背下来的表达，一律换成你亲眼见过的具体细节',
        quote: sn && sn.quote ? sn.quote : (m.samples.cliche || ''),
        word: sn ? sn.word : '', quotes: m.pools.cliche
      });
    }

    if (m.sentCount >= 6 && (m.sdSent / Math.max(1, m.avgSent) < 0.55 || m.longRatio > 0.28)) {
      push({
        id: 'monotone', dim: 'prose', title: '句式是一条直线',
        severity: clamp(0.35 + (m.longRatio > 0.28 ? 0.3 : 0) + (m.shortRatio < 0.08 ? 0.2 : 0), 0.3, 0.9),
        detail: `平均句长 ${m.avgSent.toFixed(0)} 字，句长起伏只有 ${m.sdSent.toFixed(1)}。绝大多数句子都是“主语 + 动作 + 感受”的同一副骨架，读到第三段，眼睛就知道下一句长什么样了。`,
        fix: '每 5 句里塞一个 6 字以内的短句，把长句切断',
        quote: m.samples.longest, quotes: m.pools.long
      });
    }

    if (m.deRatio > 0.045 && m.samples.de) {
      push({
        id: 'deheavy', dim: 'prose', title: '“的”字拖着句子走',
        severity: clamp((m.deRatio - 0.04) * 22, 0.28, 0.8),
        detail: `“的”占了全篇 ${(m.deRatio * 100).toFixed(1)}%。修饰语一层套一层，句子变沉，读起来像在拖着行李走路。`,
        fix: '把“形容词 + 的 + 名词”压成动词短语，能删的修饰全部删',
        quote: m.samples.de, quotes: m.pools.de
      });
    }

    if (m.topGram && m.topGram.count >= 4) {
      const sn = snippetAround(m.full, m.topGram.gram);
      push({
        id: 'repeat', dim: 'prose', title: '自己跟自己撞词',
        severity: clamp(0.25 + (m.topGram.count - 3) * 0.12, 0.25, 0.75),
        detail: `“${m.topGram.gram}”在短篇幅里出现了 ${m.topGram.count} 次。同一个词反复出现，读者会以为它重要，可它往往只是你顺手。`,
        fix: `给“${m.topGram.gram}”找两个替换说法，或者干脆删掉一处`,
        quote: sn.quote, word: sn.word
      });
    }

    if (m.avgPara > 165) {
      push({
        id: 'longpara', dim: 'rhythm', title: '段落太长，读者要换气',
        severity: clamp((m.avgPara - 150) / 160, 0.3, 0.85),
        detail: `平均每段 ${Math.round(m.avgPara)} 字，最长的段落有 ${Math.max.apply(null, m.paragraphs.map((p) => p.replace(/\s/g, '').length))} 字。一段里同时发生回忆、动作、心理三件事，读者不知道该抓哪一件。`,
        fix: '一段只做一件事，超过 120 字就找地方断开',
        quote: ''
      });
    }

    if (m.dialogueRatio < 0.06) {
      push({
        id: 'nodialogue', dim: 'rhythm', title: '通篇没有一个活着的声音',
        severity: clamp(0.45 + (0.06 - m.dialogueRatio) * 4, 0.35, 0.85),
        detail: `对话只占 ${(m.dialogueRatio * 100).toFixed(0)}%，几乎全靠叙述在推。人物不说话，读者就只能听你转述他们的关系。`,
        fix: '把最关键的一次冲突改成正面交谈，让人物自己说出来',
        quote: m.samples.dialogue || '', quotes: m.pools.dialogue
      });
    }

    if (m.shortRatio < 0.05 && m.sentCount >= 8) {
      push({
        id: 'noshort', dim: 'rhythm', title: '没有短句，就没有呼吸',
        severity: 0.42,
        detail: `全篇 12 字以下的句子只占 ${(m.shortRatio * 100).toFixed(0)}%。长句连着长句，节奏是一条平线，读者的注意力会自己滑走。`,
        fix: '在情绪最重的地方用一个两三个字的句子砸下去',
        quote: m.samples.shortest, quotes: m.pools.short
      });
    }

    if (m.paraCv < 0.34 && m.paraCount >= 5) {
      push({
        id: 'evenpara', dim: 'rhythm', title: '每段一样长，像在填表格',
        severity: 0.3,
        detail: `段落长度几乎没有变化（波动系数 ${m.paraCv.toFixed(2)}）。段落长度本身就是节奏，一样长就意味着一路匀速。`,
        fix: '让不重要的一段缩到两行，让转折单独成段',
        quote: ''
      });
    }

    if (m.tellDensity > 2 && m.samples.tell) {
      const th = topHit(m.full, L.tellWords);
      const sn = th ? snippetAround(m.full, th.w) : null;
      push({
        id: 'tell', dim: 'character', title: '你替人物把心里话都说完了',
        severity: clamp((m.tellDensity - 1.6) * 0.34, 0.32, 0.9),
        detail: `每 100 字出现 ${m.tellDensity.toFixed(1)} 次“觉得 / 感到 / 明白 / 想起”。这些词是结论，不是证据。读者要的是能自己得出结论的材料。`,
        fix: '删掉“她觉得”，只留下让她产生这个感觉的动作',
        quote: sn && sn.quote ? sn.quote : m.samples.tell,
        word: sn ? sn.word : '', quotes: m.pools.tell
      });
    }

    if (m.tagCharacter) {
      push({
        id: 'tagperson', dim: 'character', title: '人物是形容词立起来的',
        severity: 0.55,
        detail: '稿子里出现了“是一个……的人”这样的句式。用形容词交待人，等于告诉读者“请相信他很有故事”，而不是让读者看见。',
        fix: '删掉人物鉴定，换成他做的一件反常的小事',
        quote: ''
      });
    }

    if (m.sensoryDensity < 1.6) {
      push({
        id: 'onesense', dim: 'character', title: '只有眼睛在工作',
        severity: clamp(0.3 + (1.6 - m.sensoryDensity) * 0.18, 0.28, 0.7),
        detail: `感官词密度每 100 字仅 ${m.sensoryDensity.toFixed(1)} 个，且以视觉为主。场景因此是“看到”的，而不是“待在里面”的。`,
        fix: '给这个场景补一个声音和一个触感，别的都不要加',
        quote: ''
      });
    }

    if (m.transCount <= Math.max(2, m.charCount / 500)) {
      push({
        id: 'noTurn', dim: 'plot', title: '没有转折，只有顺着写',
        severity: 0.5,
        detail: `全篇只有 ${m.transCount} 处转折标记（却 / 但是 / 不料 / 原来）。事情按时间顺序发生，没有一件事改变人物的处境。`,
        fix: '在中段安排一次“她想要的”和“她得到的”正面相撞',
        quote: ''
      });
    }

    if (m.coincCount >= 2) {
      const th = topHit(m.full, L.coincidence);
      const sn = th ? snippetAround(m.full, th.w) : null;
      push({
        id: 'coincidence', dim: 'plot', title: '转折靠“忽然”',
        severity: clamp(0.3 + m.coincCount * 0.1, 0.3, 0.8),
        detail: `“突然 / 忽然 / 没想到 / 竟然”出现 ${m.coincCount} 次。巧合可以用一次，用两次以上，读者就不肯再替人物担心了。`,
        fix: '把其中一次巧合改成人物主动做出的、有代价的选择',
        quote: sn ? sn.quote : '',
        word: sn ? sn.word : ''
      });
    }

    if (m.weakEnding) {
      push({
        id: 'ending', dim: 'plot', title: '结尾开始讲道理',
        severity: 0.72,
        detail: '最后一段从具体场景跳到了“明白了一个道理”。这一跳把前面攒下的所有具体都兑成了空话，读者被留在原地。',
        fix: '删掉最后一段议论，停在那个动作上（杯子、门、雨）',
        quote: m.ending, quotes: [m.ending].concat(m.pools.cliche.slice(0, 2))
      });
    }

    if (m.abstractCount >= 3) {
      const th = topHit(m.full, L.abstractWords);
      const sn = th ? snippetAround(m.full, th.w) : null;
      push({
        id: 'abstract', dim: 'theme', title: '主题被你说出来了',
        severity: clamp(0.32 + m.abstractCount * 0.1, 0.32, 0.85),
        detail: `“命运 / 人生 / 时间 / 青春”这类大词出现 ${m.abstractCount} 次。主题一旦被命名，读者的参与就结束了。`,
        fix: '把大词全部删掉，让它在最后那个具体动作里自己浮出来',
        quote: sn ? sn.quote : '',
        word: sn ? sn.word : ''
      });
    }

    if (m.imageDistinct <= 1 && m.imageHits.length > 0) {
      const sn = snippetAround(m.full, m.imageHits[0].phrase);
      push({
        id: 'oneimage', dim: 'theme', title: '全篇只有一个意象',
        severity: 0.45,
        detail: `反复出现的意象只有“${m.imageHits[0].phrase}”（${m.imageHits[0].count} 次）。单一意象不是不行，但它必须变奏：同一个雨，每次落下来应该不一样。`,
        fix: '让这个意象在第三次出现时改变含义',
        quote: sn.quote, word: sn.word
      });
    }

    if (m.saidCount >= 3) {
      push({
        id: 'saidtag', dim: 'dialogue', title: '说话标签在报幕',
        severity: clamp(0.28 + m.saidCount * 0.09, 0.28, 0.8),
        detail: `“说道 / 问道 / 笑道”这类标签用了 ${m.saidCount} 次。标签越整齐，对话越像剧本朗读，人物没有各自的口音。`,
        fix: '删掉大部分“说道”，改用动作和停顿区隔说话人',
        quote: m.samples.dialogue || '', quotes: m.pools.dialogue
      });
    }

    if (m.quoteCount >= 3 && m.avgQuoteLen > 0 && m.avgQuoteLen < 9) {
      push({
        id: 'flatdialogue', dim: 'dialogue', title: '对话没有潜台词',
        severity: 0.5,
        detail: `每句台词平均只有 ${m.avgQuoteLen.toFixed(0)} 字，一问一答全是“嗯”“是啊”“没有”。这是信息量为零的对话——它没有推进任何东西。`,
        fix: '让其中一个人答非所问，或者说出他真正想说的那句',
        quote: m.samples.dialogue || '', quotes: m.pools.dialogue
      });
    }

    if (m.tropes.length) {
      const sn = snippetAround(m.full, m.tropes[0]);
      push({
        id: 'trope', dim: 'novelty', title: '设定是现成的',
        severity: 0.6,
        detail: `出现了${m.tropes.map((t) => '“' + t + '”').join('、')}这类高度程式化的设定。读者在开篇就能预测整条路径。`,
        fix: '给这个设定加一条反例：让它在这个人身上失效',
        quote: sn.quote, word: sn.word
      });
    }

    if (m.imageDistinct <= 2 && m.clicheCount >= 3) {
      push({
        id: 'familiar', dim: 'novelty', title: '道具太熟了',
        severity: 0.55,
        detail: '雨、旧书店、热水、旧帆布包——每个道具都在提示读者“这是一个伤感的回忆故事”。道具一旦开始提示，惊喜就没了。',
        fix: '换掉最顺手的那件道具，用一件不合时宜的东西',
        quote: ''
      });
    }

    out.sort((a, b) => b.severity - a.severity);
    return out;
  }

  /* ---------- 维度评分 ---------- */
  function scoreDims(m) {
    const d = {};

    d.prose = 78
      + clamp((m.sdSent / Math.max(1, m.avgSent)) * 16, 0, 10)
      - clamp((m.advDensity - 1.2) * 4.2, 0, 15)
      - Math.min(13, m.clicheCount * 2.6)
      - clamp((m.deRatio - 0.04) * 380, 0, 9)
      - (m.topGram && m.topGram.count >= 4 ? 4 : 0)
      + (m.shortRatio > 0.12 ? 2 : 0);

    d.rhythm = 75
      - clamp((m.avgPara - 150) / 9, 0, 15)
      + (m.dialogueRatio >= 0.1 && m.dialogueRatio <= 0.45 ? 7 : -5)
      - (m.longRatio > 0.25 ? 7 : 0)
      + (m.shortRatio > 0.12 ? 4 : 0)
      + (m.paraCv > 0.35 ? 3 : -3);

    d.character = 74
      - clamp((m.tellDensity - 1.4) * 5, 0, 16)
      + (m.dialogueParas >= 4 ? 4 : 0)
      + (m.sensoryDensity >= 2.5 ? 6 : m.sensoryDensity >= 1.5 ? 2 : -4)
      - (m.tagCharacter ? 5 : 0);

    d.plot = 73
      + clamp(m.transCount / Math.max(1, m.charCount / 500), 0, 8)
      - (m.coincCount >= 2 ? 7 : 0)
      - (m.weakEnding ? 8 : 0)
      + (m.openingHook ? 3 : 0);

    d.theme = 74
      - clamp((m.abstractCount - 1) * 4, 0, 14)
      + (m.imageDistinct >= 3 ? 5 : 0)
      - (m.imageDistinct <= 1 ? 4 : 0);

    d.dialogue = 71
      + (m.dialogueRatio >= 0.12 && m.dialogueRatio <= 0.5 ? 8 : (m.dialogueRatio < 0.06 ? -9 : 0))
      + (m.avgQuoteLen >= 12 && m.avgQuoteLen <= 45 ? 6 : -6)
      - clamp((m.saidCount - 2) * 3, 0, 9);

    d.novelty = 78
      - Math.min(16, m.clicheCount * 2.2)
      - (m.tropes.length ? 8 : 0)
      - (m.imageDistinct <= 1 ? 5 : 0);

    DIMS.forEach((k) => { d[k] = Math.round(clamp(d[k], 38, 95)); });
    return d;
  }

  function personaName(id) {
    const p = PERSONAS.find((x) => x.id === id);
    return p ? p.name : id;
  }

  function personaDims(persona, base, rng) {
    const d = {};
    DIMS.forEach((k) => {
      const w = persona.weights[k] || 1;
      d[k] = Math.round(clamp(base[k] + (w - 1) * 8 + persona.bias * 0.8 + (rng() - 0.5) * 3, 30, 97));
    });
    return d;
  }

  function personaOverall(persona, dims, rng) {
    let num = 0, den = 0;
    DIMS.forEach((k) => {
      const w = persona.weights[k] || 1;
      num += dims[k] * w; den += w;
    });
    return Math.round(clamp(num / den + persona.bias * 1.2 + (rng() - 0.5) * 2.4, 30, 96));
  }

  /* ---------- 批评文本生成 ---------- */
  const PRAISE = {
    prose: [
      '「{q}」这句是干净的，没有多余修饰，我读到这里停了一下。',
      '「{q}」——这句我愿意留着，它没有急着解释自己。'
    ],
    rhythm: [
      '「{q}」这一句的呼吸是对的，长短刚好。',
      '「{q}」读出来是顺的，不绊。'
    ],
    character: [
      '「{q}」——人物在这里活了一下。',
      '「{q}」这个细节是人物自己长出来的，不是你按上去的。'
    ],
    plot: [
      '「{q}」这个位置放得住，前面积累的东西在这儿兑了现。'
    ],
    theme: [
      '「{q}」这句没有把话说尽，分寸是好的。'
    ],
    dialogue: [
      '「{q}」这句台词有潜台词：嘴上说一件，心里想另一件。'
    ],
    novelty: [
      '「{q}」这个处理我没在别处见过，算你的。'
    ]
  };

  const LEAD_INS = ['先说结论。', '稿子我读完了，说点实在的。', '我按我的标准讲，你别介意。', '读完两遍，我讲几句。'];

  const GENERIC_VERDICT = {
    high: ['这一版我认。', '可以拿出去见人了。'],
    mid: ['方向对，火候还差一点。', '能看，但还没到我愿意推荐的程度。'],
    low: ['这一版还得再改。', '先别急着给别人看。']
  };
  const QUOTE_INTROS = ['下面挑几句说。', '我摘几句出来讲。', '具体到句子，我看这几处。', '空话没意思，直接看句子。'];

  function impression(m) {
    const bits = [];
    bits.push(`全文 ${m.charCount} 字，${m.paraCount} 段，平均句长 ${Math.round(m.avgSent)} 字`);
    if (m.dialogueRatio < 0.06) bits.push(`对话只占 ${(m.dialogueRatio * 100).toFixed(0)}%，几乎全靠叙述在推`);
    else if (m.dialogueRatio > 0.5) bits.push(`对话占到 ${(m.dialogueRatio * 100).toFixed(0)}%，更像一个剧本片段`);
    else bits.push(`对话占 ${(m.dialogueRatio * 100).toFixed(0)}%`);
    if (m.avgPara > 165) bits.push(`一段平均 ${Math.round(m.avgPara)} 字，读者中途要换气`);
    else if (m.avgPara < 26) bits.push('段落切得很碎，像是在替读者决定呼吸');
    return bits.join('，') + '。';
  }

  function judgeLine(m, dims, rng) {
    const opts = [];
    if (dims.prose < 68) opts.push('读的时候我总感觉有个人在旁边提醒我“这里很感人”。');
    else opts.push('文字是有意识的，这一点比大多数来稿强。');
    if (m.clicheCount >= 3) opts.push('有些句子我一读就知道下一半，因为它们本来就被人写过很多次了。');
    if (m.tellDensity > 2.2) opts.push('你把人物的心理写得很清楚，清楚到我不用自己去感受了。');
    if (m.weakEnding) opts.push('最后那一段，你替读者把结论说完了。');
    return pick(rng, opts);
  }

  /* 每位读者的开场白：替代共用的数据句，让第一句话就带人设 */
  const OPEN_BY_PERSONA = {
    laozhou: (m) => '全文 ' + m.charCount + ' 字，' + m.paraCount + ' 段。我先按手艺说，不谈感动。',
    xiaoman: (m) => '我读完了，' + m.charCount + ' 字不算长，说说我自己的感受。',
    shuchong: (m) => m.charCount + ' 字，我按追更速度读的，节奏和钩子才是我关心的。',
    chen: (m) => '全文 ' + m.charCount + ' 字，结构上我挑几处说。',
    azhe: (m) => '全文 ' + m.charCount + ' 字，' + m.paraCount + ' 段，平均句长 ' + Math.round(m.avgSent) + ' 字。我把数据摆开说。',
    nanyin: (m) => m.charCount + ' 字，我试着读出声了，气口好坏耳朵最知道。',
    lengyan: (m) => m.charCount + ' 字，我读得很快——套路也认得快。'
  };

  function composeCritique(persona, m, issues, baseDims, round, seedExtra) {
    const seed = hashStr(persona.id + '|' + m.charCount + '|' + round + '|' + (seedExtra || '') + '|' + truncate(m.text, 80));
    const rng = mulberry32(seed);
    const pl = paraLocate(m.text);

    const dims = personaDims(persona, baseDims, rng);
    const score = personaOverall(persona, dims, rng);

    const ranked = DIMS.slice().sort((a, b) =>
      (dims[b] * (persona.weights[b] || 1)) - (dims[a] * (persona.weights[a] || 1)));
    const strong = ranked.slice(0, 2);
    const evidence = {
      prose: m.pools.best,
      rhythm: m.pools.short,
      character: m.pools.action.concat(m.pools.best),
      plot: m.pools.long,
      theme: m.pools.best,
      dialogue: m.pools.dialogue,
      novelty: m.pools.best
    };
    let bestStrong = null;
    let bestQuote = '';
    for (const k of strong) {
      if (dims[k] >= 70 && evidence[k] && evidence[k].length) {
        const cand = evidence[k].filter((t) => t && t.length >= 6);
        if (cand.length) { bestStrong = k; bestQuote = pick(rng, cand); break; }
      }
    }

    // 选问题：按人格权重加权，同一维度最多两条
    const weighted = issues.map((i) => ({
      issue: i,
      w: i.severity * (persona.weights[i.dim] || 0.85) + rng() * 0.12
    })).sort((a, b) => b.w - a.w);

    const used = [];
    const perDim = {};
    const limit = persona.verbosity >= 3 ? 3 : 2;
    for (const item of weighted) {
      if (used.length >= limit) break;
      const c = perDim[item.issue.dim] || 0;
      if (c >= 1) continue;
      perDim[item.issue.dim] = c + 1;
      used.push(item.issue);
    }
    if (!used.length && issues.length) used.push(issues[0]);

    const blocks = [];
    const sign = (persona.signs && persona.signs.length && rng() < 0.5)
      ? pick(rng, persona.signs) + '。' : '';
    const customOpen = OPEN_BY_PERSONA[persona.id] ? OPEN_BY_PERSONA[persona.id](m) : null;
    const openText = customOpen || (pick(rng, LEAD_INS) + impression(m));
    blocks.push({
      type: 'p',
      html: esc(sign) + esc(openText) + ' ' + esc(judgeLine(m, dims, rng))
    });

    if (bestStrong && bestQuote) {
      const line = pick(rng, PRAISE[bestStrong] || PRAISE.prose)
        .replace('{q}', truncate(bestQuote, 46));
      blocks.push({ type: 'p', html: esc((persona.praiseLead || '先记一笔好的：') + line) });
    }

    blocks.push({ type: 'p', html: esc(pick(rng, QUOTE_INTROS)) });

    const flavorOf = (dim) => {
      const f = persona.flavor;
      if (!f) return '';
      const bank = f[dim] || f._;
      return bank && bank.length ? pick(rng, bank) : '';
    };

    used.forEach((issue) => {
      const qt = (issue.quotes && issue.quotes.length) ? pick(rng, issue.quotes) : issue.quote;
      if (qt) {
        const anchor = issueAnchor(qt, m.text, pl, issue.word);
        blocks.push({
          type: 'quote',
          text: truncate(qt, 62),
          note: flavorOf(issue.dim) + (issue.id === 'cliche'
            ? issue.detail + (L.cliches.filter((w) => qt.indexOf(w) >= 0).length
              ? '（引的这句里就有“' + L.cliches.filter((w) => qt.indexOf(w) >= 0).slice(0, 3).join('”“') + '”）'
              : '')
            : issue.detail),
          para: anchor ? anchor.para : null,
          ch: anchor ? anchor.ch : 0,
          chTitle: anchor ? anchor.chTitle : ''
        });
      } else {
        blocks.push({ type: 'p', html: esc(flavorOf(issue.dim) + issue.detail) });
      }
    });

    const fixes = [];
    used.forEach((i) => { if (fixes.indexOf(i.fix) < 0) fixes.push(i.fix); });
    if (fixes.length) {
      blocks.push({ type: 'list', title: persona.fixLead || '要动，我建议这么动：', items: fixes.slice(0, 3) });
    }

    const band = score >= 82 ? 'high' : score >= 66 ? 'mid' : 'low';
    const vbank = (persona.verdict && persona.verdict[band]) || GENERIC_VERDICT[band];
    const verdict = pick(rng, vbank);
    blocks.push({
      type: 'p',
      html: esc('评价就一句：' + verdict) + ' ' + esc('这一版我给 ' + score + ' 分。')
    });

    const tags = used.slice(0, 3).map((i) => i.title);
    if (bestStrong) tags.push(DIM_LABEL[bestStrong] + '立得住');

    return {
      personaId: persona.id,
      round: round,
      score: score,
      dims: dims,
      blocks: blocks,
      issues: used.map((i) => {
        const q0 = i.quote || ((i.quotes && i.quotes.length) ? i.quotes[0] : '');
        const anchor = issueAnchor(q0, m.text, pl, i.word);
        return {
          id: i.id, dim: i.dim, title: i.title,
          severity: i.severity, detail: i.detail, fix: i.fix,
          quote: q0,
          word: i.word || '',
          para: anchor ? anchor.para : null,
          ch: anchor ? anchor.ch : 0,
          chTitle: anchor ? anchor.chTitle : ''
        };
      }),
      tags: tags,
      ts: Date.now()
    };
  }

  /* ---------- 段落 ---------- */
  function splitParagraphs(text) {
    return String(text || '').replace(/\r/g, '').split(/\n+/).map((p) => p.trim()).filter(Boolean);
  }

  function paragraphStats(p) {
    const clean = p.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
    return {
      len: clean.length,
      isDialogue: /[“"「『]/.test(p),
      adv: L.adverbs.reduce((a, w) => a + countOcc(p, w), 0),
      cliche: L.cliches.reduce((a, w) => a + countOcc(p, w), 0),
      tell: L.tellWords.reduce((a, w) => a + countOcc(p, w), 0)
    };
  }

  /* ---------- 段落定位（章节级批评落点） ----------
   * 把全文段落编号（与 splitParagraphs 下标一致），并标出每段属于第几章。
   * LLM 批评里的 para 就是这套编号：模型按【N】引用，我们按编号把批评落回段落。 */
  function paraLocate(text) {
    const paras = splitParagraphs(text);
    const chOf = paras.map(() => 0);
    const chTitleOf = paras.map(() => '');
    const chapters = [];
    const chs = splitChapters(text);
    if (chs) {
      let cursor = 0;
      chs.forEach((ch, ci) => {
        const from = cursor + 1;
        /* 真章节有标题行（标题本身就是一段）；「正文」伪章节没有，直接落段 */
        if (cursor < paras.length && paras[cursor] === ch.title) {
          chOf[cursor] = ci + 1;
          chTitleOf[cursor] = ch.title;
          cursor++;
        }
        ch.paras.forEach(() => {
          if (cursor < paras.length) { chOf[cursor] = ci + 1; chTitleOf[cursor] = ch.title; cursor++; }
        });
        chapters.push({ ch: ci + 1, title: ch.title, from: from, to: cursor });
      });
    }
    return { paras: paras, chOf: chOf, chTitleOf: chTitleOf, chapters: chapters, total: paras.length };
  }

  /* 引文落段：找到原文里包含这段引文的段落下标（0-based）。
   * pl 可传 paraLocate 的缓存结果，避免重复切分。
   * 容忍引文首尾的省略号（规则层 ±18 字窗口带 …）；引文窗口跨段时，
   * 用首尾长片段逐个段落试；再不行退回命中词（word）所在段。 */
  function issueAnchor(quote, text, pl, word) {
    const loc = pl || paraLocate(text);
    const q = String(quote || '').replace(/[…\s]+/g, '');
    if (q.length >= 4) {
      for (let i = 0; i < loc.paras.length; i++) {
        if (loc.paras[i].replace(/\s+/g, '').indexOf(q) >= 0) {
          return { para: i, ch: loc.chOf[i], chTitle: loc.chTitleOf[i] };
        }
      }
      let best = null, bestLen = 0;
      const frags = [q.slice(0, 14), q.slice(Math.max(0, q.length - 14))];
      for (let i = 0; i < loc.paras.length; i++) {
        const pc = loc.paras[i].replace(/\s+/g, '');
        frags.forEach((f) => {
          if (f.length >= 6 && pc.indexOf(f) >= 0 && f.length > bestLen) {
            best = { para: i, ch: loc.chOf[i], chTitle: loc.chTitleOf[i] };
            bestLen = f.length;
          }
        });
      }
      if (best) return best;
    }
    const w = String(word || '').replace(/\s+/g, '');
    if (w.length >= 2) {
      for (let i = 0; i < loc.paras.length; i++) {
        if (loc.paras[i].replace(/\s+/g, '').indexOf(w) >= 0) {
          return { para: i, ch: loc.chOf[i], chTitle: loc.chTitleOf[i] };
        }
      }
    }
    return null;
  }

  /* 模型自报的段落号 + 引文互相校验：
   * 自报编号有效且引文确实落在该段 → 信编号；否则退回按引文定位。 */
  function anchorFor(quote, para1based, text, pl) {
    const loc = pl || paraLocate(text);
    if (Number.isInteger(para1based) && para1based >= 1 && para1based <= loc.total) {
      const p0 = para1based - 1;
      const q = String(quote || '').replace(/\s+/g, '');
      const inPara = q ? loc.paras[p0].replace(/\s+/g, '').indexOf(q) >= 0 : false;
      if (inPara) return { para: p0, ch: loc.chOf[p0], chTitle: loc.chTitleOf[p0] };
    }
    return issueAnchor(quote, text, loc);
  }

  /* 给模型看的编号稿：每段前加【N】，超出 maxChars 截断。 */
  function numberedText(text, maxChars) {
    const paras = splitParagraphs(text);
    const out = [];
    let used = 0;
    for (let i = 0; i < paras.length; i++) {
      const seg = '【' + (i + 1) + '】' + paras[i];
      if (used + seg.length + 1 > maxChars) break;
      out.push(seg);
      used += seg.length + 1;
    }
    return { text: out.join('\n'), count: out.length };
  }

  /* 章节-段落对照表（塞进提示词，帮模型把批评落到具体章节） */
  function chapterMapLine(pl) {
    if (!pl.chapters.length) return '';
    const vis = pl.chapters.slice(0, 12);
    return '【章节分布（“第X章”对应正文里【N】的段落编号）】\n' +
      vis.map((c) => '第' + c.ch + '章《' + c.title + '》＝段' + c.from + '-' + c.to).join(' · ');
  }

  /* ---------- 追读层 · 黄金三章体检 ----------
   * 与文字层 7 维平行的网文向评测：只看前三章能不能留住追更读者。
   * 全部为确定性规则检测，不依赖模型。
   */
  const RD = L.retention || {};
  const R_DIM_LABEL = { immersion: '代入感', hook: '钩子', payoff: '爽点', expectation: '期待', conflict: '冲突', poison: '毒点' };

  function splitChapters(text) {
    const src = String(text || '').replace(/\r/g, '');
    const lines = src.split(/\n+/).map((s) => s.trim()).filter(Boolean);
    if (!lines.length) return null;
    const re = RD.chapterTitleRe;
    const found = [];
    let cur = null;
    let seenTitle = false;
    lines.forEach((line) => {
      const isTitle = re && re.test(line) && line.length <= 24;
      if (isTitle) {
        seenTitle = true;
        if (cur) found.push(cur);
        cur = { title: line, paras: [] };
      } else if (cur) {
        cur.paras.push(line);
      } else if (seenTitle) {
        found[found.length - 1].paras.push(line);
      } else {
        cur = { title: '正文', paras: [line] };
      }
    });
    if (cur) found.push(cur);
    if (!found.length || !seenTitle) return null;
    return found;
  }

  function sentencesOf(text) {
    return (String(text || '').replace(/\n/g, '').match(/[^。！？…!?;]+[。！？…!?;]?/g) || [])
      .map((s) => s.trim()).filter(Boolean);
  }

  function scoreOpeningHook(sents) {
    const first = sents[0] || '';
    let s = 30;
    if (/[“"「『]/.test(first)) s += 15;
    else if (/[?？]/.test(first)) s += 18;
    else if (RD.dangerWords.some((w) => first.indexOf(w) >= 0)) s += 20;
    else if (RD.hookEndWords.some((w) => first.indexOf(w) >= 0)) s += 12;
    else if (first.length <= 12) s += 8;
    else if (/^(他|她|我|你)/.test(first)) s += 6;
    if (/天气|下雨|刮风|太阳|清晨|傍晚|夜色|天空/.test(first) && first.length > 20) s -= 10;
    const three = sents.slice(0, 3).join('');
    if (RD.dangerWords.some((w) => three.indexOf(w) >= 0)) s += 10;
    if (RD.payoffWords.some((w) => three.indexOf(w) >= 0)) s += 10;
    if (RD.goalWords.some((w) => three.indexOf(w) >= 0)) s += 8;
    return Math.round(clamp(s, 5, 100));
  }

  function scoreEndingHook(tail) {
    const t = String(tail || '').trim();
    let s = 20;
    if (/[?？]$/.test(t)) s += 30;
    if (/…$/.test(t)) s += 18;
    else if (/[。！!]$/.test(t)) s += 5;
    const kw = RD.hookEndWords.filter((w) => t.indexOf(w) >= 0).length;
    s += Math.min(25, kw * 8);
    if (RD.dangerWords.some((w) => t.indexOf(w) >= 0)) s += 15;
    if (/[“"「『]/.test(t) && !/[”"」』]/.test(t)) s += 12;
    return Math.round(clamp(s, 5, 100));
  }

  function isInfoPara(p) {
    const pc = p.replace(/\s/g, '');
    if (pc.length < 60) return false;
    if (/[“"「『]/.test(p)) return false;
    const act = sum(RD.actionWords.map((w) => countOcc(pc, w)));
    return act < 2;
  }

  function paraRiskReasons(p) {
    const pc = String(p || '').replace(/\s/g, '');
    if (pc.length < 30) return [];
    const reasons = [];
    const act = sum(RD.actionWords.map((w) => countOcc(pc, w)));
    if (!/[“"「『]/.test(p) && pc.length > 150 && act < 2) reasons.push('长说明段');
    if (sum(RD.stoopWords.map((w) => countOcc(pc, w))) >= 1) reasons.push('憋屈点');
    if (sum(RD.saintWords.map((w) => countOcc(pc, w))) >= 1) reasons.push('圣母倾向');
    if (sum(RD.infodumpMarkers.map((w) => countOcc(pc, w))) >= 1) reasons.push('设定糊脸');
    return reasons.slice(0, 2);
  }

  /* 全文段落级风险标注，与 splitParagraphs 下标对齐，供手稿批注视图使用 */
  function paraRiskTags(text) {
    return splitParagraphs(text).map((p) => paraRiskReasons(p));
  }

  function chapterMetrics(ch, idx) {
    const text = ch.paras.join('\n');
    const clean = text.replace(/\s/g, '');
    const chars = clean.length || 1;

    const sents = sentencesOf(text);
    const openHook = scoreOpeningHook(sents.slice(0, 3));
    const endHook = scoreEndingHook(clean.slice(-160));

    const payoffCount = sum(RD.payoffWords.map((w) => countOcc(clean, w)));
    const conflictCount = sum(RD.conflictWords.map((w) => countOcc(clean, w)));
    const stoopCount = sum(RD.stoopWords.map((w) => countOcc(clean, w)));
    const saintCount = sum(RD.saintWords.map((w) => countOcc(clean, w)));
    const infodumpCount = sum(RD.infodumpMarkers.map((w) => countOcc(clean, w)));

    const infoChars = ch.paras.filter(isInfoPara).reduce((a, p) => a + p.replace(/\s/g, '').length, 0);
    const infoRatio = infoChars / chars;

    const riskParas = [];
    ch.paras.forEach((p, i) => {
      const reasons = paraRiskReasons(p);
      if (reasons.length) riskParas.push({ idx: i, quote: truncate(p, 58), reasons: reasons });
    });

    const riskLevel = (riskParas.length >= 3 || infoRatio > 0.4) ? '高'
      : (riskParas.length >= 1 || infoRatio > 0.25 || stoopCount >= 2) ? '中' : '低';

    /* 追读率预估：章末钩子权重最高（决定点不点下一章），爽点/冲突按次数计，
       说明段与憋屈/圣母按比例扣，过短章节另扣（撑不起一次期待-兑现循环） */
    const retentionEst = Math.round(clamp(
      30 + openHook * 0.25 + endHook * 0.3
      + Math.min(25, payoffCount * 6) + Math.min(20, conflictCount * 4)
      - infoRatio * 50 - Math.min(25, (stoopCount + saintCount) * 5)
      - (chars < 500 ? 10 : 0),
      15, 98
    ));

    return {
      idx, title: ch.title, chars, paraCount: ch.paras.length,
      openHook, endHook,
      payoffCount, payoffDensity: payoffCount / chars * 1000,
      conflictCount, conflictDensity: conflictCount / chars * 1000,
      stoopCount, saintCount, infodumpCount, infoRatio,
      riskLevel, riskParas, retentionEst
    };
  }

  /* 全文逐章指标：所有章节都算一遍，供内置弃读曲线使用。
   * 黄金三章体检只取前三章，但数据源是同一份。 */
  function analyzeChapters(text) {
    let chapters = splitChapters(text);
    const hasTitles = !!chapters;
    if (!chapters) {
      const paras = splitParagraphs(text);
      chapters = paras.length ? [{ title: '全篇（未检测到章节标题）', paras: paras }] : [];
    }
    if (!chapters.length) return { ok: false, hasTitles: false, totalChapters: 0, chapters: [] };
    const chs = chapters.map((c, i) => chapterMetrics(c, i));
    return { ok: true, hasTitles, totalChapters: chapters.length, chapters: chs, raw: chapters };
  }

  /* ---------- 内置逐章阅读状态机 ----------
   * 每位读者带着耐心和偏好逐章读：兴趣随钩子/爽点/冲突涨，
   * 随说明段/憋屈/圣母跌，退出意愿积累到阈值就弃读。
   * 确定性规则模拟，同一份稿子同一位读者结果稳定。 */
  const READ_PARAMS = {
    veryLow: { base: 2.2, exitThr: 1.6, boredom: 1.0 },
    low: { base: 2.6, exitThr: 1.9, boredom: 0.85 },
    mid: { base: 2.9, exitThr: 2.2, boredom: 0.7 },
    high: { base: 3.1, exitThr: 2.5, boredom: 0.55 },
    veryHigh: { base: 3.3, exitThr: 2.8, boredom: 0.45 }
  };

  const r1 = (x) => Math.round(x * 10) / 10;

  const REASON_VARIANTS = {
    info: ['说明段太多，像在看设定文档', '一大段设定砸过来，我放下了手机'],
    stoop: ['憋屈憋了几章，没等到翻盘', '一直压着打，我看得憋得慌'],
    endHook: ['章末没钩子，找不到点下一章的理由', '这章结尾没给我点下一章的理由', '结尾一平，手指就划走了'],
    openHook: ['这章开头就没抓住我', '开头半段没进入状态'],
    nothing: ['这章没发生什么，划走了', '整章没有有效信息'],
    bored: ['连着几章没新东西，兴趣耗完了', '追到这里没有动力点下一章了', '读完这章没有继续看的念头']
  };

  function exitReasonOf(c, interest, rng) {
    const pickV = (k) => REASON_VARIANTS[k][Math.floor(rng() * REASON_VARIANTS[k].length)];
    if (c.stoopCount >= 2) return pickV('stoop');
    if (c.infoRatio > 0.3) return pickV('info');
    if (c.endHook < 30) return pickV('endHook');
    if (c.openHook < 40) return pickV('openHook');
    if (c.payoffCount === 0 && c.conflictCount === 0) return pickV('nothing');
    if (interest < 1.6) return pickV('bored');
    return '耐心到顶了';
  }

  function simulateReading(text, personas) {
    const a = analyzeChapters(text);
    const list = (personas || []);
    const results = list.map((p) => {
      const params = READ_PARAMS[p.patience] || READ_PARAMS.mid;
      const seed = hashStr(p.id + '|' + truncate(String(text || ''), 200));
      const rng = mulberry32(seed);
      const w = p.weights || {};
      const hookSens = 0.9 + ((w.rhythm || 1) - 1) * 0.4;
      const plotSens = (w.plot || 1) * 0.9;
      let interest = params.base + (p.bias || 0) * 0.04 + (rng() - 0.5) * 0.3;
      let ei = 0.4;
      const log = [];
      let exit = null;
      let read = 0;
      const last = a.chapters.length - 1;
      for (let i = 0; i < a.chapters.length; i++) {
        const c = a.chapters[i];
        const gain = Math.max(0, c.openHook - 50) * 0.005 * hookSens
          + Math.max(0, c.endHook - 50) * 0.0065 * hookSens
          + Math.min(0.7, c.payoffCount * 0.15 * plotSens)
          + Math.min(0.5, c.conflictCount * 0.1 * plotSens);
        const loss = c.infoRatio * 1.8 * params.boredom
          + c.stoopCount * 0.15 * params.boredom
          + c.saintCount * 0.12 * params.boredom
          + (c.chars < 400 ? 0.18 : 0);
        interest = clamp(interest + gain - loss + (rng() - 0.5) * 0.12, 0.8, 5);
        if (interest < 1.8) ei += 0.45 + (1.8 - interest) * 0.3;
        else if (interest > 3.2) ei -= 0.3;
        ei = clamp(ei, 0, 3);
        log.push({
          chapter_index: i, title: c.title,
          interest: r1(interest), exit_intent: r1(ei),
          summary: loss > 0.5 ? '这章看得有点累' : gain > 0.45 ? '这章有东西' : '平淡过渡'
        });
        read = i + 1;
        if (ei >= params.exitThr && i < last) { exit = i; break; }
      }
      return {
        name: p.name, profile: p.id, color: p.color, patience: p.patience,
        exit_threshold: params.exitThr,
        state: {
          exit_chapter: exit, exit_reason: exit != null ? exitReasonOf(a.chapters[exit], log[exit] ? log[exit].interest : 0, rng) : '',
          chapters_read: read, reading_log: log,
          annotations: 0, total_quotes: 0, dropped_quotes: 0
        }
      };
    });
    return {
      chapters: a.ok ? a.totalChapters : 0, hasTitles: a.hasTitles, ok: a.ok,
      provider: '规则引擎', model: '内置逐章模拟', builtin: true, results
    };
  }

  function analyzeGolden(text) {
    const a = analyzeChapters(text);
    if (!a.ok) return { ok: false, hasTitles: a.hasTitles, chapters: [], scores: null };
    const first3 = a.chapters.slice(0, 3);
    const chs = first3;

    const all = a.raw.slice(0, 3).map((c) => c.paras.join('')).join('').replace(/\s/g, '');
    const chars = all.length || 1;
    const head300 = all.slice(0, 300);

    const pron = { 我: countOcc(all, '我'), 他: countOcc(all, '他'), 她: countOcc(all, '她'), 你: countOcc(all, '你') };
    const pronTotal = pron.我 + pron.他 + pron.她 + pron.你 || 1;
    const dominant = ['我', '他', '她', '你'].slice().sort((a, b) => pron[b] - pron[a])[0];
    const dominantRatio = pron[dominant] / pronTotal;
    const firstPerson = pron.我 / pronTotal;
    const earlyGoal = RD.goalWords.some((w) => head300.indexOf(w) >= 0);
    const earlySystem = RD.earlySystemRe.test(head300);

    const avgOf = (arr) => mean(arr);
    const goalCount = sum(RD.goalWords.map((w) => countOcc(all, w)));
    const promiseCount = sum(RD.promiseWords.map((w) => countOcc(all, w)));

    const scores = {
      immersion: Math.round(clamp(42 + dominantRatio * 38
        + (firstPerson >= 0.25 && firstPerson <= 0.75 ? 6 : -6)
        + (earlySystem ? 4 : 0) + (earlyGoal ? 4 : 0), 30, 96)),
      hook: Math.round(clamp(chs[0].openHook * 0.4
        + avgOf(chs.map((c) => c.openHook)) * 0.2
        + avgOf(chs.map((c) => c.endHook)) * 0.4, 30, 96)),
      payoff: Math.round(clamp(40 + avgOf(chs.map((c) => c.payoffDensity)) * 4
        - (chs.some((c) => c.payoffCount === 0) ? 6 : 0), 30, 96)),
      expectation: Math.round(clamp(40 + Math.min(30, goalCount * 5)
        + Math.min(15, promiseCount * 3) + (earlyGoal ? 8 : -8), 30, 96)),
      conflict: Math.round(clamp(42 + avgOf(chs.map((c) => c.conflictDensity)) * 3, 30, 96)),
      poison: Math.round(clamp(82
        - sum(chs.map((c) => c.stoopCount + c.saintCount + c.infodumpCount)) * 2.2
        - avgOf(chs.map((c) => c.infoRatio)) * 55, 30, 96))
    };
    const overall = Math.round(mean(Object.keys(scores).map((k) => scores[k])));

    const riskParas = [];
    chs.forEach((c) => {
      c.riskParas.forEach((rp) => riskParas.push(Object.assign({ chIdx: c.idx, chTitle: c.title }, rp)));
    });

    return {
      ok: true, hasTitles: a.hasTitles, totalChapters: a.totalChapters,
      chapters: chs, scores, overall,
      dominant, dominantRatio, firstPerson, chars,
      goalCount, promiseCount,
      riskParas: riskParas.slice(0, 8)
    };
  }

  /* ---------- 读者之间的争论 ---------- */
  function buildDebates(entries, m) {
    if (!entries || entries.length < 2) return [];
    const pairs = [];
    DIMS.forEach((k) => {
      const sorted = entries.slice().sort((a, b) => a.entry.dims[k] - b.entry.dims[k]);
      const low = sorted[0], high = sorted[sorted.length - 1];
      const spread = high.entry.dims[k] - low.entry.dims[k];
      if (spread >= 5) pairs.push({ dim: k, low: low, high: high, spread: spread });
    });
    pairs.sort((a, b) => b.spread - a.spread);

    const CHALLENGE = {
      prose: (sv, lv) => `你把文笔打到 ${lv}，我只给 ${sv}。差的这几分，是那些一眼就背得出来的句子。`,
      rhythm: (sv, lv, m) => `节奏你给 ${lv}，我给 ${sv}。${m.avgPara > 160 ? '一段 ' + Math.round(m.avgPara) + ' 字，我在第二段就开始跳行了。' : '我读到中段就想翻页，你却觉得顺。'}`,
      character: (sv, lv) => `人物 ${lv} 对 ${sv}。你信他们，我不信——他们说话都是同一个腔。`,
      plot: (sv, lv) => `情节你打 ${lv}，我打 ${sv}。读到最后我发现，这一趟什么也没改变。`,
      theme: (sv, lv) => `主题 ${lv} 对 ${sv}。你说留白，我这边只看见空。`,
      dialogue: (sv, lv) => `对话 ${lv} 对 ${sv}。台词短不是含蓄，是没话说。`,
      novelty: (sv, lv) => `新意你给 ${lv}，我只给 ${sv}。这个桥段我在别处读过。`
    };

    const DEFEND = {
      prose: (lv) => `我给 ${lv}，是因为它读起来是通的。你可以嫌它旧，但通顺不是罪。`,
      rhythm: (lv) => `我给 ${lv}，因为这是短篇，不是追更。不是每一段都得有事发生。`,
      character: (lv) => `我给 ${lv}。我信这个人，不是因为他特别，是因为他像我认识的人。`,
      plot: (lv) => `我给 ${lv}。没有反转不代表没有变化，你要的那种变化太吵了。`,
      theme: (lv) => `我给 ${lv}。把话说尽才叫空，留一点没说，是分寸。`,
      dialogue: (lv) => `我给 ${lv}。生活里的对话本来就没信息量，你要的是剧本。`,
      novelty: (lv) => `我给 ${lv}。套路用得好就不是套路，是你没耐心。`
    };

    const out = [];
    const usedPerson = {};
    pairs.slice(0, 4).forEach((p) => {
      if (out.length >= 4) return;
      if (usedPerson[p.low.persona.id] || usedPerson[p.high.persona.id]) return;
      usedPerson[p.low.persona.id] = 1;
      usedPerson[p.high.persona.id] = 1;
      const sv = p.low.entry.dims[p.dim];
      const lv = p.high.entry.dims[p.dim];
      out.push({
        fromId: p.low.persona.id,
        toId: p.high.persona.id,
        dim: p.dim,
        text: CHALLENGE[p.dim](sv, lv, m)
      });
      out.push({
        fromId: p.high.persona.id,
        toId: p.low.persona.id,
        dim: p.dim,
        text: DEFEND[p.dim](lv)
      });
    });
    return out;
  }

  /* ---------- 追问应答 ---------- */
  function stripAdverbs(s) {
    let out = String(s || '');
    L.adverbs.forEach((w) => { out = out.split(w).join(''); });
    out = out.replace(/，\s*，/g, '，').replace(/。\s*。/g, '。').replace(/，\s*。/g, '。');
    return out.replace(/\s+/g, '').trim();
  }

  function respond(persona, question, m, entry) {
    const q = String(question || '').trim();
    const dims = entry.dims || {};
    const issues = (entry.issues || []).slice();
    const strong = DIMS.slice().sort((a, b) => dims[b] - dims[a])[0];
    const weak = DIMS.slice().sort((a, b) => dims[a] - dims[b])[0];
    const blocks = [];
    const sign = () => pick(mulberry32(hashStr(q + persona.id)), persona.signs || ['']);

    // 追读层问题：基于黄金三章规则数据回答（钩子/爽点/毒点/弃读）
    if (/钩子|爽点|毒点|追读|弃读|劝退|留人|前三章|黄金三章/.test(q)) {
      const g = analyzeGolden(m && m.text);
      if (g && g.ok) {
        const order = ['hook', 'immersion', 'payoff', 'expectation', 'conflict', 'poison'];
        const weakest = order.slice().sort((a, b) => g.scores[a] - g.scores[b])[0];
        const strongest = order.slice().sort((a, b) => g.scores[b] - g.scores[a])[0];
        blocks.push({
          type: 'p',
          html: esc('追读的事我直说：前三章追读分 ' + g.overall + '。最拖后腿的是「' + R_DIM_LABEL[weakest] +
            '」（' + g.scores[weakest] + '），最站得住的是「' + R_DIM_LABEL[strongest] + '」（' + g.scores[strongest] + '）。')
        });
        if (g.riskParas && g.riskParas.length) {
          const r = g.riskParas[0];
          blocks.push({ type: 'quote', text: truncate(r.quote, 62), note: r.chTitle + ' · ' + r.reasons.join('、') + '。这是劝退风险最高的一处。' });
          const fixMap = {
            '憋屈点': '憋屈要有出口：两章内给一次反击或收获，读者替主角憋不住。',
            '圣母倾向': '心软要有代价，白原谅一次就劝退一批人。',
            '设定糊脸': '设定拆碎了喂：一次只给一条，藏进动作和对话里。',
            '长说明段': '说明段砍到 120 字以内，或者拆进对话里。'
          };
          blocks.push({ type: 'p', html: esc(fixMap[r.reasons[0]] || '先处理这一处，再谈别的。') });
        } else {
          blocks.push({
            type: 'p',
            html: esc('前三章没有检出明显劝退点。要提防的不是毒点，是「平淡」——钩子分只有 ' + g.scores.hook +
              '，把每章结尾停在新危机上。')
          });
        }
        return { blocks: blocks, personaId: persona.id };
      }
    }

    // 问句里点名了哪个维度，就按哪个维度答
    const DIM_ALIAS = [
      ['prose', /文笔|文字|语言|笔力|句子|语感|用词/],
      ['rhythm', /节奏|拖沓|快慢|呼吸|闷/],
      ['character', /人物|角色|主角|性格|动机/],
      ['plot', /情节|故事|剧情|结构|转折/],
      ['theme', /主题|立意|思想|想表达/],
      ['dialogue', /对话|台词/],
      ['novelty', /新意|创新|套路|老套|新鲜|俗/]
    ];
    const aliasHit = DIM_ALIAS.find(([, re]) => re.test(q));
    const focusDim = aliasHit ? aliasHit[0] : weak;

    const REASONS = {
      prose: `每 100 字 ${m.advDensity.toFixed(1)} 次副词、${m.clicheCount} 处熟句，句长起伏 ${m.sdSent.toFixed(1)}。`,
      rhythm: `平均段长 ${Math.round(m.avgPara)} 字，对话占 ${(m.dialogueRatio * 100).toFixed(0)}%，短句只占 ${(m.shortRatio * 100).toFixed(0)}%。`,
      character: `心理直述每 100 字 ${m.tellDensity.toFixed(1)} 次，感官词密度 ${m.sensoryDensity.toFixed(1)}。`,
      plot: `转折标记 ${m.transCount} 处，巧合标记 ${m.coincCount} 处。`,
      theme: `大词出现 ${m.abstractCount} 次，意象种类 ${m.imageDistinct} 种。`,
      dialogue: `台词 ${m.quoteCount} 句，平均 ${m.avgQuoteLen.toFixed(0)} 字，说话标签 ${m.saidCount} 个。`,
      novelty: `熟句 ${m.clicheCount} 处${m.tropes.length ? '，程式化设定 ' + m.tropes.length + ' 个' : ''}。`
    };

    if (/怎么改|如何改|建议|修改|怎么救|怎么办|救一下|改哪/.test(q)) {
      const pool = aliasHit ? issues.filter((i) => i.dim === focusDim) : issues;
      const top = pool.slice().sort((a, b) => b.severity - a.severity).slice(0, 2);
      blocks.push({ type: 'p', html: esc(aliasHit ? '你问的是「' + DIM_LABEL[focusDim] + '」，那就只在这一点上动。' : '改法不难，难的是你舍不舍得。') });
      if (top.length) {
        blocks.push({ type: 'list', items: top.map((i) => i.fix + '（针对：' + i.title + '）') });
      } else if (aliasHit) {
        blocks.push({ type: 'p', html: esc('这一项我没挑出硬伤。别为了改而改，先去动「' + DIM_LABEL[weak] + '」。') });
      } else {
        blocks.push({ type: 'p', html: esc('先说一句：这稿目前没有硬伤，别乱改。') });
      }
      blocks.push({ type: 'p', html: esc('你要是只想动一处，就动' + (top[0] ? '「' + top[0].title + '」' : '结尾') + '。') });
    } else if (/为什么|凭什么|分数|评分|打分|分低|分高/.test(q)) {
      const val = dims[focusDim];
      blocks.push({
        type: 'p',
        html: esc('「' + DIM_LABEL[focusDim] + '」这一项，我给了 ' + (val == null ? '—' : val) + ' 分，不是凭感觉。')
      });
      blocks.push({ type: 'p', html: esc(REASONS[focusDim] || '') });
      blocks.push({
        type: 'p',
        html: esc(val != null && val < 66
          ? '这一项是拖后腿的，改它收益最大。'
          : '这一项不是你的短板，但它也兜不住别的窟窿。')
      });
      blocks.push({ type: 'p', html: esc('这些数字你自己也能数。数完就知道我不是在为难你。') });
    } else if (/举例|示范|改一句|写一遍|给我看|示范一下/.test(q)) {
      const target = issues[0];
      const src = target && target.quote ? target.quote : (m.samples.adv || m.samples.tell || m.samples.longest);
      blocks.push({ type: 'p', html: esc('拿这一句开刀：') });
      blocks.push({ type: 'quote', text: truncate(src, 62), note: '把这个句子里的“程度”和“结论”先拿掉。' });
      const stripped = stripAdverbs(src);
      blocks.push({
        type: 'p',
        html: esc('机械地删一遍副词，它会变成：') + '<br><span class="rewrite">' + esc(truncate(stripped, 62)) + '</span>'
      });
      blocks.push({
        type: 'p',
        html: esc('还没完。删只是干净，接下来要把“她很难过”换成她做的一件事——杯子放下时水洒出来一点，她没擦。让读者自己得出那两个字。')
      });
    } else if (/结尾|最后|收尾|结束/.test(q)) {
      blocks.push({ type: 'p', html: esc('结尾的问题不在情绪，在位置。') });
      blocks.push({ type: 'quote', text: truncate(m.ending, 62), note: '到这里，你把话说尽了。' });
      blocks.push({ type: 'p', html: esc('删掉最后那句议论，停在动作上。读者自己会补完，你补完了，他就没事可做了。') });
    } else if (/开头|开篇|第一句|起手/.test(q)) {
      blocks.push({ type: 'p', html: esc('开头这句我留着，但它还不够狠。') });
      blocks.push({ type: 'quote', text: truncate(m.opening, 62), note: '第一句要给出一个不对劲的地方，而不是一个天气。' });
      blocks.push({ type: 'p', html: esc('把最有摩擦的那件小事提到第一行来，天气可以晚一点再下。') });
    } else if (/好|喜欢|好在哪|优点|夸/.test(q)) {
      blocks.push({
        type: 'p',
        html: esc('有。你的“' + DIM_LABEL[strong] + '”是这篇里最站得住的部分（我给了 ' + (dims[strong] || '—') + ' 分）。')
      });
      if (m.samples.best) {
        blocks.push({ type: 'quote', text: truncate(m.samples.best, 58), note: '这句是有分寸的，别在改稿时把它改没了。' });
      }
      blocks.push({ type: 'p', html: esc('但你得知道它为什么好，不然下一稿你就写不出来了。') });
    } else {
      const top = issues[0];
      blocks.push({
        type: 'p',
        html: esc('你问的这个，我只能从稿子上回答。') + (top ? esc('我先看到的是「' + top.title + '」——' + top.detail) : esc('目前稿子没有明显硬伤，问题在别处，我们再聊。'))
      });
      blocks.push({ type: 'p', html: esc('记住一句：' + sign() + '。') });
    }

    return { blocks: blocks, personaId: persona.id };
  }

  /* ---------- 精准引文：以命中词为中心截取片段 ---------- */
  function snippetAround(full, word, win) {
    const w = String(word || '');
    if (!w) return { quote: '', word: '' };
    const idx = full.indexOf(w);
    if (idx < 0) return { quote: '', word: w };
    const size = win || 18;
    const start = Math.max(0, idx - size);
    const end = Math.min(full.length, idx + w.length + size);
    let q = full.slice(start, end).replace(/\s+/g, '');
    if (start > 0) q = '…' + q;
    if (end < full.length) q = q + '…';
    return { quote: q, word: w };
  }

  /* 找出全文出现次数最多的词库词（供精准引文定位） */
  function topHit(full, bank) {
    let best = null;
    (bank || []).forEach((w) => {
      const c = countOcc(full, w);
      if (c > 0 && (!best || c > best.c)) best = { w: w, c: c };
    });
    return best;
  }

  /* ---------- 网文类型化诊断 ---------- */
  /* 内置词库与作者自定义词库合并：同 id 的自定义整表覆盖，新增 id 直接并入 */
  function mergedGenres() {
    const custom = (typeof window !== 'undefined' && window.RCS_CUSTOM_GENRES) || {};
    if (!Object.keys(custom).length) return L.genres || {};
    const out = {};
    Object.keys(L.genres || {}).forEach((k) => { out[k] = L.genres[k]; });
    Object.keys(custom).forEach((k) => {
      const c = custom[k] || {};
      const base = out[k] || {};
      out[k] = {
        label: String(c.label || base.label || k),
        aliases: Array.isArray(c.aliases) ? c.aliases : (base.aliases || []),
        payoff: Array.isArray(c.payoff) ? c.payoff : (base.payoff || []),
        hook: Array.isArray(c.hook) ? c.hook : (base.hook || []),
        trope: Array.isArray(c.trope) ? c.trope : (base.trope || []),
        payNote: base.payNote || '这类读者等的就是这个类型的核心爽点。',
        payFix: base.payFix || '安排一次类型核心爽点的完整兑现',
        hookNote: base.hookNote || '开篇要给这个类型读者熟悉的钩子。',
        hookFix: base.hookFix || '前三章给一个具体钩子，让主角立刻反应',
        tropeNote: base.tropeNote || '这些套路读者熟，要用细节做出新意。',
        tropeFix: base.tropeFix || '给套路加一条反常规的变体'
      };
    });
    return out;
  }

  function genreOf(str) {
    const s = String(str || '');
    const keys = Object.keys(mergedGenres());
    for (let i = 0; i < keys.length; i++) {
      const g = mergedGenres()[keys[i]];
      if (s.indexOf(g.label) >= 0) return keys[i];
      if ((g.aliases || []).some((a) => s.indexOf(a) >= 0)) return keys[i];
    }
    return null;
  }

  function analyzeGenre(m, id) {
    const g = mergedGenres()[id];
    if (!g || !m) return { ok: false };
    const full = m.full || String(m.text || '');
    const hit = (arr) => (arr || []).filter((w) => countOcc(full, w) > 0);
    const payoffs = hit(g.payoff);
    const hooks = hit(g.hook);
    const tropes = hit(g.trope);
    const issues = [];
    if (!payoffs.length) {
      issues.push({ id: 'g_payoff', dim: 'plot', severity: 0.68, title: '没有「' + g.label + '」爽点', detail: g.payNote, fix: g.payFix, quote: '' });
    } else if (payoffs.length === 1 && m.charCount > 600) {
      issues.push({ id: 'g_payoff_weak', dim: 'plot', severity: 0.42, title: g.label + '爽点太稀', detail: '只检出 1 处类型爽点（' + payoffs.join('、') + '），密度撑不起追更。', fix: g.payFix, quote: '' });
    }
    if (!hooks.length) {
      issues.push({ id: 'g_hook', dim: 'hook', severity: 0.62, title: '没有「' + g.label + '」钩子', detail: g.hookNote, fix: g.hookFix, quote: '' });
    }
    if (tropes.length) {
      issues.push({
        id: 'g_trope', dim: 'novelty', severity: Math.min(0.3 + tropes.length * 0.09, 0.66),
        title: '撞上「' + tropes[0] + '」老套路', detail: '检出：' + tropes.join('、') + '。' + g.tropeNote, fix: g.tropeFix, quote: ''
      });
    }
    return {
      ok: true, id: id, label: g.label,
      payoffs: payoffs, hooks: hooks, tropes: tropes,
      issues: issues,
      verdict: '类型匹配：爽点 ' + payoffs.length + ' 处、钩子 ' + hooks.length + ' 处' +
        (tropes.length ? '、套路 ' + tropes.length + ' 处' : '') +
        (issues.length ? '。缺项：' + issues.map((i) => i.title).join('、') + '。' : '。要素齐了。')
    };
  }

  const API = {
    DIMS, DIM_LABEL, PERSONAS, analyze, detectIssues, scoreDims,
    composeCritique, respond, personaName, stripAdverbs, esc, truncate,
    splitParagraphs, paragraphStats, buildDebates,
    splitChapters, analyzeGolden, analyzeChapters, simulateReading, R_DIM_LABEL, paraRiskTags,
    paraLocate, issueAnchor, anchorFor, numberedText, chapterMapLine,
    genreOf, analyzeGenre
  };

  if (typeof module !== 'undefined') module.exports = API;
  global.RCS_ENGINE = API;
})(typeof window !== 'undefined' ? window : globalThis);

})();
</script>
<script>
(function () {
/* 读者席 · 生成层 Provider 抽象
 *
 * 上层（app.js）只认一个接口：
 *     provider.composeCritique(ctx) -> Promise<critique>
 *     provider.respond(ctx)         -> Promise<{blocks}>
 *
 * 三种实现：
 *     rule       本地规则引擎（默认，$0，离线）
 *     ollama     本地 Ollama（$0，需本地跑模型）
 *     openrouter OpenRouter 免费档（$0，需 API Key）
 *
 * 关键约束（来自技术报告风险二）：
 *     LLM 生成的 quote 必须字面存在于原文，否则整条丢弃，并记录丢弃率。
 */
(function (global) {
  'use strict';

  const E = global.RCS_ENGINE;
  const DIMS = E.DIMS;
  const DIM_LABEL = E.DIM_LABEL;
  const esc = E.esc;
  const truncate = E.truncate;
  /* 章节级落点辅助（定义在引擎层，这里取本地别名） */
  const paraLocate = E.paraLocate;
  const anchorFor = E.anchorFor;
  const issueAnchor = E.issueAnchor;
  const numberedText = E.numberedText;
  const chapterMapLine = E.chapterMapLine;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ================= 规则 Provider（默认） ================= */
  const ruleProvider = {
    id: 'rule',
    label: '本地规则引擎',
    cost: '$0 · 离线可用',
    note: '不调用任何模型。用词法统计与二十条规则确定问题，再按读者权重换算分数。',
    offline: true,
    composeCritique(ctx) {
      return Promise.resolve(E.composeCritique(ctx.persona, ctx.metrics, ctx.issues, ctx.baseDims, ctx.round, ctx.seedExtra || ''))
        .then((c) => {
          const g = ctx.golden;
          if (!g || !g.ok) return c;
          const fixMap = {
            '长说明段': '把说明拆进动作和对话里，一段只讲一件事',
            '憋屈点': '憋屈要有出口：尽快安排一次反击或收获，别让读者替主角憋两章以上',
            '圣母倾向': '心软要有代价，白原谅一次就劝退一批人',
            '设定糊脸': '设定信息按需释放，别在开篇糊脸'
          };
          const retIssues = (g.riskParas || []).map((r, i) => {
            const anchor = E.issueAnchor(r.quote, ctx.metrics.text);
            return {
              id: 'ret_rule_' + i,
              dim: r.reasons[0] === '长说明段' ? 'conflict' : r.reasons[0] === '设定糊脸' ? 'hook' : 'poison',
              title: r.reasons.join('、') + '（' + r.chTitle + '）',
              severity: 3,
              detail: '「' + r.quote + '」',
              fix: fixMap[r.reasons[0]] || '先处理这一处，再谈别的',
              quote: r.quote,
              para: anchor ? anchor.para : null,
              ch: anchor ? anchor.ch : 0,
              chTitle: anchor ? anchor.chTitle : ''
            };
          });
          const verdict = '追读分 ' + g.overall + '：' +
            (g.scores.hook < 60 ? '钩子偏弱，每章结尾要停在新危机上。' : '') +
            (g.scores.payoff >= 75 ? '爽点密度够，读者的期待有交代。' : '爽点偏少，该给的回报别拖。') +
            (g.riskParas.length ? ' 有 ' + g.riskParas.length + ' 处劝退风险。' : ' 前三章没有明显劝退点。');
          c.retention = {
            dims: g.scores,
            score: g.overall,
            issues: retIssues.slice(0, 3),
            verdict: verdict,
            source: 'rule'
          };
          return c;
        });
    },
    respond(ctx) {
      return Promise.resolve(E.respond(ctx.persona, ctx.question, ctx.metrics, ctx.entry));
    },
    deepCritique() {
      return Promise.resolve(null);
    },
    test() {
      return Promise.resolve({ ok: true, msg: '规则引擎就绪，无需网络。' });
    }
  };

  /* ================= LLM Provider 公共部分 ================= */
  const LLM_IDS = { ollama: 1, openrouter: 1 };

  function defaultEndpoint(id) {
    if (id === 'ollama') return 'http://127.0.0.1:11434/v1/chat/completions';
    if (id === 'openrouter') return 'https://openrouter.ai/api/v1/chat/completions';
    return '';
  }
  function defaultModel(id) {
    if (id === 'ollama') return 'qwen2.5:7b';
    if (id === 'openrouter') return 'nvidia/nemotron-3-ultra-550b-a55b:free';
    return '';
  }
  function defaultHeaders(id, apiKey) {
    const h = { 'Content-Type': 'application/json' };
    if (id === 'openrouter') {
      h['Authorization'] = 'Bearer ' + (apiKey || '');
      h['HTTP-Referer'] = 'https://github.com/reader-seat';
      h['X-Title'] = 'Reader Seat';
    }
    return h;
  }

  /* ---------- 提示词构造 ---------- */
  function metricSummary(m) {
    if (!m) return '（无稿件数据）';
    return [
      '字数 ' + m.charCount + '，段落 ' + m.paraCount + ' 段，句均 ' + m.avgSent.toFixed(1) + ' 字（起伏 ' + m.sdSent.toFixed(1) + '）',
      '平均段长 ' + Math.round(m.avgPara) + ' 字，对话占 ' + (m.dialogueRatio * 100).toFixed(0) + '%，短句占 ' + (m.shortRatio * 100).toFixed(0) + '%',
      '副词密度 ' + m.advDensity.toFixed(2) + '/百字，熟句 ' + m.clicheCount + ' 处，心理直述 ' + m.tellDensity.toFixed(2) + '/百字',
      '转折标记 ' + m.transCount + ' 处，巧合标记 ' + m.coincCount + ' 处，意象 ' + m.imageDistinct + ' 种，台词 ' + m.quoteCount + ' 句',
      '开头第一句：' + truncate(m.opening, 40),
      '结尾最后一句：' + truncate(m.ending, 40)
    ].join('\n');
  }

  function personaBrief(p) {
    const lines = [
      '姓名：' + p.name + (p.role ? '（' + p.role + '）' : ''),
      '一句话标准：' + (p.tagline || '我有我的标准')
    ];
    if (p.bio) lines.push('背景：' + p.bio);
    if (p.likes && p.likes.length) lines.push('在意：' + p.likes.join('、'));
    if (p.hates && p.hates.length) lines.push('讨厌：' + p.hates.join('、'));
    if (p.signs && p.signs.length) lines.push('口头禅：' + p.signs.join(' / '));
    if (p.voice) lines.push('说话方式：' + p.voice);
    if (p.focus && p.focus.length) lines.push('批注时重点关注：' + p.focus.join('、'));
    if (p.patience) lines.push('耐心：' + PATIENCE_LABEL[p.patience] + '（耐心低的读者更容易在平淡处弃读）');
    if (p.readingStyle) lines.push('阅读习惯：' + p.readingStyle);
    const w = p.weights || {};
    const dimStr = DIMS.map((k) => DIM_LABEL[k] + ' ' + (w[k] != null ? Number(w[k]).toFixed(1) : '—')).join(' / ');
    lines.push('各维度重视程度：' + dimStr);
    lines.push('评分倾向：' + (p.bias > 0.5 ? '偏宽容' : p.bias < -0.5 ? '偏苛刻' : '中性'));
    return lines.join('\n');
  }

  const PATIENCE_LABEL = {
    veryLow: '极低（连续 2 章没新信息就走）',
    low: '低（3 章）',
    mid: '中（4—5 章）',
    high: '高（6—7 章）',
    veryHigh: '很高（8 章以上，基本不弃读）'
  };

  const CRITIQUE_SYSTEM = [
    '你是一个正在读稿子的真实读者，你要把自己读到的反应说出来。',
    '你只能根据下面提供的原文和你自己的阅读感受回答，不能编造原文里没有的句子。',
    '输出必须是严格 JSON，不要任何解释文字、不要 markdown 代码块。',
    'JSON 结构：',
    '{',
    '  "score": 0-100 的整数,',
    '  "dims": {"prose":整数,"rhythm":整数,"character":整数,"plot":整数,"theme":整数,"dialogue":整数,"novelty":整数},',
    '  "lead": "一句话总体印象，说你读完这稿的第一反应",',
    '  "praise": {"text": "你认可的那一处", "quote": "必须逐字复制原文里的一句"},',
    '  "points": [',
    '    {"dim": "七个维度之一", "title": "问题短标题", "detail": "具体说哪里不行，两三句，口语化",',
    '     "para": 段落编号（整数，见稿子里的【N】标号，拿不准就省略）,',
    '     "quote": "必须逐字复制原文里的一句（会做精确匹配，匹配不上整条作废，不要带【N】编号）",',
    '     "fix": "具体怎么改，一句话", "severity": 1-5}',
    '  ],',
    '  "verdict": "一句总评",',
    '  "tags": ["不超过三个的短标签"],',
    '  "retention": { 可选：追读视角，从“读者为什么点下一章”的角度评。',
    '    "dims": {"hook":整数,"immersion":整数,"payoff":整数,"expectation":整数,"conflict":整数,"poison":整数},',
    '    "points": [',
    '      {"dim": "六个追读维度之一", "title": "短标题", "detail": "哪里让读者想走，口语化",',
    '       "para": 段落编号（整数，见稿子里的【N】标号，拿不准就省略）,',
    '       "quote": "必须逐字复制原文里的一句（会做精确匹配，匹配不上整条作废，不要带【N】编号）",',
    '       "fix": "怎么改能留住读者，一句话", "severity": 1-5}',
    '    ],',
    '    "verdict": "从追读角度的一句总评"',
    '  }',
    '}',
    '稿子里每段前有【N】编号，那是段落的定位标号，不属于正文。',
    '追读层的 dims 由你按真实阅读感受自由打分（20-98），不要照抄机器给的分。'
  ].join('\n');

  const RET_DIMS = ['hook', 'immersion', 'payoff', 'expectation', 'conflict', 'poison'];

  function goldenSummary(g) {
    if (!g || !g.ok) return '';
    const lines = [
      '追读总分 ' + g.overall + '（钩子 ' + g.scores.hook + ' / 代入感 ' + g.scores.immersion +
        ' / 爽点 ' + g.scores.payoff + ' / 期待 ' + g.scores.expectation +
        ' / 冲突 ' + g.scores.conflict + ' / 毒点 ' + g.scores.poison + '）',
      g.hasTitles ? '检测到 ' + g.totalChapters + ' 章，体检只取前三章' : '未检测到章节标题，按全篇一章处理'
    ];
    g.chapters.forEach((c) => {
      lines.push('【' + c.title + '】' + c.chars + ' 字：开篇钩子 ' + c.openHook + '，章末钩子 ' + c.endHook +
        '，爽点标记 ' + c.payoffCount + ' 处，冲突标记 ' + c.conflictCount + ' 处，说明段 ' +
        Math.round(c.infoRatio * 100) + '%，风险 ' + c.riskLevel + '，追读预估 ' + c.retentionEst + '%');
    });
    if (g.riskParas && g.riskParas.length) {
      lines.push('规则检出的劝退风险段（quote 校验允许从这些段落里取引文）：');
      g.riskParas.forEach((r) => { lines.push('- ' + r.chTitle + '：「' + r.quote + '」→ ' + r.reasons.join('、')); });
    }
    return lines.join('\n');
  }

  /* 网文类型化诊断摘要（供 LLM 参考类型期待，不代替它的结论） */
  function genreSummary(g) {
    if (!g || !g.ok) return '';
    const lines = [
      '作品类型：' + g.label + '。读者进这个类型的默认期待——爽点：' +
        (g.payoffs.length ? g.payoffs.join('、') : '未检出（0 处）') +
        '；钩子：' + (g.hooks.length ? g.hooks.join('、') : '未检出（0 处）') +
        '；套路：' + (g.tropes.length ? g.tropes.join('、') : '未撞上老套路')
    ];
    (g.issues || []).forEach((i) => { lines.push('- ' + i.title + '：' + i.detail + '（建议：' + i.fix + '）'); });
    return lines.join('\n');
  }

  function buildCritiquePrompt(ctx) {
    const m = ctx.metrics;
    const hint = (ctx.issues || []).slice(0, 6).map((i) =>
      '- [' + (DIM_LABEL[i.dim] || i.dim) + '] ' + i.title + '：' + i.detail).join('\n');
    const pl = paraLocate(m.text);
    const nt = numberedText(m.text, 12000);
    const chapSec = chapterMapLine(pl);
    const gSec = goldenSummary(ctx.golden);
    const geSec = genreSummary(ctx.genre);
    return [
      '【你正在读的稿子】每段前面的【N】是段落定位标号，不属于正文，引用时不要带编号。\n' + nt.text,
      '【机器已经量到的东西（参考，不是你的结论）】\n' + metricSummary(m),
      hint ? '【机器已经挑出的可疑之处（你可以推翻，也可以顺着说）】\n' + hint : '',
      gSec ? '【黄金三章追读数据（规则引擎量的，供你参考，追读分不受它约束）】\n' + gSec : '',
      geSec ? '【作品类型与读者期待（这个类型默认要什么，缺不缺你自己判断）】\n' + geSec : '',
      chapSec,
      '【你是谁】\n' + personaBrief(ctx.persona),
      '【机器给出的参考分（你可以上下浮动，但别离谱）】',
      DIMS.map((k) => DIM_LABEL[k] + ' ' + Math.round(ctx.baseDims[k] || 0)).join(' / '),
      '现在以 ' + ctx.persona.name + ' 的口吻给出你的批评。至少挑 2 个问题，最多 4 个。' +
        '每条问题尽量填 "para"（问题所在段的【N】编号），把批评落到具体段落；拿不准就不填，我们会按你引用的句子定位。' +
        'quote 字段务必从原文里原样复制（不要改标点、不要加省略号、不要带【N】编号）。'
    ].filter(Boolean).join('\n\n');
  }

  const RESPOND_SYSTEM = [
    '你是刚刚批评完这篇稿子的读者，现在作者向你追问。',
    '回答要口语化、针对性强，像真人对话，不要写报告。',
    '如果作者问的是钩子、爽点、毒点、追读、弃读、劝退这类问题，就基于【黄金三章追读数据】回答。',
    '输出严格 JSON：{"blocks": [{"type": "p"|"quote", "text": "内容", "note": "仅 quote 类型需要，说明你为什么盯这句"}]}',
    'quote 类型的 text 必须逐字复制原文里的一句，否则该条作废。'
  ].join('\n');

  function buildRespondPrompt(ctx) {
    const m = ctx.metrics;
    const entry = ctx.entry || {};
    const dims = entry.dims || {};
    const ret = entry.retention || null;
    const gSec = goldenSummary(ctx.golden);
    return [
      '【稿子片段】\n' + String(m.text || '').slice(0, 6000),
      '【你之前给的分】综合 ' + (entry.score != null ? entry.score : '—') + '，' +
        DIMS.map((k) => DIM_LABEL[k] + ' ' + (dims[k] != null ? dims[k] : '—')).join(' / '),
      ret ? '【你之前的追读视角】追读分 ' + ret.score + '，' +
        RET_DIMS.map((k) => (E.R_DIM_LABEL[k] || k) + ' ' + (ret.dims[k] != null ? ret.dims[k] : '—')).join(' / ') : '',
      '【你之前挑的问题】\n' + ((entry.issues || []).map((i) =>
        '- ' + i.title + '：' + i.detail).join('\n') || '（无）'),
      gSec ? '【黄金三章追读数据】\n' + gSec : '',
      '【你是谁】\n' + personaBrief(ctx.persona),
      '【作者的追问】' + ctx.question
    ].filter(Boolean).join('\n\n');
  }

  /* ---------- 引用精确校验（报告风险二的落点） ---------- */
  function makeQuoteChecker(sourceText) {
    const src = String(sourceText || '').replace(/\s+/g, '');
    return function check(quote) {
      const q = String(quote || '').trim();
      if (!q) return { ok: false, reason: 'empty' };
      if (src.indexOf(q.replace(/\s+/g, '')) >= 0) return { ok: true, quote: q };
      return { ok: false, reason: 'not_found' };
    };
  }

  /* ---------- JSON 解析（容忍模型包着代码块） ---------- */
  function parseJSON(text) {
    let s = String(text || '').trim();
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();
    const a = s.indexOf('{');
    const b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
  }

  /* ---------- 通用 LLM 调用 ---------- */
  function listLocalModels(cfg) {
    // Ollama 原生 /api/tags（OpenAI 兼容层不提供列表接口）
    const base = String(cfg.endpoint || defaultEndpoint(cfg.id)).replace(/\/v1\/chat\/completions\/?$/, '');
    return fetch(base + '/api/tags')
      .then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then((j) => (j.models || []).map((m) => ({
        name: m.name,
        size: m.details && m.details.parameter_size ? m.details.parameter_size : '',
        quant: m.details && m.details.quantization_level ? m.details.quantization_level : ''
      })));
  }

  function callChat(cfg, messages) {
    const body = {
      model: cfg.model || defaultModel(cfg.id),
      messages: messages,
      temperature: cfg.temperature == null ? 0.8 : cfg.temperature,
      stream: false
    };
    const started = Date.now();
    // 请求级超时：模型服务卡死或地址不可达时，必须快速失败，由上层回退规则层，
    // 而不是让整轮批评一直挂起。浏览器与 Node18+ 均支持 AbortSignal.timeout。
    const timeoutMs = (typeof cfg.timeout === 'number' && cfg.timeout > 0) ? cfg.timeout : 240000;
    const signal = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(timeoutMs) : undefined;
    return fetch(cfg.endpoint || defaultEndpoint(cfg.id), {
      method: 'POST',
      headers: defaultHeaders(cfg.id, cfg.apiKey),
      body: JSON.stringify(body),
      signal: signal
    }).then((res) => {
      if (!res.ok) {
        return res.text().then((t) => { throw new Error('HTTP ' + res.status + ' ' + (t || '').slice(0, 200)); });
      }
      return res.json();
    }).then((json) => {
      const choice = (json.choices && json.choices[0]) || {};
      const msg = choice.message || {};
      const usage = json.usage || {};
      return {
        content: String(msg.content || ''),
        usage: {
          promptTokens: usage.prompt_tokens || 0,
          completionTokens: usage.completion_tokens || 0,
          totalTokens: usage.total_tokens || 0
        },
        elapsedMs: Date.now() - started,
        model: body.model
      };
    });
  }

  /* ---------- 把 LLM 输出拼成 critique（与规则版同构） ---------- */
  function buildCritiqueFromLLM(raw, ctx, usageInfo) {
    const m = ctx.metrics;
    const persona = ctx.persona;
    const check = makeQuoteChecker(m.text);
    const pl = paraLocate(m.text);

    const dims = {};
    let anchored = 0;
    DIMS.forEach((k) => {
      const modelV = raw && raw.dims ? Number(raw.dims[k]) : NaN;
      const baseV = Number(ctx.baseDims[k] || 60);
      if (isFinite(modelV) && modelV > 0) {
        // 确定性层是锚点：模型分不得偏离基准 ±12
        dims[k] = Math.round(clamp(modelV, baseV - 12, baseV + 12));
      } else {
        dims[k] = Math.round(clamp(baseV, 30, 97));
      }
      anchored += 1;
    });

    let num = 0, den = 0;
    DIMS.forEach((k) => {
      const w = persona.weights[k] || 1;
      num += dims[k] * w; den += w;
    });
    const score = Math.round(clamp(
      isFinite(Number(raw && raw.score)) ? Number(raw.score) : num / den,
      30, 97
    ));

    const issues = [];
    const dropped = [];
    const rawPoints = (raw && Array.isArray(raw.points)) ? raw.points : [];
    rawPoints.forEach((p) => {
      if (!p) return;
      const dim = DIMS.indexOf(p.dim) >= 0 ? p.dim : 'prose';
      const v = check(p.quote);
      if (!v.ok) {
        dropped.push({ dim: dim, reason: v.reason, quote: String(p.quote || '').slice(0, 60) });
        return;
      }
      const anchor = anchorFor(v.quote, p.para, m.text, pl);
      issues.push({
        id: 'llm_' + dim + '_' + issues.length,
        dim: dim,
        title: String(p.title || DIM_LABEL[dim] + '有问题').slice(0, 24),
        severity: clamp(Number(p.severity) || 3, 1, 5),
        detail: String(p.detail || '').slice(0, 300),
        fix: String(p.fix || '').slice(0, 200),
        quote: v.quote,
        para: anchor ? anchor.para : null,
        ch: anchor ? anchor.ch : 0,
        chTitle: anchor ? anchor.chTitle : ''
      });
    });
    // 全部被丢 → 说明模型没在引用原文，退回机器问题
    if (!issues.length && (ctx.issues || []).length) {
      const fallback = ctx.issues.slice(0, 2).map((i, k) => ({
        id: 'fallback_' + k, dim: i.dim, title: i.title, severity: i.severity,
        detail: i.detail, fix: i.fix, quote: i.quote || ''
      }));
      issues.push.apply(issues, fallback);
    }

    /* ---------- 追读层（放开锚定：模型自由打分，仅限 20-98 区间） ---------- */
    const rawRet = (raw && raw.retention) ? raw.retention : null;
    let retention = null;
    if (rawRet && rawRet.dims) {
      const rdims = {};
      RET_DIMS.forEach((k) => {
        const v = Number(rawRet.dims[k]);
        const fallbackV = (ctx.golden && ctx.golden.scores && ctx.golden.scores[k]) || 60;
        rdims[k] = isFinite(v) && v > 0
          ? Math.round(clamp(v, 20, 98))
          : Math.round(clamp(fallbackV, 20, 98));
      });
      const retIssues = [];
      const rawRetPoints = (rawRet && Array.isArray(rawRet.points)) ? rawRet.points : [];
      rawRetPoints.forEach((p) => {
        if (!p) return;
        const dim = RET_DIMS.indexOf(p.dim) >= 0 ? p.dim : 'hook';
        const v = check(p.quote);
        if (!v.ok) {
          dropped.push({ dim: 'ret_' + dim, reason: v.reason, quote: String(p.quote || '').slice(0, 60) });
          return;
        }
        const anchor = anchorFor(v.quote, p.para, m.text, pl);
        retIssues.push({
          id: 'ret_' + dim + '_' + retIssues.length,
          dim: dim,
          title: String(p.title || (E.R_DIM_LABEL[dim] || dim) + '有问题').slice(0, 24),
          severity: clamp(Number(p.severity) || 3, 1, 5),
          detail: String(p.detail || '').slice(0, 300),
          fix: String(p.fix || '').slice(0, 200),
          quote: v.quote,
          para: anchor ? anchor.para : null,
          ch: anchor ? anchor.ch : 0,
          chTitle: anchor ? anchor.chTitle : ''
        });
      });
      const rscore = Math.round(clamp(
        RET_DIMS.reduce((a, k) => a + rdims[k], 0) / RET_DIMS.length, 20, 98
      ));
      retention = {
        dims: rdims,
        score: rscore,
        issues: retIssues,
        verdict: String(rawRet.verdict || '').slice(0, 120),
        source: 'llm'
      };
    }

    const blocks = [];
    blocks.push({ type: 'p', html: esc(String((raw && raw.lead) || (persona.name + '读完了，说几句。'))) });
    if (raw && raw.praise && raw.praise.text) {
      const pv = check(raw.praise.quote);
      if (pv.ok) {
        const pa = issueAnchor(pv.quote, m.text, pl);
        blocks.push({
          type: 'p',
          html: esc((persona.praiseLead || '先记一笔好的：') + String(raw.praise.text).slice(0, 200))
        });
        blocks.push({
          type: 'quote', text: truncate(pv.quote, 62), note: '这一处我认，别在改稿时改没了。',
          para: pa ? pa.para : null, ch: pa ? pa.ch : 0, chTitle: pa ? pa.chTitle : ''
        });
      } else {
        // 夸奖位的引文同样必须字面存在，否则丢弃并计入丢弃率
        dropped.push({ dim: 'praise', reason: pv.reason, quote: String(raw.praise.quote || '').slice(0, 60) });
      }
    }
    issues.forEach((i) => {
      blocks.push({
        type: 'quote', text: truncate(i.quote, 62), note: i.detail,
        para: i.para != null ? i.para : null, ch: i.ch || 0, chTitle: i.chTitle || ''
      });
    });
    const fixes = issues.map((i) => i.fix).filter(Boolean).filter((v, k, arr) => arr.indexOf(v) === k);
    if (fixes.length) {
      blocks.push({ type: 'list', title: persona.fixLead || '要动，我建议这么动：', items: fixes.slice(0, 3) });
    }
    blocks.push({
      type: 'p',
      html: esc('评价就一句：' + String((raw && raw.verdict) || '就这些。')) + ' ' + esc('这一版我给 ' + score + ' 分。')
    });

    const tags = (raw && Array.isArray(raw.tags)) ? raw.tags.slice(0, 3).map(String)
      : issues.slice(0, 3).map((i) => i.title);

    // 丢弃率的分母 = 模型给出的全部引文（问题位 + 夸奖位 + 追读位）
    const totalQuotes = rawPoints.length + (raw && raw.praise && raw.praise.quote ? 1 : 0)
      + (rawRet && Array.isArray(rawRet.points) ? rawRet.points.length : 0);

    return {
      critique: {
        personaId: persona.id,
        round: ctx.round,
        score: score,
        dims: dims,
        blocks: blocks,
        issues: issues,
        tags: tags,
        retention: retention,
        ts: Date.now(),
        source: 'llm'
      },
      usage: Object.assign({}, usageInfo.usage, { elapsedMs: usageInfo.elapsedMs }),
      dropped: dropped,
      droppedRate: totalQuotes ? dropped.length / totalQuotes : 0
    };
  }

  function buildRespondFromLLM(raw, ctx) {
    const check = makeQuoteChecker(ctx.metrics.text);
    const blocks = [];
    const list = (raw && Array.isArray(raw.blocks)) ? raw.blocks : [];
    list.forEach((b) => {
      if (!b) return;
      if (b.type === 'quote') {
        const v = check(b.text);
        if (!v.ok) return;
        blocks.push({ type: 'quote', text: truncate(v.quote, 62), note: String(b.note || '').slice(0, 200) });
      } else {
        blocks.push({ type: 'p', html: esc(String(b.text || '').slice(0, 600)) });
      }
    });
    if (!blocks.length) {
      blocks.push({ type: 'p', html: esc('这个问题我一时答不上来，先说稿子上的事：整体还能读，但问题集中在' + DIM_LABEL[ctx.entry && ctx.entry.dims ? 'prose' : 'prose'] + '。') });
    }
    return { blocks: blocks, personaId: ctx.persona.id };
  }

  /* ---------- 深度批评（主笔整篇批评，走 LLM，无 key 时应用层降级） ---------- */
  const DEEP_SYSTEM = [
    '你是一位资深网文主笔，正在给一部书稿做整篇深度批评。',
    '你要通读全文，从整体到局部给出判断，像给作者面对面改稿，不空谈理论、不堆术语。',
    '你只能根据下面提供的原文作答，不能编造原文里没有的句子。',
    '输出必须是严格 JSON，不要任何解释文字、不要 markdown 代码块。',
    'JSON 结构：',
    '{',
    '  "lead": "开场总评，100 字以内，说清这稿子现在最关键的处境",',
    '  "strength": {"text": "全文最立得住的一个优点", "quote": "必须逐字复制原文里的一句"},',
    '  "points": [',
    '    {"dim": "七个维度之一", "title": "问题短标题", "detail": "具体说哪里不行，两三句，口语化",',
    '     "para": 段落编号（整数，见稿子里的【N】标号，拿不准就省略）,',
    '     "quote": "必须逐字复制原文里的一句（会做精确匹配，匹配不上整条作废，不要带【N】编号）",',
    '     "fix": "具体怎么改，一两句", "severity": 1-5}',
    '  ],',
    '  "order": "改稿顺序建议：先改什么、再改什么，一两句",',
    '  "verdict": "一句总评：这稿值不值得继续写下去"',
    '}',
    '稿子里每段前有【N】编号，那是段落的定位标号，不属于正文。',
    '至少挑 3 个问题，最多 6 个。每条尽量填 "para"，把批评落到具体段落。quote 务必从原文里原样复制（不改标点、不加省略号、不要带【N】编号）。'
  ].join('\n');

  function buildDeepPrompt(ctx) {
    const m = ctx.metrics;
    const pl = paraLocate(m.text);
    const nt = numberedText(m.text, 16000);
    const chapSec = chapterMapLine(pl);
    const geSec = genreSummary(ctx.genre);
    return [
      '【你正在深度批评的稿子】每段前面的【N】是段落定位标号，不属于正文，引用时不要带编号。\n' + nt.text,
      '【机器已经量到的东西（参考，不是你的结论）】\n' + metricSummary(m),
      '【黄金三章追读数据（规则引擎量的，供参考）】\n' + (goldenSummary(ctx.golden) || '（无）'),
      ctx.simSummary ? '【逐章模拟（规则引擎按读者耐心估的弃读位置）】\n' + ctx.simSummary : '',
      ctx.roundSummary ? '【这一轮读者的评分与问题（供你汇总参考）】\n' + ctx.roundSummary : '',
      geSec ? '【作品类型与读者期待（这个类型默认要什么，缺不缺你自己判断）】\n' + geSec : '',
      chapSec,
      '现在以主笔身份给出整篇深度批评。'
    ].filter(Boolean).join('\n\n');
  }

  function buildDeepFromLLM(raw, ctx, usageInfo) {
    const m = ctx.metrics;
    const check = makeQuoteChecker(m.text);
    const pl = paraLocate(m.text);
    const issues = [];
    const dropped = [];
    const rawPoints = (raw && Array.isArray(raw.points)) ? raw.points : [];
    rawPoints.forEach((p) => {
      if (!p) return;
      const dim = DIMS.indexOf(p.dim) >= 0 ? p.dim : 'prose';
      const v = check(p.quote);
      if (!v.ok) {
        dropped.push({ dim: dim, reason: v.reason, quote: String(p.quote || '').slice(0, 60) });
        return;
      }
      const anchor = anchorFor(v.quote, p.para, m.text, pl);
      issues.push({
        id: 'deep_' + dim + '_' + issues.length,
        dim: dim,
        title: String(p.title || DIM_LABEL[dim] + '有问题').slice(0, 24),
        severity: clamp(Number(p.severity) || 3, 1, 5),
        detail: String(p.detail || '').slice(0, 300),
        fix: String(p.fix || '').slice(0, 200),
        quote: v.quote,
        para: anchor ? anchor.para : null,
        ch: anchor ? anchor.ch : 0,
        chTitle: anchor ? anchor.chTitle : ''
      });
    });
    const blocks = [];
    if (raw && raw.lead) blocks.push({ type: 'p', html: esc(String(raw.lead).slice(0, 400)) });
    if (raw && raw.strength && raw.strength.text) {
      const sv = check(raw.strength.quote);
      if (sv.ok) {
        const sa = issueAnchor(sv.quote, m.text, pl);
        blocks.push({ type: 'p', html: esc('先记一处立得住的：' + String(raw.strength.text).slice(0, 160)) });
        blocks.push({
          type: 'quote', text: truncate(sv.quote, 62), note: '全稿最立得住的地方，改稿时别动它。',
          para: sa ? sa.para : null, ch: sa ? sa.ch : 0, chTitle: sa ? sa.chTitle : ''
        });
      }
    }
    issues.forEach((i) => {
      blocks.push({
        type: 'quote', text: truncate(i.quote, 62), note: i.detail,
        para: i.para != null ? i.para : null, ch: i.ch || 0, chTitle: i.chTitle || ''
      });
    });
    const fixes = issues.map((i) => i.fix).filter(Boolean).filter((v, k, arr) => arr.indexOf(v) === k);
    if (fixes.length) blocks.push({ type: 'list', title: '改法都在这：', items: fixes.slice(0, 4) });
    if (raw && raw.order) blocks.push({ type: 'p', html: esc('先改哪个后改哪个：' + String(raw.order).slice(0, 200)) });
    if (raw && raw.verdict) blocks.push({ type: 'p', html: esc('一句话结论：' + String(raw.verdict).slice(0, 200)) });
    return {
      deep: {
        blocks: blocks,
        issues: issues,
        tags: (raw && Array.isArray(raw.tags)) ? raw.tags.slice(0, 3).map(String)
          : issues.slice(0, 3).map((i) => i.title)
      },
      usage: Object.assign({}, usageInfo.usage, { elapsedMs: usageInfo.elapsedMs }),
      dropped: dropped,
      droppedRate: rawPoints.length ? dropped.length / rawPoints.length : 0
    };
  }

  function makeLLMProvider(id, label, cost, note) {
    return {
      id: id,
      label: label,
      cost: cost,
      note: note,
      offline: false,
      needsApiKey: id === 'openrouter',
      composeCritique(ctx) {
        const cfg = ctx.providerConfig || {};
        return callChat(cfg, [
          { role: 'system', content: CRITIQUE_SYSTEM },
          { role: 'user', content: buildCritiquePrompt(ctx) }
        ]).then((res) => {
          const raw = parseJSON(res.content);
