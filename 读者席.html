<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>读者席 · 作品批评工作台（单文件版）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b8482a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white'%3E%E5%B8%AD%3C/text%3E%3C/svg%3E" />
<style>
/* 读者席 · 界面样式（浅色主题） */

:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --line: #e9e9f0;
  --line-2: #dedee8;
  --text: #17171d;
  --text-2: #5b5b6b;
  --text-3: #9090a0;
  --accent: #6c5ce7;
  --accent-2: #8b7bf0;
  --accent-soft: #f0edff;
  --green: #1a9c6b;
  --amber: #d98600;
  --red: #d94848;
  --radius: 14px;
  --shadow-sm: 0 1px 2px rgba(23, 23, 29, 0.04);
  --shadow-md: 0 8px 24px rgba(23, 23, 29, 0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
textarea { font-family: inherit; }

.app {
  display: grid;
  grid-template-columns: 60px 268px minmax(0, 1fr) 312px;
  height: 100vh;
  overflow: hidden;
}

/* ---------- 左窄栏 ---------- */
.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  gap: 6px;
}

.rail-logo {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(140deg, #7b68ee, #5b4bd6);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
  margin-bottom: 14px;
  user-select: none;
}

.rail-nav { display: flex; flex-direction: column; gap: 4px; }
.rail-foot { margin-top: auto; }

.rail-btn {
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.16s;
}

.rail-btn svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.rail-btn:hover { background: #f3f2fa; color: var(--text); }
.rail-btn.active { background: var(--accent-soft); color: var(--accent); }

/* ---------- 侧边栏 ---------- */
.sidebar {
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sb-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 10px;
}

.sb-title {
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.4px;
  color: var(--text);
}

.icon-btn {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text-2);
  font-size: 16px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.sb-panel {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 12px;
}

.sb-label {
  font-size: 11px;
  color: var(--text-3);
  padding: 10px 8px 6px;
  letter-spacing: 0.6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.sb-label span { font-size: 10px; letter-spacing: 0; opacity: 0.8; }

.work-item {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  padding: 9px 10px;
  margin-bottom: 2px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  position: relative;
}

.work-item:hover { background: #f3f2f9; }
.work-item.active { background: #fff; border-color: var(--line-2); box-shadow: var(--shadow-sm); }

.wi-main { min-width: 0; flex: 1; }

.wi-title {
  font-size: 13px;
  font-weight: 560;
  color: var(--text);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wi-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 1px;
  display: block;
}

.wi-del {
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 14px;
  opacity: 0;
  padding: 0 2px;
  line-height: 1;
}

.work-item:hover .wi-del { opacity: 1; }
.wi-del:hover { color: var(--red); }

.reader-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  padding: 7px 8px;
  text-align: left;
}

.reader-row:hover { background: #f3f2f9; }
.reader-row.selected { background: #fff; border-color: var(--line-2); }

.rr-main { flex: 1; min-width: 0; }
.rr-name { display: block; font-size: 13px; font-weight: 550; }
.rr-role { display: block; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.switch {
  width: 30px;
  height: 18px;
  border-radius: 999px;
  background: #dcdce6;
  position: relative;
  flex: none;
  transition: 0.18s;
  border: 0;
  padding: 0;
}

.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: 0.18s;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
}

.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(12px); }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex: none;
  user-select: none;
  letter-spacing: 0.5px;
}

.avatar.sm { width: 28px; height: 28px; border-radius: 9px; font-size: 12px; }
.avatar.lg { width: 44px; height: 44px; border-radius: 13px; font-size: 17px; }

.sb-foot {
  border-top: 1px solid var(--line);
  padding: 10px;
}

.report-btn {
  width: 100%;
  border: 1px solid var(--line-2);
  background: #fff;
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 12.5px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: 0.16s;
}

.report-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.report-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---------- 主区 ---------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: #fdfdfe;
  position: relative;
}

.topbar {
  height: 64px;
  flex: none;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px 0 26px;
  gap: 16px;
}

.tb-left { min-width: 0; }

.tb-left h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 620;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tb-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
}

.tb-actions { display: flex; gap: 8px; flex: none; }

.btn {
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: #fff;
  color: var(--text);
  font-size: 13px;
  padding: 8px 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.16s;
  font-weight: 520;
}

.btn:hover { border-color: #c9c4f5; background: #fbfaff; }
.btn svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }

.btn.primary {
  background: linear-gradient(140deg, #7b68ee, #6152d8);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px rgba(108, 92, 231, 0.28);
}

.btn.primary:hover { filter: brightness(1.04); }
.btn.primary:disabled { opacity: 0.55; cursor: default; filter: none; box-shadow: none; }

.btn.ghost { background: #fff; }
.btn.sm { font-size: 12px; padding: 6px 11px; border-radius: 8px; }

/* 对话流 */
.stream {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 32px 8px;
}

.stream-inner {
  min-height: 100%;
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-bottom: 12px;
}

.msg { display: flex; gap: 11px; align-items: flex-start; }
.msg.bot { max-width: 100%; }
.msg.user { justify-content: flex-end; }

.msg-body { min-width: 0; flex: 1; max-width: 100%; }

.msg-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}

.msg-head .name { font-size: 13px; font-weight: 620; }
.msg-head .role { font-size: 11px; color: var(--text-3); }

.score-pill {
  font-size: 11px;
  font-weight: 660;
  padding: 1px 7px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid #e2dcff;
}

.score-pill.low { background: #fdf0f0; color: #c0392b; border-color: #f7dede; }
.score-pill.mid { background: #fff8ea; color: #b57300; border-color: #f8ecd2; }
.score-pill.high { background: #eaf7f1; color: #17795a; border-color: #d5efe4; }

.bubble {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px 14px 14px 14px;
  padding: 13px 15px;
  box-shadow: var(--shadow-sm);
  font-size: 13.5px;
  color: #24242c;
  line-height: 1.75;
}

.bubble p { margin: 0 0 10px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble b { font-weight: 650; }

.rewrite {
  display: inline-block;
  margin-top: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  background: #f7f6ff;
  border: 1px dashed #d9d2ff;
  font-family: var(--serif);
  color: #35305c;
}

.quote {
  margin: 10px 0;
  padding: 10px 13px;
  background: #faf9ff;
  border-left: 3px solid var(--accent-2);
  border-radius: 2px 10px 10px 2px;
}

.quote-text {
  font-family: var(--serif);
  font-size: 13.5px;
  color: #3b3752;
  line-height: 1.85;
  display: block;
}

.quote-text::before { content: "「"; color: var(--accent-2); }
.quote-text::after { content: "」"; color: var(--accent-2); }

.quote-note {
  display: block;
  margin-top: 7px;
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.7;
}

.fix-list {
  margin: 10px 0;
  padding: 11px 13px;
  background: #fbfbfd;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.fix-list .fl-title {
  font-size: 12px;
  font-weight: 620;
  color: var(--text-2);
  margin-bottom: 6px;
}

.fix-list ol {
  margin: 0;
  padding-left: 18px;
  font-size: 12.8px;
  color: var(--text-2);
  line-height: 1.75;
}

.fix-list li { margin-bottom: 3px; }
.fix-list li:last-child { margin-bottom: 0; }

.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }

.tag {
  font-size: 11px;
  color: var(--text-2);
  background: #f4f4f8;
  border: 1px solid #ececf3;
  padding: 1px 7px;
  border-radius: 6px;
}

.dims {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}

.dim {
  font-size: 10.5px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 4px;
}

.dim b { font-weight: 620; color: var(--text-2); font-size: 11px; }

.bubble.user-b {
  background: #f1eeff;
  border-color: #e2dcff;
  border-radius: 14px 4px 14px 14px;
  color: #2e2a45;
  max-width: 76%;
  margin-left: auto;
}

.msg.user .msg-body { flex: none; width: 100%; display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .msg-head { justify-content: flex-end; }

.system-note {
  align-self: center;
  font-size: 11.5px;
  color: var(--text-3);
  background: #f4f4f8;
  border: 1px solid var(--line);
  padding: 3px 12px;
  border-radius: 999px;
}

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-3);
  font-size: 11px;
  letter-spacing: 0.4px;
  margin: 6px 0 2px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

.typing { display: flex; gap: 11px; align-items: center; }
.typing .dots {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px 14px 14px 14px;
  padding: 12px 15px;
  display: flex;
  gap: 4px;
  box-shadow: var(--shadow-sm);
}

.dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #b7b3d6;
  animation: blink 1.2s infinite;
}

.dots i:nth-child(2) { animation-delay: 0.18s; }
.dots i:nth-child(3) { animation-delay: 0.36s; }

@keyframes blink {
  0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* 空状态 */
.empty {
  max-width: 560px;
  margin: auto;
  text-align: center;
  color: var(--text-2);
}

.empty .badge {
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: linear-gradient(140deg, #edeaff, #f7f5ff);
  border: 1px solid #e2dcff;
  color: var(--accent);
  font-size: 24px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.empty h2 { font-size: 17px; margin: 0 0 6px; color: var(--text); font-weight: 620; }
.empty p { font-size: 13px; margin: 0 0 18px; line-height: 1.85; color: var(--text-2); }

.empty .faces {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.empty .faces .avatar { margin: 0 -4px; border: 2px solid #fdfdfe; }

/* 输入区 */
.composer {
  flex: none;
  padding: 8px 32px 14px;
  background: linear-gradient(to top, #fdfdfe 70%, rgba(253, 253, 254, 0));
}

.composer > * { max-width: 780px; margin-left: auto; margin-right: auto; }

.quick-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: none;
}

.quick-chips::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  border: 1px solid var(--line-2);
  background: #fff;
  color: var(--text-2);
  border-radius: 999px;
  font-size: 11.5px;
  padding: 4px 11px;
  transition: 0.15s;
}

.chip:hover { border-color: var(--accent-2); color: var(--accent); background: #faf9ff; }

.composer-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: #fff;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  padding: 8px 8px 8px 14px;
  box-shadow: 0 2px 12px rgba(23, 23, 29, 0.05);
  transition: 0.16s;
}

.composer-box:focus-within {
  border-color: #c8c0f7;
  box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
}

.composer-box textarea {
  flex: 1;
  border: 0;
  outline: none;
  resize: none;
  font-size: 13.5px;
  line-height: 1.7;
  max-height: 132px;
  background: transparent;
  color: var(--text);
  padding: 4px 0;
}

.composer-box textarea::placeholder { color: #a9a9ba; }

.send {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: 0;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  transition: 0.16s;
}

.send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.send:hover { background: #5b4bd6; }
.send:disabled { background: #d9d9e3; cursor: default; }

.composer-hint {
  font-size: 10.5px;
  color: var(--text-3);
  margin-top: 7px;
  text-align: center;
}

/* ---------- 右侧检视栏 ---------- */
.inspector {
  background: var(--surface-2);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 16px 14px 24px;
  min-height: 0;
}

.insp-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}

.insp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 620;
  letter-spacing: 0.5px;
  color: var(--text-2);
  margin-bottom: 10px;
}

.insp-head .big {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0;
}

.insp-head .big small { font-size: 10px; color: var(--text-3); font-weight: 500; margin-left: 2px; }

.metric-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  padding: 5px 0;
  border-bottom: 1px dashed #f0f0f6;
}

.metric-row:last-child { border-bottom: 0; }
.metric-row .k { color: var(--text-3); }
.metric-row .v { color: var(--text); font-weight: 560; font-variant-numeric: tabular-nums; }
.metric-row .v.warn { color: #c07a00; }
.metric-row .v.bad { color: #c0392b; }
.metric-row .v.good { color: var(--green); }

.radar-wrap { margin: 2px -4px 6px; }

.dim-bars { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }

.dim-bar { display: grid; grid-template-columns: 34px 1fr 26px; gap: 7px; align-items: center; font-size: 11px; color: var(--text-3); }
.dim-bar .track { height: 5px; border-radius: 999px; background: #f0f0f6; overflow: hidden; }
.dim-bar .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a99bff, #6c5ce7); }
.dim-bar .num { text-align: right; font-weight: 620; color: var(--text-2); font-variant-numeric: tabular-nums; }

.spread-row {
  font-size: 11.5px;
  color: var(--text-2);
  padding: 5px 0;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.spread-row .sp { color: var(--amber); font-weight: 600; font-variant-numeric: tabular-nums; }

.persona-card .pc-top { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.persona-card .pc-name { font-size: 13px; font-weight: 630; }
.persona-card .pc-role { font-size: 11px; color: var(--text-3); }
.persona-card .pc-bio { font-size: 12px; color: var(--text-2); line-height: 1.75; margin: 0 0 9px; }

.like-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
.like-row .lb { font-size: 10.5px; color: var(--text-3); width: 26px; flex: none; line-height: 20px; }

.muted-note { font-size: 12px; color: var(--text-3); line-height: 1.8; }

/* ---------- 弹层 ---------- */
.modal-root:empty { display: none; }

.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(23, 23, 29, 0.36);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
  animation: fade 0.16s ease;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal-card {
  background: #fff;
  border-radius: 16px;
  width: 520px;
  max-width: 100%;
  max-height: 88vh;
  overflow: auto;
  box-shadow: 0 24px 64px rgba(23, 23, 29, 0.24);
  animation: pop 0.18s ease;
}

@keyframes pop { from { transform: translateY(8px) scale(0.99); opacity: 0; } to { transform: none; opacity: 1; } }

.modal-card.wide { width: 940px; }

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 20px 12px;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.modal-head h3 { margin: 0; font-size: 15.5px; font-weight: 640; }
.modal-head .sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

.modal-body { padding: 16px 20px 20px; }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px 18px;
  border-top: 1px solid var(--line);
}

.x-btn {
  border: 0;
  background: #f4f4f8;
  width: 26px;
  height: 26px;
  border-radius: 8px;
  color: var(--text-2);
  font-size: 15px;
  line-height: 1;
  flex: none;
}

.x-btn:hover { background: #ececf3; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; color: var(--text-3); margin-bottom: 6px; letter-spacing: 0.3px; }

.field input[type="text"],
.field textarea,
.field select {
  width: 100%;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 13.5px;
  outline: none;
  background: #fdfdfe;
  color: var(--text);
  transition: 0.16s;
}

.field textarea { resize: vertical; min-height: 200px; line-height: 1.85; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #c8c0f7; background: #fff; }

.field .row { display: flex; gap: 10px; }
.field .row > * { flex: 1; }

.file-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); }

.link-btn { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 0; }
.link-btn:hover { text-decoration: underline; }

.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-row .sl { font-size: 11.5px; color: var(--text-3); width: 30px; }

/* 报告 */
.report-summary {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 18px;
  align-items: stretch;
  margin-bottom: 16px;
}

.report-score {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  background: linear-gradient(180deg, #fbfaff, #fff);
}

.report-score .val { font-size: 40px; font-weight: 720; letter-spacing: -1px; line-height: 1.1; }
.report-score .val small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
.report-score .lbl { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.report-score .verdict { font-size: 12px; color: var(--text-2); margin-top: 8px; line-height: 1.6; }

.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.sec-title {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.4px;
  color: var(--text-2);
  margin: 0 0 9px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sec-title .count {
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 0 6px;
}

.consensus-item {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  background: #fdfdfe;
}

.ci-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ci-title { font-size: 12.8px; font-weight: 600; }
.ci-count { font-size: 10.5px; color: var(--text-3); flex: none; }
.ci-body { font-size: 11.8px; color: var(--text-2); line-height: 1.7; margin-top: 4px; }

.fix-check {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
  margin-bottom: 7px;
  background: #fff;
  cursor: pointer;
}

.fix-check:hover { border-color: #d7d0fb; background: #fdfcff; }
.fix-check input { margin-top: 3px; accent-color: var(--accent); }
.fix-check .ft { font-size: 12.5px; font-weight: 560; }
.fix-check .fd { font-size: 11.5px; color: var(--text-3); line-height: 1.65; margin-top: 2px; }
.fix-check.done .ft { text-decoration: line-through; color: var(--text-3); }

.mini-bars { display: flex; flex-direction: column; gap: 8px; }

.mb-row { display: grid; grid-template-columns: 40px 1fr 34px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.mb-row .track { position: relative; height: 6px; border-radius: 999px; background: #f0f0f6; }
.mb-row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #b3a6ff, #6c5ce7); }
.mb-row .num { text-align: right; font-weight: 620; color: var(--text-2); }

.report-note { font-size: 11px; color: var(--text-3); line-height: 1.75; margin-top: 10px; }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translate(-50%, 12px);
  background: #24242c;
  color: #fff;
  font-size: 12.5px;
  padding: 8px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 90;
  box-shadow: var(--shadow-md);
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #dcdce6; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #c6c6d4; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* 响应式 */
@media (max-width: 1240px) {
  .app { grid-template-columns: 60px 244px minmax(0, 1fr); }
  .inspector { display: none; }
}

@media (max-width: 860px) {
  .app { grid-template-columns: 54px minmax(0, 1fr); }
  .sidebar { display: none; }
  .stream { padding: 18px 16px 4px; }
  .composer { padding: 8px 16px 12px; }
  .topbar { padding: 0 14px; }
  .report-summary { grid-template-columns: 1fr; }
  .report-grid { grid-template-columns: 1fr; }
}

.rs-mini {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px dashed var(--line);
  font-size: 11.5px;
  color: var(--text-3);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.rs-mini b { color: var(--text-2); font-weight: 600; }

/* ================= v3：多页面 ================= */
.app.no-inspector { grid-template-columns: 60px 268px minmax(0, 1fr); }
.app.no-inspector .inspector { display: none; }

.main { overflow: hidden; }

.page {
  height: 100%;
  overflow-y: auto;
  background: var(--bg);
}

.page-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 30px 36px 64px;
}

.page-inner.narrow { max-width: 720px; }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.page-head h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: -0.3px;
  font-weight: 700;
}

.page-head p {
  margin: 5px 0 0;
  font-size: 13px;
  color: var(--text-2);
}

.head-actions { display: flex; gap: 8px; flex: none; }

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 26px;
}

.stat-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 13px 15px;
  box-shadow: var(--shadow-sm);
}

.sc-k { font-size: 11px; color: var(--text-3); letter-spacing: 0.4px; }
.sc-v { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-top: 3px; }
.sc-v small { font-size: 11px; color: var(--text-3); font-weight: 500; margin-left: 3px; letter-spacing: 0; }

.sec-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 10px;
}

.sec-hint { font-size: 11px; color: var(--text-3); }

/* 作品卡 */
.work-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.work-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px 12px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: var(--shadow-sm);
  transition: 0.16s;
  min-height: 214px;
}

.work-card:hover { border-color: #cfc7fa; box-shadow: 0 8px 22px rgba(108, 92, 231, 0.09); transform: translateY(-1px); }

.wc-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.wc-genre { font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }
.badge-stale { font-size: 10px; color: #a86a00; background: #fff6e6; border: 1px solid #f6e3bf; border-radius: 5px; padding: 1px 5px; }

.work-card h3 {
  margin: 8px 0 0;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.2px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wc-meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }

.wc-bottom { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px; }
.wc-radar { width: 92px; flex: none; margin-left: -6px; }
.wc-empty { width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; color: #d5d5e0; font-size: 20px; }
.wc-score { font-size: 30px; font-weight: 720; letter-spacing: -1px; margin-left: auto; line-height: 1; }
.wc-score small { display: block; font-size: 9.5px; color: var(--text-3); font-weight: 500; letter-spacing: 0; text-align: right; margin-top: 3px; }

.wc-issue {
  font-size: 11.5px;
  color: var(--text-2);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wc-actions { display: flex; gap: 6px; margin-top: 9px; }
.wc-actions .btn { flex: 1; justify-content: center; }

.work-card.new-card,
.reader-card.new-card {
  align-items: center;
  justify-content: center;
  border: 1.5px dashed #d8d4ee;
  background: transparent;
  color: var(--text-3);
  font-size: 12.5px;
  gap: 8px;
  box-shadow: none;
}

.work-card.new-card:hover,
.reader-card.new-card:hover {
  background: #fbfaff;
  border-color: var(--accent-2);
  color: var(--accent);
  transform: none;
}

.new-card .plus { font-size: 22px; line-height: 1; }

/* 书架下半 */
.shelf-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 26px;
}

.feed { display: flex; flex-direction: column; gap: 8px; }

.feed-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  cursor: pointer;
  transition: 0.15s;
}

.feed-item:hover { border-color: #d7d0fb; background: #fdfcff; }
.fi-main { min-width: 0; }
.fi-head { font-size: 11.5px; color: var(--text-3); }
.fi-head b { color: var(--text); font-weight: 620; }
.fi-text { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.65; }

.rp-strip { display: flex; flex-wrap: wrap; gap: 7px; }

.rp-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px 4px 4px;
  font-size: 12px;
  color: var(--text-2);
}

.rp-chip:hover { border-color: var(--accent-2); color: var(--accent); }

/* 读者卡 */
.reader-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 14px;
}

.reader-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: 0.16s;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.reader-card:hover { border-color: #cfc7fa; transform: translateY(-1px); box-shadow: 0 8px 22px rgba(108, 92, 231, 0.09); }
.rc-top { display: flex; align-items: center; gap: 10px; }
.rc-name { font-size: 14.5px; font-weight: 650; }
.rc-role { font-size: 11px; color: var(--text-3); }
.rc-tag { margin: 0; font-size: 12.5px; color: var(--text-2); font-style: italic; }
.rc-weights { display: flex; flex-wrap: wrap; gap: 5px; }
.rc-foot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-3); border-top: 1px dashed var(--line); padding-top: 8px; }

.page-note { font-size: 11.5px; color: var(--text-3); margin-top: 16px; }

/* 读者主页 */
.back-link {
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
  padding: 0;
  margin-bottom: 16px;
}

.back-link:hover { color: var(--accent); }

.reader-hero { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.rh-main h1 { margin: 0; font-size: 25px; letter-spacing: -0.3px; }
.rh-role { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.rh-tag { margin: 7px 0 0; font-size: 13px; color: var(--text-2); font-style: italic; }
.rh-actions { margin-left: auto; display: flex; gap: 8px; }
.rh-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }

.reader-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; margin-bottom: 24px; }
.detail-col { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; }

.w-bars { display: flex; flex-direction: column; gap: 8px; }
.w-row { display: grid; grid-template-columns: 42px 1fr 38px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--text-3); }
.w-row .track { height: 6px; border-radius: 999px; background: #f1f1f7; overflow: hidden; }
.w-row .fill { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #b3a6ff, #6c5ce7); }
.w-row .num { text-align: right; font-weight: 620; color: var(--text-2); }

.hist-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed #f0f0f6;
  cursor: pointer;
}

.hist-row:last-child { border-bottom: 0; }
.hist-row:hover .hr-title { color: var(--accent); }
.hr-main { flex: 1; min-width: 0; }
.hr-title { font-size: 12.5px; font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hr-title span { color: var(--text-3); font-weight: 400; font-size: 10.5px; margin-left: 4px; }
.hr-issue { font-size: 11px; color: var(--text-3); margin-top: 1px; }

.mini-tag {
  font-size: 9.5px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 5px;
  vertical-align: 3px;
  font-weight: 500;
}

/* 报告页 */
.report-toolbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.report-toolbar h1 { margin: 0; font-size: 23px; letter-spacing: -0.3px; }
.rt-meta { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
.rt-actions { display: flex; align-items: center; gap: 8px; }

.round-select {
  border: 1px solid var(--line-2);
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 12.5px;
  background: #fff;
  color: var(--text);
  outline: none;
}

.report-summary { margin-bottom: 14px; }

.mm-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.mm { font-size: 10.5px; color: var(--text-3); background: #f4f4f8; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

.delta { font-size: 10px; margin-left: 4px; font-weight: 600; }
.delta.up { color: #1a9c6b; }
.delta.down { color: #d94848; }
.delta.flat { color: var(--text-3); }

.prev-note { font-size: 11px; color: var(--text-3); margin-top: 7px; }

.score-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  border-bottom: 1px dashed #f0f0f6;
  font-size: 12px;
  cursor: pointer;
}

.score-row:hover { background: #fbfaff; }
.score-row:last-child { border-bottom: 0; }
.sr-name { font-weight: 600; flex: none; width: 50px; }
.sr-issue { flex: 1; color: var(--text-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 设置页 */
.settings-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 16px 18px;
  margin-bottom: 13px;
  box-shadow: var(--shadow-sm);
}

/* 类型词库编辑器 */
.lex-list { display: flex; flex-direction: column; gap: 7px; }
.lex-row { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lex-head {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: transparent; border: 0; cursor: pointer;
  font: inherit; text-align: left;
}
.lex-head:hover { background: #faf6ea; }
.lex-name { font-size: 13.5px; font-weight: 650; color: var(--text); }
.lex-custom { font-style: normal; font-size: 10.5px; color: #8a6d3b; background: #f3e7cf; border-radius: 999px; padding: 1px 7px; margin-left: 7px; font-weight: 600; }
.lex-stats { margin-left: auto; font-size: 12px; color: var(--text-3); }
.lex-chev { font-size: 11px; color: var(--text-3); flex: none; }
.lex-edit { padding: 4px 12px 12px; border-top: 1px dashed var(--line); background: #fdfbf5; }
.lex-edit .field { margin-bottom: 8px; }
.lex-edit textarea { resize: vertical; min-height: 42px; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* 生成层（Provider）设置 */
.prov-list { display: flex; flex-direction: column; gap: 7px; }
.prov-row {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.prov-row:hover { border-color: #c8c0f7; }
.prov-row.on { border-color: var(--accent); background: #faf9ff; }
.prov-row input { margin-top: 3px; accent-color: var(--accent); }
.prov-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.prov-main .ft { font-size: 13.5px; font-weight: 600; color: var(--text-1); }
.prov-main .fd { font-size: 11.5px; color: var(--text-3); }

.prov-detail {
  margin-top: 12px; padding: 13px 14px;
  background: #fafafd;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.prov-detail .field input[type="text"],
.prov-detail .field input[type="password"] { width: 100%; }
.prov-detail .field input[type="password"] { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }

.call-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.call-table th {
  text-align: left; font-weight: 600; color: var(--text-3);
  padding: 6px 8px; border-bottom: 1px solid var(--line);
  font-size: 11px; letter-spacing: .3px;
}
.call-table td { padding: 6px 8px; border-bottom: 1px solid #f2f2f7; color: var(--text-2); }
.call-table tr.err td { color: #c0392b; }
.call-table tr:last-child td { border-bottom: none; }

/* 捏读者：耐心档 */
.pat-list { display: flex; flex-direction: column; gap: 6px; }
.pat-opt {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px; border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer;
  font-size: 12.5px; color: var(--text-2);
  transition: border-color .15s, background .15s;
}
.pat-opt:hover { border-color: #c8c0f7; }
.pat-opt input { accent-color: var(--accent); }
.pat-opt:has(input:checked) { border-color: var(--accent); background: #faf9ff; color: var(--text-1); }

/* 逐章阅读视图 */
.ch-empty { max-width: 560px; margin: 40px auto; text-align: center; }
.ch-empty h2 { font-size: 17px; margin: 14px 0 8px; }
.ch-empty p { font-size: 13px; color: var(--text-3); line-height: 1.8; }
.ch-empty code {
  background: #f2f2f8; padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
}
.ch-empty .code {
  text-align: left; background: #f7f7fb; border: 1px solid var(--line);
  border-radius: 9px; padding: 12px 14px; margin: 14px 0 16px;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
  line-height: 1.75; color: var(--text-2); overflow-x: auto;
}
.ch-empty .btn { margin-top: 4px; }

.ch-head { margin-bottom: 18px; }
.ch-head h2 { font-size: 16px; margin: 0 0 6px; }
.ch-head p { font-size: 12.5px; color: var(--text-3); margin: 0 0 12px; }
.ch-verdict {
  display: inline-block; font-size: 12.5px; line-height: 1.6;
  padding: 8px 12px; border-radius: 8px; font-weight: 500;
}
.ch-verdict.ok { background: #eaf7ef; color: #1f7a44; border: 1px solid #bfe5cd; }
.ch-verdict.bad { background: #fdeceb; color: #b23c30; border: 1px solid #f3c4bf; }

.ch-exits { margin-bottom: 8px; }
.ch-exits .call-table td.muted-cell { color: var(--text-3); font-size: 11.5px; }

.ch-legend {
  display: flex; gap: 16px; flex-wrap: wrap;
  font-size: 12px; color: var(--text-3); margin-bottom: 12px;
}
.ch-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ch-legend .lg { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ch-legend .lg.int { background: #6c5ce7; }
.ch-legend .lg.ext { background: #e8825a; }
.ch-legend .lg.exit { background: #d63031; }

.ch-persona { margin-bottom: 20px; }
.ch-p-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.ch-p-head .ft { font-size: 13.5px; font-weight: 600; color: var(--text-1); }
.ch-p-head .fd { font-size: 11.5px; color: var(--text-3); }

.ch-grid {
  display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap;
  background: #fbfbfd; border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px;
}
.ch-cell {
  display: flex; align-items: flex-end; gap: 3px;
  position: relative; padding-bottom: 16px;
}
.ch-bar {
  width: 15px; height: 72px; background: #eeeef4; border-radius: 3px;
  display: flex; align-items: flex-end; overflow: hidden;
}
.ch-bar span { width: 100%; border-radius: 3px; }
.ch-bar.int span { background: #6c5ce7; }
.ch-bar.ext span { background: #e8825a; }
.ch-cell.exit .ch-bar { outline: 1.5px solid #d63031; outline-offset: 1px; }
.ch-cell.exit::after {
  content: '弃读'; position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; color: #d63031; font-weight: 600;
}
.ch-num {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--text-3);
}

.ch-conflicts { margin-top: 20px; }
.conf-row {
  display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid #f2f2f7;
  font-size: 12px; line-height: 1.65;
}
.conf-row:last-child { border-bottom: none; }
.cf-ch { color: var(--text-1); font-weight: 500; }
.cf-m { color: var(--text-3); }
.cf-r { color: #b23c30; }

@media (max-width: 720px) {
  .conf-row { grid-template-columns: 1fr; gap: 3px; }
}

/* 顶部视图切换 */
.seg {
  display: flex;
  background: #f2f2f8;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
  margin-right: 2px;
}

.seg button {
  border: 0;
  background: transparent;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 7px;
  color: var(--text-2);
  white-space: nowrap;
}

.seg button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(23, 23, 29, 0.07); }

.dot-stale {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--amber);
  vertical-align: 1px;
  margin-right: 2px;
}

/* 读者争论 */
.msg.debate { padding-left: 22px; }
.msg.debate .msg-body { max-width: 84%; }
.avatar.xs { width: 24px; height: 24px; border-radius: 8px; font-size: 10.5px; }
.avatar.xl { width: 62px; height: 62px; border-radius: 19px; font-size: 25px; }
.debate-bubble {
  background: #fbfaff;
  border: 1px dashed #ded7fb;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.8px;
  color: #4c4866;
  line-height: 1.7;
}

/* 手稿批注 */
.ms-stream { padding: 18px 22px 40px; }
.ms-head {
  max-width: 1180px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ms-head b { font-size: 13px; }
.ms-head span { font-size: 11px; color: var(--text-3); margin-left: 8px; }

.ms-doc {
  max-width: 1180px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 20px 14px;
  box-shadow: var(--shadow-sm);
}

.ms-para {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 268px;
  gap: 14px;
  padding: 15px 0;
  border-bottom: 1px dashed var(--line);
}

.ms-para:last-child { border-bottom: 0; }
.ms-para.has-note .ms-text { background: linear-gradient(transparent, transparent); }
.ms-no { font-size: 10.5px; color: #c3c3d2; padding-top: 5px; font-variant-numeric: tabular-nums; }
.ms-text { font-family: var(--serif); font-size: 15px; line-height: 1.95; color: #26263a; word-break: break-word; }
.ms-text.dlg { color: #3a3a55; }
.ms-text mark { background: #fff3bf; color: inherit; padding: 0 2px; border-radius: 2px; }
.ms-flags {
  display: block;
  margin-top: 5px;
  font-family: var(--font);
  font-size: 10.5px;
  color: #b57b00;
}

.ms-notes { display: flex; flex-direction: column; gap: 8px; }
.ms-note {
  border-left: 3px solid var(--accent);
  background: #fbfbfd;
  border-radius: 0 8px 8px 0;
  padding: 8px 10px;
}
.mn-head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.mn-name { font-size: 11.5px; font-weight: 650; }
.mn-title { font-size: 10.5px; color: var(--text-3); }
.mn-body { font-size: 11.5px; color: var(--text-2); line-height: 1.7; margin-top: 3px; }
.mn-fix { font-size: 10.5px; color: var(--accent); margin-top: 4px; line-height: 1.6; }

/* 弹层里的双列表单 */
.field.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field.row2 > div { min-width: 0; }

.dim-checks { display: flex; flex-wrap: wrap; gap: 7px; }
.dim-check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
  background: #fafafd;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
}
.dim-check:hover { border-color: #d7d0fb; }
.dim-check input { accent-color: var(--accent); margin: 0; }

.btn.ghost.danger { color: #c0392b; border-color: #f0d6d6; }
.btn.ghost.danger:hover { background: #fdf4f4; border-color: #e8bcbc; }

/* 响应式补充 */
@media (max-width: 1240px) {
  .app.no-inspector { grid-template-columns: 60px 244px minmax(0, 1fr); }
}

@media (max-width: 980px) {
  .shelf-grid { grid-template-columns: 1fr; }
  .reader-detail { grid-template-columns: 1fr; }
  .ms-para { grid-template-columns: 26px minmax(0, 1fr); }
  .ms-notes { grid-column: 2; margin-top: 8px; }
  .rh-stats { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 860px) {
  .app.no-inspector { grid-template-columns: 54px minmax(0, 1fr); }
  .page-inner { padding: 20px 16px 48px; }
  .page-head { flex-direction: column; gap: 10px; }
  .reader-hero { flex-wrap: wrap; }
  .rh-actions { margin-left: 0; }
  .report-toolbar { flex-direction: column; align-items: flex-start; }
  .ms-para { grid-template-columns: 22px minmax(0, 1fr); }
  .ms-doc { padding: 4px 12px 10px; }
}

/* 打印 */
@media print {
  .rail, .sidebar, .inspector, .topbar, .composer, .back-link, .rt-actions, .toast { display: none !important; }
  .app, .app.no-inspector { display: block; height: auto; }
  .main { overflow: visible; background: #fff; }
  .page { overflow: visible; height: auto; background: #fff; }
  .page-inner { max-width: none; padding: 0; }
  body { background: #fff; }
  .report-summary, .consensus-item, .fix-check, .score-row, .mm-row { page-break-inside: avoid; }
  .report-grid { grid-template-columns: 1fr 1fr; }
}

/* 细节修补 */
.sc-v.text { font-size: 15px; letter-spacing: 0; line-height: 1.5; font-weight: 620; }
.reader-detail { align-items: start; }
.on-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #1a9c6b;
  margin-right: 6px;
  vertical-align: 1px;
}
.work-grid { grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); }
.reader-grid { grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); }

.wc-unrated {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--text-3);
  border: 1px dashed var(--line-2);
  border-radius: 7px;
  padding: 3px 9px;
  align-self: center;
}

/* ---------- 黄金三章体检 ---------- */
.gold-wrap { padding: 20px 24px 44px; max-width: 880px; }
.gold-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.gold-score { font-size: 42px; font-weight: 750; color: var(--accent); line-height: 1.05; }
.gold-score span { font-size: 15px; font-weight: 600; color: var(--text-3); }
.gold-score-label { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.gold-note { max-width: 400px; font-size: 12px; color: var(--text-3); text-align: right; line-height: 1.7; }
.gold-bars { margin: 18px 0 6px; display: flex; flex-direction: column; gap: 8px; }
.rd-row { display: flex; align-items: center; gap: 10px; }
.rd-name { width: 44px; font-size: 12px; color: var(--text-2); flex: none; }
.rd-track { flex: 1; height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
.rd-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.rd-val { width: 30px; text-align: right; font-size: 12px; font-weight: 650; color: var(--text); flex: none; }
.gold-chs { display: flex; flex-direction: column; gap: 10px; }
.gold-ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.gold-ch-head { display: flex; align-items: center; gap: 10px; }
.gold-ch-title { font-weight: 650; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gold-ch-meta { font-size: 11px; color: var(--text-3); }
.risk-pill { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 999px; flex: none; }
.risk-低 { background: #e5f7ee; color: var(--green); }
.risk-中 { background: #fdf3e0; color: var(--amber); }
.risk-高 { background: #fdeaea; color: var(--red); }
.gold-ch-stats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.gstat { flex: 1; min-width: 86px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.gstat b { display: block; font-size: 17px; font-weight: 700; color: var(--text); }
.gstat i { display: block; font-style: normal; font-size: 11px; color: var(--text-3); margin-top: 1px; }
.gold-risks { display: flex; flex-direction: column; gap: 8px; }
.gold-risk { background: #fffaf5; border: 1px solid #f4e3cf; border-radius: 12px; padding: 10px 12px; }
.gold-risk-ch { font-size: 11px; color: var(--amber); font-weight: 650; }
.gold-risk-quote { font-family: var(--serif); font-size: 13px; margin: 4px 0 6px; color: var(--text); }
.gold-risk-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.gold-risk-tag { font-size: 11px; background: #fbe9dc; color: #b25a17; border-radius: 6px; padding: 1px 7px; }
.gold-risk-none { font-size: 12px; color: var(--text-3); background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px; }
.gstat.hot b { color: var(--amber); }
.gstat.hot { background: #fdf6ec; border: 1px solid #f4e3cf; }

/* ---------- 追读视角卡（批评气泡内） ---------- */
.ret-box {
  margin-top: 10px;
  background: #fdf9f2;
  border: 1px solid #f2e2c8;
  border-radius: 12px;
  padding: 10px 12px;
}
.ret-head { font-size: 12px; font-weight: 650; color: #8a5a17; display: flex; align-items: center; gap: 6px; }
.ret-head b { font-size: 15px; color: var(--amber); }
.ret-src { font-size: 10px; background: #f2e2c8; color: #8a5a17; border-radius: 5px; padding: 1px 6px; font-weight: 600; }
.ret-src.llm { background: #e8defa; color: #5b4bd6; }
.ret-dims { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ret-dim { font-size: 11px; background: #fff; border: 1px solid #f0e4cf; border-radius: 7px; padding: 2px 7px; color: var(--text-2); }
.ret-dim b { color: var(--text); font-weight: 700; }
.ret-dim.low { border-color: #f0cdcd; background: #fdf6f6; }
.ret-dim.low b { color: var(--red); }
.ret-issues { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.ret-issue { display: flex; flex-direction: column; gap: 2px; }
.ret-issue-title { font-size: 12px; font-weight: 650; color: var(--text); }
.ret-issue-detail { font-size: 12px; color: var(--text-2); line-height: 1.55; }
.ret-verdict { margin-top: 8px; font-size: 12px; color: #8a5a17; line-height: 1.6; }

/* ---------- 手稿风险标签 ---------- */
.ms-risks { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.ms-risk {
  display: inline-block;
  font-size: 11px;
  background: #fbe9dc;
  color: #b25a17;
  border-radius: 6px;
  padding: 1px 7px;
  font-weight: 600;
}

/* ============================================================
   暖纸书房风 · 主题覆盖与板块重排
   ============================================================ */
:root {
  --bg: #f3ecdd;
  --surface: #fffdf6;
  --surface-2: #f7f0e0;
  --line: #e6dac2;
  --line-2: #d9c9a9;
  --text: #2b2318;
  --text-2: #6c5e49;
  --text-3: #9b8c71;
  --accent: #6b4a2f;
  --accent-2: #d67b4c;
  --accent-soft: #f8e6d8;
  --green: #3f7a4e;
  --amber: #ad6a1c;
  --red: #b03a2e;
  --shadow-sm: 0 1px 2px rgba(93, 66, 34, 0.05);
  --shadow-md: 0 8px 24px rgba(93, 66, 34, 0.13);
}

/* —— 纸张底色 —— */
.page {
  background:
    radial-gradient(1100px 480px at 86% -6%, rgba(214, 123, 76, 0.08), transparent 62%),
    radial-gradient(900px 420px at -8% 108%, rgba(176, 106, 28, 0.06), transparent 60%),
    var(--bg);
}
.main {
  background:
    radial-gradient(1000px 420px at 92% -4%, rgba(214, 123, 76, 0.07), transparent 60%),
    #faf4e6;
}
.stream { background: transparent; }

/* —— 左窄栏 —— */
.rail { background: #fbf5e7; border-color: var(--line); }
.rail-logo {
  background: linear-gradient(140deg, #d06a3f, #a83e22);
  box-shadow: 0 4px 12px rgba(184, 72, 42, 0.3);
}
.rail-btn:hover { background: #f3e8d2; color: var(--text); }
.rail-btn.active { background: var(--accent-soft); color: var(--accent); }

/* —— 侧边栏 —— */
.sidebar { background: var(--surface-2); }
.sb-head { border-bottom: 1px solid var(--line); margin-bottom: 8px; padding-bottom: 12px; }
.sb-title { font-family: var(--serif); font-size: 14px; font-weight: 700; letter-spacing: 1px; }
.work-item:hover, .reader-row:hover { background: #f0e6cf; }
.work-item.active, .reader-row.selected { background: var(--surface); }
.switch { background: #d9c9a8; }
.switch.on { background: var(--accent); }
.icon-btn { background: var(--surface); }
.report-btn { background: var(--surface); }

/* 侧栏分组抽屉 */
.sb-group {
  margin: 0 4px 8px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fdf9ee;
  overflow: hidden;
}
.sb-group-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: transparent;
  padding: 9px 11px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--text-2);
  letter-spacing: 0.4px;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.sb-group-head:hover { background: #f4ebd6; }
.sb-group-head .chev { font-size: 9px; color: var(--text-3); transition: transform 0.18s; }
.sb-group-head .cnt {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-3);
  background: #efe4ca;
  border-radius: 999px;
  padding: 0 7px;
  line-height: 16px;
}
.sb-group.folded .chev { transform: rotate(-90deg); }
.sb-group.folded .sb-group-body { display: none; }
.sb-group-body { padding: 2px 4px 7px; }
.sb-mini-reader {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 5px 8px;
  text-align: left;
  font-size: 12px;
  color: var(--text-2);
}
.sb-mini-reader:hover { background: #f0e6cf; color: var(--text); }
.sb-mini-reader .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: #c7b38d; flex: none; }
.sb-mini-reader.on .dot { background: var(--green); }

/* —— 顶栏 —— */
.topbar { background: rgba(255, 252, 244, 0.94); border-color: var(--line); }
.tb-left h1 { font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.btn { background: var(--surface); }
.btn:hover { border-color: #e2b98f; background: #fdf3e3; }
.btn.primary {
  background: linear-gradient(140deg, #d06a3f, #a83e22);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 14px rgba(184, 72, 42, 0.26);
}
.btn.ghost { background: var(--surface); }
.btn-insp-toggle.insp-on { background: var(--accent-soft); border-color: #eccdb6; color: var(--accent); }

/* —— 整页大页签 —— */
.view-tabs {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px 26px 0;
  background: #fbf5e7;
  border-bottom: 1px solid var(--line);
}
.view-tab {
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px 10px;
  font-size: 13px;
  color: var(--text-2);
  border-bottom: 2.5px solid transparent;
  border-radius: 9px 9px 0 0;
  transition: 0.15s;
  white-space: nowrap;
}
.view-tab:hover { color: var(--text); background: #f4ead3; }
.view-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; background: #f8ecda; }
.view-tab .vt-ico {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.view-tab .vt-ico svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.view-tab .vt-txt { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
.view-tab .vt-txt small { font-size: 10.5px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
.view-tab.on .vt-txt small { color: var(--amber); }

/* —— 对话流 —— */
.bubble { background: var(--surface); color: #33291c; }
.bubble.user-b { background: #f6e7d8; border-color: #e9cbb2; color: #4a3826; }
.rewrite { background: #f8eeda; border: 1px dashed #d9b98f; color: #57452f; }
.quote { background: #faf2e2; border-left-color: var(--accent-2); }
.quote-text { color: #4a3826; }
.quote-text::before, .quote-text::after { color: var(--accent-2); }
.fix-list { background: #f8f1e1; }
.tag { background: #f1e8d2; border-color: #e6d9bb; }
.score-pill { border-color: #eccdb6; }
.system-note { background: #f1e8d2; }
.typing .dots { background: var(--surface); }
.dots i { background: #d8c19b; }

/* —— 空状态 —— */
.empty .badge {
  background: linear-gradient(140deg, #f6ddc8, #faf0df);
  border-color: #ecd3b4;
  color: var(--accent);
}
.empty .faces .avatar { border-color: var(--surface); }
.empty h2 { font-family: var(--serif); font-weight: 700; }

/* —— 输入区 —— */
.composer { background: linear-gradient(to top, #faf4e6 70%, rgba(250, 244, 230, 0)); }
.chip:hover { background: #fdf3e3; }
.composer-box { background: var(--surface); box-shadow: 0 2px 12px rgba(93, 66, 34, 0.07); }
.composer-box:focus-within { border-color: #dc9a72; box-shadow: 0 0 0 3px rgba(184, 72, 42, 0.09); }
.composer-box textarea::placeholder { color: #b0a083; }
.send { background: var(--accent); }
.send:hover { background: #a03a20; }
.send:disabled { background: #d9cdb5; }

/* —— 右侧检视栏：分组 + 折叠 —— */
.inspector { background: var(--surface-2); border-color: var(--line); }
.insp-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px 12px;
}
.insp-title { font-family: var(--serif); font-size: 14.5px; font-weight: 700; letter-spacing: 1px; color: var(--text); }
.insp-group {
  margin-bottom: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.insp-group-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: transparent;
  padding: 11px 13px;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.5px;
  color: var(--text-2);
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.insp-group-head:hover { background: #f8f1e1; }
.insp-group-head .big { margin-left: auto; }
.ig-chev { font-size: 9px; color: var(--text-3); transition: transform 0.18s; }
.insp-group.folded .ig-chev { transform: rotate(-90deg); }
.insp-group.folded .insp-group-body { display: none; }
.insp-group-body { padding: 0 13px 13px; }
.metric-row { border-bottom-color: #ecdfc9; }
.dim-bar .track, .mb-row .track, .w-row .track { background: #ecdfc9; }
.dim-bar .fill, .mb-row .fill, .w-row .fill { background: linear-gradient(90deg, #e39a66, #b8482a); }
.insp-group-head .big { font-size: 18px; font-weight: 720; color: var(--text); letter-spacing: -0.3px; }
.insp-group-head .big small { font-size: 10px; color: var(--text-3); font-weight: 500; margin-left: 2px; }
.insp-sub { font-size: 11px; font-weight: 650; letter-spacing: 0.4px; color: var(--text-2); margin-bottom: 6px; }

/* 检视栏整体收起 */
.app.insp-hidden { grid-template-columns: 60px 268px minmax(0, 1fr); }
.app.insp-hidden .inspector { display: none; }
@media (max-width: 1240px) {
  .app.insp-hidden { grid-template-columns: 60px 244px minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app.insp-hidden { grid-template-columns: 54px minmax(0, 1fr); }
}

/* —— 弹层 —— */
.modal-mask { background: rgba(74, 52, 26, 0.4); }
.modal-card { background: var(--surface); }
.modal-head h3 { font-family: var(--serif); font-weight: 700; letter-spacing: 0.5px; }
.x-btn { background: #f1e8d2; }
.x-btn:hover { background: #e6d9bb; }
.field input[type="text"], .field textarea, .field select { background: #fdf9ee; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #dc9a72; background: var(--surface); }
.dim-check { background: #f8f1e1; }
.dim-check:hover { border-color: #dc9a72; }

/* —— 书架 —— */
.stat-card, .work-card, .reader-card, .feed-item, .rp-chip, .detail-col, .settings-card, .fix-check, .ms-doc, .round-select { background: var(--surface); }
.work-card:hover, .reader-card:hover { border-color: #e2b98f; box-shadow: 0 8px 22px rgba(184, 72, 42, 0.1); }
.work-card h3 { font-family: var(--serif); font-weight: 700; font-size: 16.5px; }
.work-card.new-card, .reader-card.new-card { border-color: #d5c096; }
.work-card.new-card:hover, .reader-card.new-card:hover { background: #fdf3e3; border-color: var(--accent-2); }
.feed-item:hover { border-color: #e2b98f; background: #fdf3e3; }
.wc-empty { color: #d6c6a6; }

/* 作品卡封面带 */
.work-card { min-height: 0; }
.wc-cover {
  position: relative;
  height: 54px;
  border-radius: 10px;
  display: flex;
  align-items: flex-end;
  padding: 8px 11px;
  overflow: hidden;
}
.wc-cover.c0 { background: linear-gradient(135deg, #e9b98a, #c4704a); }
.wc-cover.c1 { background: linear-gradient(135deg, #e3c48a, #b98a4e); }
.wc-cover.c2 { background: linear-gradient(135deg, #d9a98a, #a96a52); }
.wc-cover.c3 { background: linear-gradient(135deg, #c9a06e, #9c7444); }
.wc-cover-char {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 700;
  color: rgba(255, 251, 240, 0.93);
  line-height: 1;
  letter-spacing: 2px;
  text-shadow: 0 1px 3px rgba(60, 35, 10, 0.22);
}
.wc-cover .wc-genre {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(255, 251, 240, 0.88);
  color: #7c4a26;
}
.wc-cover .badge-stale { position: absolute; bottom: 8px; right: 8px; background: rgba(255, 251, 240, 0.9); border-color: transparent; }

/* —— 读者团 —— */
.reader-hero {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.rh-main h1, .page-head h1, .report-toolbar h1 { font-family: var(--serif); font-weight: 700; letter-spacing: 0.5px; }
.rc-tag { color: var(--text-2); }
.hist-row { border-bottom-color: #ecdfc9; }
.w-row .track { background: #ecdfc9; }
.w-row .fill { background: linear-gradient(90deg, #e39a66, #b8482a); }

/* —— 报告 —— */
.report-score { background: linear-gradient(180deg, #fdf3e0, var(--surface)); }
.report-score .val { color: var(--accent); }
.consensus-item { background: #fdfaf1; }
.fix-check:hover { border-color: #e2b98f; background: #fdf3e3; }
.score-row { border-bottom-color: #ecdfc9; }
.score-row:hover { background: #fdf3e3; }
.mm { background: #f1e8d2; }

/* 章节标题小标记 */
.sec-title::before {
  content: "";
  width: 4px;
  height: 13px;
  border-radius: 2px;
  background: var(--accent);
  flex: none;
}

/* —— 设置 / Provider —— */
.prov-row:hover { border-color: #dc9a72; }
.prov-row.on { background: #fdf3e3; }
.prov-detail { background: #f8f1e1; }
.pat-opt:hover { border-color: #dc9a72; }
.pat-opt:has(input:checked) { background: #fdf3e3; }
.call-table td { border-bottom-color: #ecdfc9; }

/* —— 逐章阅读 —— */
.ch-empty code { background: #f0e7d2; }
.ch-empty .code { background: #f7f0e0; }
.ch-grid { background: #f8f1e1; }
.ch-bar { background: #e9dcc2; }
.ch-bar.int span { background: #b8482a; }
.ch-legend .lg.int { background: #b8482a; }
.conf-row { border-bottom-color: #ecdfc9; }

/* —— 读者争论 —— */
.debate-bubble { background: #f8f1e1; border-color: #ddcfae; color: #57452f; }

/* —— 手稿批注 —— */
.ms-no { color: #c4b393; }
.ms-text { color: #33291c; }
.ms-text.dlg { color: #4a3a28; }
.ms-note { background: #f8f1e1; }

/* —— 三章体检 —— */
.gold-ch { background: var(--surface); }
.rd-track { background: #e9dcc2; }
.rd-fill { background: linear-gradient(90deg, #d67b4c, #b8482a); }
.gstat { background: var(--surface-2); }

/* —— toast / 滚动条 —— */
.toast { background: #3c2f21; }
::-webkit-scrollbar-thumb { background: #d5c4a4; }
::-webkit-scrollbar-thumb:hover { background: #c2ad88; }

/* —— 弃读曲线 —— */
.curve-wrap { max-width: 1080px; }
.curve-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.curve-head h2 { font-family: var(--serif); font-size: 20px; color: var(--text); margin: 0 0 4px; }
.curve-head p { margin: 0; color: var(--text-3); font-size: 12.5px; }
.curve-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.curve-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
.curve-stat b { display: block; font-size: 21px; color: var(--accent); font-weight: 700; }
.curve-stat.warn b { color: var(--red); }
.curve-stat i { font-style: normal; font-size: 12px; color: var(--text-3); }
.curve-legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 4px 0 10px; color: var(--text-2); font-size: 12px; }
.curve-legend span { display: flex; align-items: center; gap: 6px; }
.curve-legend .lg { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.curve-legend .lg.ret { background: #b8482a; }
.curve-legend .lg.cum { background: #3f7a4e; }
.curve-legend .lg.drop { background: #b03a2e; }
.curve-legend .lg.poi { background: #ad6a1c; }
.curve-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px 6px; box-shadow: var(--shadow-sm); }
.curve-svg { display: block; }
.curve-drops { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.curve-drop-card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow-sm); }
.curve-drop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 7px; }
.curve-drop-ch { font-weight: 650; color: var(--text); font-size: 13.5px; }
.curve-drop-arrow { color: var(--red); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.curve-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.curve-tag { font-size: 11.5px; background: #f8ead9; color: #8a4a24; border: 1px solid #ecd3b6; border-radius: 999px; padding: 2px 9px; }
.curve-tag.none { background: transparent; border-style: dashed; color: var(--text-3); }
.curve-table td { padding: 8px 10px; font-size: 12.5px; }
.curve-table .tt { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.curve-table tr.drop td { background: #fbeee5; }
.curve-table tr.low td { background: #fbf4e7; }
.curve-table tr.drop td:first-child { border-left: 3px solid var(--red); }
.curve-table tr.low td:first-child { border-left: 3px solid var(--amber); }

/* —— 书架工具条 —— */
.shelf-tools { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
.shelf-search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.shelf-search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 13px; outline: none; }
.shelf-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.shelf-search .ss-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.shelf-sort { display: flex; gap: 6px; flex-wrap: wrap; }
.shelf-sort .ss-opt { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; }
.shelf-sort .ss-opt:hover { border-color: #e2b98f; color: var(--text); }
.shelf-sort .ss-opt.on { background: var(--accent-soft); border-color: #eccdb6; color: var(--accent); font-weight: 650; }
.shelf-empty { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line-2); border-radius: 12px; padding: 34px 20px; text-align: center; color: var(--text-3); font-size: 13.5px; }

/* —— 专注模式 —— */
.app.focus { grid-template-columns: 60px minmax(0, 1fr); }
.app.focus .sidebar { display: none; }
.app.focus .inspector { display: none; }
.app.focus .btn-insp-toggle { display: none; }
.btn-focus.on { background: var(--accent-soft); border-color: #eccdb6; color: var(--accent); }

/* —— 曲线模式切换 / 分读者 —— */
.curve-mode { display: flex; gap: 6px; margin: 2px 0 12px; }
.curve-mode .cm-opt { border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 5px 14px; font-size: 12.5px; cursor: pointer; }
.curve-mode .cm-opt:hover { border-color: #e2b98f; color: var(--text); }
.curve-mode .cm-opt.on { background: var(--accent-soft); border-color: #eccdb6; color: var(--accent); font-weight: 650; }
.curve-exits { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; box-shadow: var(--shadow-sm); }
.curve-exit-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f0e7d2; }
.curve-exit-row:last-child { border-bottom: 0; }
.cer-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.cer-name { font-weight: 650; color: var(--text); min-width: 56px; font-size: 13px; }
.cer-where { font-size: 12.5px; color: var(--red); font-weight: 650; white-space: nowrap; }
.cer-where.ok { color: var(--green); }
.cer-reason { font-size: 12px; color: var(--text-3); }

/* —— 逐章阅读页签头部动作 —— */
.ch-head-actions { display: flex; gap: 8px; margin-top: 10px; }
.ch-name { display: inline-flex; align-items: center; gap: 7px; }
.ch-name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* —— 聚合简报卡片 —— */
.digest-card { margin-top: 16px; }
.digest-card .dg-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(135deg, #f8ecd9, #f5e3c5); border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; }
.dg-badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; flex: none; }
.dg-head-title { font-weight: 750; color: var(--text); font-size: 15px; }
.dg-score { margin-left: auto; font-size: 12.5px; color: var(--text-2); text-align: right; }
.dg-sec { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-top: 0; }
.digest-card .dg-sec:last-child { border-radius: 0 0 14px 14px; }
.dg-sec-title { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .05em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.dg-prog { font-style: normal; font-weight: 600; color: var(--text-3); }
.dg-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.dg-item:hover { background: #faf4e6; border-color: #efe3c8; }
.dg-item.done { opacity: .55; }
.dg-item.done .dg-title { text-decoration: line-through; text-decoration-color: #c9b58f; }
.dg-check { width: 18px; height: 18px; border: 1.5px solid #cdb98e; border-radius: 6px; flex: none; margin-top: 1px; font-size: 12px; line-height: 16px; text-align: center; color: #fff; }
.dg-item.done .dg-check { background: var(--green); border-color: var(--green); }
.dg-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dg-title { font-size: 13.5px; font-weight: 650; color: var(--text); }
.dg-cnt { font-style: normal; font-size: 11.5px; color: var(--accent-2); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 8px; font-weight: 600; white-space: nowrap; }
.dg-quote { font-size: 12px; color: var(--text-2); }
.dg-fix { font-size: 12px; color: var(--green); }
.dg-none { font-size: 12.5px; color: var(--text-3); padding: 4px 8px; }
/* —— 类型诊断 —— */
.dg-genre { background: linear-gradient(180deg, #fdf6e9, var(--surface)); }
.dg-gstats { display: flex; gap: 8px; margin-bottom: 8px; }
.dg-gs { font-size: 12px; color: var(--text-2); background: #f5e9d3; border: 1px solid #ecdcc0; border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.dg-genre .dg-cnt { background: #efe0c4; color: #8a6d3b; }

/* —— 深度批评卡片 —— */
.msg.deep { margin-top: 14px; }
.deep-bubble { border-color: #d9c39a; background: #fdf9ef; }
.score-pill.deep-pill { background: #7a5c2e; color: #fff; }

/* —— 全套流水线进度条 —— */
.suite-bar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 6px; background: #fffdf6; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; box-shadow: 0 6px 24px rgba(90, 60, 20, .14); transition: opacity .4s; }
.suite-bar.out { opacity: 0; }
.sb-label { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-right: 6px; white-space: nowrap; }
.sb-step { font-size: 12px; color: var(--text-3); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.sb-step.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.sb-step.done { color: var(--green); }
.sb-step.done::before { content: '✓ '; }

/* —— 章节级批评落点 —— */
.loc-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 8px; font-size: 10.5px; font-weight: 600;
  font-family: var(--font); color: #6b4e1f;
  background: #f3e5c3; border: 1px solid #e3cd99;
  border-radius: 999px; cursor: pointer;
  vertical-align: 1px; line-height: 1.7;
  transition: background .15s, border-color .15s;
}
.loc-chip b { font-weight: 700; }
.loc-chip:hover { background: #ecd9a8; border-color: #d4b878; }
.loc-chip.xs { padding: 0 7px; font-size: 10px; }
.quote > .loc-chip { margin-bottom: 4px; }
.ret-issue { padding-top: 2px; }
.ret-issue > .loc-chip { align-self: flex-start; margin-bottom: 2px; }

.ms-locs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.ms-note .loc-chip { margin-bottom: 3px; }
.ms-para.ms-flash { animation: msflash 1.7s ease-out; border-radius: 6px; }
@keyframes msflash {
  0% { background: #f6e3ae; }
  100% { background: transparent; }
}

.dg-locs { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px; }
.dg-loc {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; font-size: 11px; font-family: var(--font);
  color: #6b4e1f; background: #f7efdc; border: 1px solid #e5d5ac;
  border-radius: 999px; cursor: pointer;
  transition: background .15s;
}
.dg-loc:hover { background: #f0e2c0; }
.dg-loc b { color: #8a5a12; }
.deep-locs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--text-2); }

/* —— 报告页 · 追读摘要与跨作品对比 —— */
.report-ret { margin-top: 16px; }
.report-ret .sec-title { margin-bottom: 10px; }
.ret-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.ret-stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.ret-stat b { display: block; font-size: 19px; color: var(--text); margin-bottom: 2px; }
.ret-stat b small { font-size: 11px; color: var(--text-3); font-weight: 500; }
.ret-stat i { display: block; font-style: normal; font-size: 11px; color: var(--text-2); line-height: 1.5; }
.ret-stat.warn b { color: #b06a1a; }
.ret-dim-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11.5px; color: var(--text-2); }
.ret-dim-row .rd-name { width: 42px; flex: none; }

    infodumpMarkers: ['境界划分', '修炼体系', '等级划分', '分为', '分别是', '共有', '所谓', '众所周知', '设定', '体系', '境界', '品阶', '天赋等级', '规则'],
    actionWords: ['冲', '跑', '跳', '抓', '推', '拉', '踢', '撞', '摔', '翻', '追', '逃', '躲', '闪', '扑', '跃', '举', '砸', '抽', '拔', '砍', '刺', '踹', '拦', '抱', '拽'],
    earlySystemRe: /系统|面板|宿主|属性|穿越|重生/
  },

  stopChars: '的了是在不和也就都而及与着或这那么什么没有可以因为所以但是然后时候自己一样已经还是我们你们他们它们我你他她它把被让给对从到向于为以之其里中上下来去个一二三四五六七八九十两没又被很会能要就还很非常忽然突然真'.split(''),

  sample: {
    title: '雨夜的旧书店',
    genre: '短篇小说',
    text: `雨下得很大，非常大，真的特别大。林晚站在旧书店的屋檐下，看着雨水从青灰色的瓦片上流下来，心里忽然涌起一阵说不清道不明的情绪。她觉得很冷，也非常难过，眼泪在眼眶里打转。

她推开那扇吱呀作响的木门，走了进去。书店里很暗，只有一盏昏黄的灯亮着，空气里弥漫着旧纸张和霉味混合在一起的味道。她慢慢地走过一排排书架，手指轻轻地划过那些书脊，心里感到一种久违的平静。她想起很多年前，也是这样一个下雨的夜晚，她和陈默一起在这里躲雨，那时候他们还年轻，什么都不怕，以为只要在一起就可以对抗整个世界。

“你来了。”老板说道。
“嗯。”林晚说道。
“好久没见你了。”老板又说道。
“是啊。”她说道，声音很低。

老板是一个五十多岁的男人，很瘦，戴着一副很旧的眼镜，看起来是一个很有故事的人。他没有再问什么，只是给她倒了一杯热水。水汽升起来，模糊了她的视线。她忽然觉得，时间仿佛在这一刻静止了。她看着杯子里的水，心里五味杂陈。

“他还是没有回来吗？”老板忽然问道。
林晚愣了一下，然后笑了笑，说道：“没有。”
“都五年了。”老板叹了口气，说道。
“嗯，五年了。”她说道。

她想起陈默走的那天，也是下着雨。他站在车站的站台上，背着一个很旧的帆布包，对她说：“等我回来。”她点了点头，说：“我等你。”然后火车就开走了，带走了她整个青春。她站在那里，很久很久都没有动，直到雨水打湿了她的头发和衣服，直到站台上只剩下她一个人。

窗外的雨还在下，下得很大很大。林晚捧着那杯已经凉了的水，忽然明白了一个道理：有些人，有些事，一旦错过，就真的再也回不来了。她的眼神变得很复杂，有遗憾，有不舍，也有一种终于放下的释然。

她站起身，把杯子轻轻地放在桌子上，对老板说：“我走了。”
“下次还来吗？”老板问道。
她回过头，微微一笑，说道：“会吧。”

推开门的时候，雨小了一些。她走进雨里，没有打伞。她想，也许有些路，本来就是要一个人走的。`
  }
};

if (typeof window !== 'undefined') window.RCS_LEXICON = RCS_LEXICON;
if (typeof module !== 'undefined') module.exports = RCS_LEXICON;

})();

<script>
(function () {
/* 读者席 · 批评引擎
 * 纯本地文本分析 + 人格化批评生成，不依赖任何外部 API。
 */
(function (global) {
  'use strict';

  // 词库来源：优先从 window 取（内联打包后跨脚本的全局 const 不可见），
  // 其次退回 require，最后兜底到全局变量。
  const L = (typeof window !== 'undefined' && window.RCS_LEXICON)
    ? window.RCS_LEXICON
    : (typeof RCS_LEXICON !== 'undefined' ? RCS_LEXICON
      : (typeof require !== 'undefined' ? require('./lexicon.js') : null));

  const DIMS = ['prose', 'rhythm', 'character', 'plot', 'theme', 'dialogue', 'novelty'];
  const DIM_LABEL = {
    prose: '文笔', rhythm: '节奏', character: '人物',
    plot: '情节', theme: '主题', dialogue: '对话', novelty: '新意'
  };

  const PERSONAS = L.personas;

  /* ---------- 基础工具 ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const mean = (arr) => (arr.length ? sum(arr) / arr.length : 0);
  const std = (arr, m) => {
    if (arr.length < 2) return 0;
    return Math.sqrt(sum(arr.map((x) => (x - m) * (x - m))) / (arr.length - 1));
  };
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const countOcc = (hay, needle) => {
    if (!needle) return 0;
    let n = 0, i = 0;
    while ((i = hay.indexOf(needle, i)) !== -1) { n++; i += needle.length; }
    return n;
  };
  const truncate = (s, n) => {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  const pick = (rng, arr) => arr[Math.min(arr.length - 1, Math.floor(rng() * arr.length))];

  /* ---------- 文本体征分析 ---------- */
  function analyze(raw) {
    const text = String(raw || '').replace(/\r/g, '');
    const paragraphs = text.split(/\n+/).map((s) => s.trim()).filter(Boolean);
    const full = paragraphs.join('\n');
    const charCount = full.replace(/\s/g, '').length;

    // 断句：后引号、后括号要贴回前一句，否则会切出「”老板说道。」这种碎片
    const rawParts = full.replace(/\n/g, '').match(/[^。！？…!?;]+[。！？…!?;]?/g) || [];
    const rawSentences = [];
    rawParts.forEach((part) => {
      const t = part.trim();
      if (!t) return;
      if (/^[”"」』）)]/.test(t) && rawSentences.length) rawSentences[rawSentences.length - 1] += t;
      else rawSentences.push(t);
    });

    const sentences = rawSentences.map((s) => {
      const clean = s.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
      return {
        text: s,
        len: clean.length,
        adv: L.adverbs.reduce((a, w) => a + countOcc(s, w), 0),
        tell: L.tellWords.reduce((a, w) => a + countOcc(s, w), 0),
        de: countOcc(s, '的'),
        cliche: L.cliches.reduce((a, w) => a + countOcc(s, w), 0),
        isDialogue: /[“"「『]/.test(s)
      };
    }).filter((s) => s.len > 0);

    const lens = sentences.map((s) => s.len);
    const sentCount = lens.length;
    const avgSent = mean(lens);
