  /* ================= 报告 ================= */
  function buildReport(round) {
    const w = work();
    const rounds = roundsOf(w);
    if (!rounds.length) return null;
    const r = round || latestRound(w);
    const crits = roundCrits(w, r);
    if (!crits.length) return null;

    const dims = {};
    E.DIMS.forEach((k) => {
      const vals = crits.map((c) => c.dims[k]);
      dims[k] = {
        avg: Math.round(vals.reduce((a, b) => a + b, 0) / vals.length),
        min: Math.min.apply(null, vals),
        max: Math.max.apply(null, vals)
      };
    });

    let prev = null;
    const idx = rounds.indexOf(r);
    if (idx > 0) {
      const pc = roundCrits(w, rounds[idx - 1]);
      if (pc.length) prev = { round: rounds[idx - 1], dims: avgDimsOf(pc), score: avg(pc) };
    }

    const map = new Map();
    crits.forEach((c) => {
      (c.issues || []).forEach((i) => {
        if (!map.has(i.id)) map.set(i.id, Object.assign({}, i, { count: 0, personas: [] }));
        const it = map.get(i.id);
        it.count += 1;
        it.personas.push(c.personaId);
        it.severity = Math.max(it.severity, i.severity);
      });
    });

    const threshold = Math.max(2, Math.ceil(crits.length * 0.34));
    const consensus = Array.from(map.values())
      .filter((x) => x.count >= threshold)
      .sort((a, b) => b.count - a.count || b.severity - a.severity);

    return {
      work: w, round: r, rounds: rounds, crits: crits, dims: dims,
      prev: prev, avgScore: avg(crits), consensus: consensus, threshold: threshold
    };
  }

  /* 报告页 · 追读摘要：黄金三章 + 逐章追读率 + 模拟弃读 + 模型自评追读分 */
  function retentionSummaryHTML(w, r) {
    const g = E.analyzeGolden(w.text);
    const a = E.analyzeChapters(w.text);
    if ((!g || !g.ok) && (!a || !a.ok)) return '';
    const label = E.R_DIM_LABEL || {};

    let bars = '';
    if (g && g.ok) {
      bars = RET_ORDER.map((k) =>
        '<div class="ret-dim-row"><span class="rd-name">' + (label[k] || k) + '</span>' +
        '<span class="track"><span class="fill" style="width:' + g.scores[k] + '%"></span></span>' +
        '<span class="num">' + g.scores[k] + '</span></div>').join('');
    }

    const chStats = [];
    if (a && a.ok && a.hasTitles) {
      const ret = a.chapters.map((c) => c.retentionEst);
      let low = 0;
      ret.forEach((v, i) => { if (v < ret[low]) low = i; });
      let drops = 0;
      for (let i = 1; i < ret.length; i++) { if (ret[i - 1] - ret[i] >= 10) drops++; }
      const sim = E.simulateReading(w.text, activePersonas(w));
      const exits = sim.results.map((x) => x.state.exit_chapter).filter((x) => x != null);
      const done = sim.results.length - exits.length;
      let mid = null;
      if (exits.length) {
        const s = exits.slice().sort((x, y) => x - y);
        mid = s[Math.floor(s.length / 2)] + 1;
      }
      chStats.push({ v: ret[0] + '%', k: '第 1 章追读率', warn: false });
      chStats.push({ v: (low + 1) + ' 章', k: '最低谷 · ' + ret[low] + '%', warn: true });
      chStats.push({ v: drops + ' 处', k: '弃读高发点（陡降 ≥10）', warn: drops > 0 });
      chStats.push({
        v: mid ? '第 ' + mid + ' 章' : (sim.results.length && done ? '全部读完' : '—'),
        k: '模拟弃读中位' + (done ? ' · ' + done + ' 位读完' : ''),
        warn: false
      });
    }

    const rets = r.crits.map((c) => c.retention).filter(Boolean);
    const llmRets = rets.filter((x) => x.source === 'llm');
    let llmHTML = '';
    if (llmRets.length) {
      const avgScore = Math.round(llmRets.reduce((s, x) => s + x.score, 0) / llmRets.length);
      const dims = {};
      RET_ORDER.forEach((k) => {
        dims[k] = Math.round(llmRets.reduce((s, x) => s + (x.dims[k] || 0), 0) / llmRets.length);
      });
      llmHTML = '<div class="ret-stat"><b>' + avgScore + '<small>/100</small></b>' +
        '<i>' + llmRets.length + ' 位读者模型自评追读分</i></div>' +
        '<div style="max-width:520px;margin-top:2px">' +
        RET_ORDER.map((k) => '<div class="ret-dim-row"><span class="rd-name">' + (label[k] || k) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + dims[k] + '%"></span></span>' +
          '<span class="num">' + dims[k] + '</span></div>').join('') + '</div>';
    }

    return '<div class="report-ret">' +
      '<div class="sec-title">追读摘要 <span class="count">黄金三章 + 逐章模拟</span></div>' +
      '<div class="ret-stats">' +
      (g && g.ok ? '<div class="ret-stat"><b>' + g.overall + '<small>/100</small></b><i>黄金三章 · 追读分</i></div>' : '') +
      chStats.map((s) => '<div class="ret-stat' + (s.warn ? ' warn' : '') + '"><b>' + s.v + '</b><i>' + esc(s.k) + '</i></div>').join('') +
      '</div>' +
      '<div style="max-width:520px">' + bars + '</div>' +
      (llmHTML ? '<div style="max-width:520px;margin-top:8px">' + llmHTML + '</div>' : '') +
      '<div class="muted-note" style="margin-top:8px">规则引擎按钩子、爽点、冲突、说明段占比逐章估算，供自检参考，不等同于真实数据。</div>' +
      '</div>';
  }

  /* 报告页 · 跨作品追读对比：同一套规则过一遍书架上的每部稿子 */
  function compareWorksHTML(w) {
    const rows = [];
    state.data.works.forEach((x) => {
      const g = E.analyzeGolden(x.text);
      if (!g || !g.ok) return;
      const a = E.analyzeChapters(x.text);
      const ret = (a.ok && a.hasTitles) ? a.chapters.map((c) => c.retentionEst) : null;
      let low = null;
      if (ret) { low = 0; ret.forEach((v, i) => { if (v < ret[low]) low = i; }); }
      const sim = E.simulateReading(x.text, activePersonas(x));
      const exits = sim.results.map((y) => y.state.exit_chapter).filter((y) => y != null);
      let mid = null;
      if (exits.length) {
        const s = exits.slice().sort((p, q) => p - q);
        mid = s[Math.floor(s.length / 2)] + 1;
      }
      rows.push({
        id: x.id, title: x.title, score: g.overall,
        first: ret ? ret[0] : null,
        low: ret != null ? (low + 1) + ' 章 · ' + ret[low] + '%' : null,
        mid: mid, done: sim.results.length - exits.length, n: sim.results.length,
        cur: x.id === w.id
      });
    });
    rows.sort((a, b) => b.score - a.score);
    if (rows.length < 2) return '';
    const trs = rows.map((x) =>
      '<tr class="' + (x.cur ? 'cur' : '') + '">' +
      '<td class="ct-title">' + (x.cur
        ? '<span>' + esc(x.title) + ' <span class="pill">本篇</span></span>'
        : '<button data-open="' + x.id + '">' + esc(x.title) + '</button>') + '</td>' +
      '<td><b>' + x.score + '</b></td>' +
      '<td>' + (x.first != null ? x.first + '%' : '—') + '</td>' +
      '<td>' + (x.low || '—') + '</td>' +
      '<td>' + (x.mid ? '第 ' + x.mid + ' 章' : (x.done === x.n && x.n ? '全部读完' : '—')) + '</td>' +
      '</tr>').join('');
    return '<div class="report-ret">' +
      '<div class="sec-title">跨作品追读对比 <span class="count">' + rows.length + ' 部</span></div>' +
      '<div class="muted-note" style="margin-bottom:8px">同一套规则引擎过一遍书架上的每部稿子：追读分是黄金三章体检分，第 1 章追读率、最低谷来自逐章预估，弃读中位来自内置逐章模拟。点作品名直接跳过去。</div>' +
      '<table class="compare-table"><thead><tr><th>作品</th><th>追读分</th><th>第 1 章追读率</th><th>最低谷</th><th>模拟弃读中位</th></tr></thead>' +
      '<tbody>' + trs + '</tbody></table></div>';
  }

  function reportPageHTML() {
    const w = work();
    const rounds = roundsOf(w);
    if (!rounds.length) {
      return '<button class="back-link" data-back>← 返回工作台</button>' +
        '<div class="empty"><div class="badge">报</div><h2>还没有可汇总的批评</h2>' +
        '<p>报告来自读者的发言。先让《' + esc(w.title) + '》过一轮。</p>' +
        '<button class="btn primary" data-open="' + w.id + '">回到稿子</button></div>';
    }
    let r = buildReport(state.reportRound || latestRound(w));
    if (!r) { state.reportRound = null; r = buildReport(latestRound(w)); }
    if (!r) return '<div class="empty"><h2>这一轮没有记录</h2></div>';

    const dimsAvg = {};
    E.DIMS.forEach((k) => { dimsAvg[k] = r.dims[k].avg; });
    const ranked = E.DIMS.slice().sort((a, b) => r.dims[a].avg - r.dims[b].avg);
    const weakest = ranked[0];
    const strongest = ranked[ranked.length - 1];
    const topSpread = E.DIMS.slice().sort((a, b) =>
      (r.dims[b].max - r.dims[b].min) - (r.dims[a].max - r.dims[a].min))[0];

    const delta = (k) => {
      if (!r.prev) return '';
      const d = r.dims[k].avg - r.prev.dims[k].avg;
      if (d === 0) return '<span class="delta flat">—</span>';
      return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '</span>';
    };

    const select = '<select id="round-select" class="round-select">' +
      rounds.slice().reverse().map((n) =>
        '<option value="' + n + '" ' + (n === r.round ? 'selected' : '') + '>第 ' + n + ' 轮</option>').join('') +
      '</select>';

    const prevNote = r.prev
      ? '对比第 ' + r.prev.round + ' 轮：综合 ' + r.prev.score + ' → ' + r.avgScore +
      '（' + (r.avgScore - r.prev.score >= 0 ? '+' : '') + (r.avgScore - r.prev.score) + '）'
      : '这是第一轮，还没有可比对象。';

    const bars = E.DIMS.map((k) => {
      const d = r.dims[k];
      return '<div class="mb-row"><span>' + E.DIM_LABEL[k] + '</span>' +
        '<span class="track"><span class="fill" style="width:' + d.avg + '%"></span></span>' +
        '<span class="num">' + d.avg + delta(k) + '</span></div>';
    }).join('');

    const minmax = E.DIMS.map((k) =>
      '<span class="mm">' + E.DIM_LABEL[k] + ' ' + r.dims[k].min + '–' + r.dims[k].max + '</span>').join('');

    const consensusHTML = r.consensus.length
      ? r.consensus.map((c) => '<div class="consensus-item"><div class="ci-head">' +
        '<span class="ci-title">' + esc(c.title) + '</span>' +
        '<span class="ci-count">' + c.count + '/' + r.crits.length + ' 人提到</span></div>' +
        '<div class="ci-body">' + esc(c.fix) + '</div></div>').join('')
      : '<div class="muted-note">这一轮没有形成明显共识——问题分散，或者稿子已经比较稳。</div>';

    const fixes = r.consensus.slice(0, 8);
    const checked = w.checked || [];
    const fixesHTML = fixes.length
      ? fixes.map((f) => '<label class="fix-check ' + (checked.indexOf(f.id) >= 0 ? 'done' : '') + '">' +
        '<input type="checkbox" data-check="' + f.id + '" ' + (checked.indexOf(f.id) >= 0 ? 'checked' : '') + '>' +
        '<span><span class="ft">' + esc(f.fix) + '</span><br><span class="fd">' + esc(f.title) +
        ' · ' + f.count + ' 位读者</span></span></label>').join('')
      : '<div class="muted-note">暂无需要列出的修改项。</div>';

    const scoresHTML = r.crits.slice().sort((a, b) => b.score - a.score).map((c) => {
      const p = personaOf(c.personaId);
      const main = (c.issues && c.issues[0]) ? c.issues[0].title : '无硬伤';
      return '<div class="score-row" data-go-reader="' + p.id + '">' +
        '<span class="avatar xs" style="background:' + p.color + '">' + esc(p.initial) + '</span>' +
        '<span class="sr-name">' + esc(p.name) + '</span>' +
        '<span class="sr-issue">' + esc(main) + '</span>' +
        '<span class="score-pill ' + scoreClass(c.score) + '">' + c.score + '</span></div>';
    }).join('');

    return '<div class="report-toolbar">' +
      '<div class="rt-left"><button class="back-link" data-back>← 返回工作台</button>' +
      '<h1>《' + esc(w.title) + '》批评报告</h1>' +
      '<div class="rt-meta">第 ' + r.round + ' 轮 · ' + r.crits.length + ' 位读者 · ' +
      fmt(E.analyze(w.text).charCount) + ' 字</div></div>' +
      '<div class="rt-actions">' + select +
      '<button class="btn ghost" data-export-report>导出 Markdown</button>' +
      '<button class="btn ghost" data-print>打印</button></div></div>' +
      '<div class="report-summary">' +
      '<div class="report-score"><div class="val">' + r.avgScore + '<small>/100</small></div>' +
      '<div class="lbl">综合评分</div><div class="verdict">' + verdictFor(r.avgScore) + '</div>' +
      '<div class="rs-mini"><span>最稳：<b>' + E.DIM_LABEL[strongest] + ' ' + r.dims[strongest].avg + '</b></span>' +
      '<span>最弱：<b>' + E.DIM_LABEL[weakest] + ' ' + r.dims[weakest].avg + '</b></span>' +
      '<span>分歧：<b>' + E.DIM_LABEL[topSpread] + ' ±' + (r.dims[topSpread].max - r.dims[topSpread].min) + '</b></span></div>' +
      '</div>' +
      '<div><div class="radar-wrap">' + radarSVG(dimsAvg, 220) + '</div><div class="mini-bars">' + bars + '</div>' +
      '<div class="prev-note">' + esc(prevNote) + '</div></div></div>' +
      '<div class="mm-row">' + minmax + '</div>' +
      '<div class="report-grid">' +
      '<div><div class="sec-title">共识问题 <span class="count">' + r.consensus.length + '</span></div>' + consensusHTML +
      '<div class="report-note">“共识”指至少 ' + r.threshold + ' 位读者独立提到的同一问题。人数越多，越不该忽略。</div></div>' +
      '<div><div class="sec-title">修改清单 <span class="count">' + fixes.length + '</span></div>' + fixesHTML +
      '<div class="sec-title" style="margin-top:16px">读者打分</div>' + scoresHTML + '</div>' +
      '</div>' +
      retentionSummaryHTML(w, r) +
      compareWorksHTML(w);
  }

  function verdictFor(score) {
    if (score >= 85) return '这一版可以拿出去见人了。';
    if (score >= 78) return '已经站住了，剩下的是打磨。';
    if (score >= 70) return '有可取之处，但还差一层窗户纸。';
    if (score >= 62) return '底子还在，问题很具体，能改。';
    return '需要一次结构性的重写，而不是润色。';
  }

  /* ---------- 类型词库（自定义爽点/钩子/套路词表） ---------- */
  function lexGenres() {
    const merged = {};
    Object.keys(L.genres || {}).forEach((k) => { merged[k] = L.genres[k]; });
    Object.keys(state.data.customGenres || {}).forEach((k) => {
      merged[k] = Object.assign({}, merged[k] || {}, state.data.customGenres[k]);
    });
    return merged;
  }
  function lexRow(id, g) {
    const isCustom = !L.genres[id];
    const open = state.lexOpen === id;
    return '<div class="lex-row">' +
      '<button class="lex-head" data-lex-head="' + esc(id) + '">' +
      '<span class="lex-name">' + esc(g.label) + (isCustom ? '<i class="lex-custom">自定义</i>' : '') + '</span>' +
      '<span class="lex-stats">爽点 ' + g.payoff.length + ' · 钩子 ' + g.hook.length + ' · 套路 ' + g.trope.length + '</span>' +
      '<span class="lex-chev">' + (open ? '▴' : '▾') + '</span></button>' +
      '<div class="lex-edit"' + (open ? '' : ' hidden') + '>' +
      '<div class="field"><label>类型名</label><input type="text" data-lex-f="label" value="' + esc(g.label) + '" /></div>' +
      '<div class="field"><label>识别词（别名，体裁里出现这些词就认这个类型）</label>' +
      '<input type="text" data-lex-f="aliases" value="' + esc((g.aliases || []).join('、')) + '" placeholder="如：仙侠、修真" /></div>' +
      '<div class="field"><label>爽点词（逗号或空格分隔）</label>' +
      '<textarea rows="2" data-lex-f="payoff">' + esc(g.payoff.join('、')) + '</textarea></div>' +
      '<div class="field"><label>钩子词</label>' +
      '<textarea rows="2" data-lex-f="hook">' + esc(g.hook.join('、')) + '</textarea></div>' +
      '<div class="field"><label>套路词</label>' +
      '<textarea rows="2" data-lex-f="trope">' + esc(g.trope.join('、')) + '</textarea></div>' +
      '<div class="btn-row" style="margin-top:8px">' +
      '<button class="btn sm primary" data-lex-save="' + esc(id) + '">保存</button>' +
      (isCustom
        ? '<button class="btn sm ghost danger" data-lex-del="' + esc(id) + '">删除此类型</button>'
        : '<button class="btn sm ghost" data-lex-reset="' + esc(id) + '">恢复默认</button>') +
      '</div></div></div>';
  }
  function lexRows() {
    const gens = lexGenres();
    return Object.keys(gens).map((k) => lexRow(k, gens[k])).join('');
  }
  function lexParse(v) {
    const seen = [];
    String(v || '').split(/[,，、;；\s]+/).forEach((w) => {
      w = w.trim();
      if (w && seen.indexOf(w) < 0) seen.push(w);
    });
    return seen;
  }
  function bindLexicon() {
    $$('[data-lex-head]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-lex-head');
      state.lexOpen = state.lexOpen === id ? null : id;
      render();
    }));
    const add = $('#lex-add');
    if (add) add.addEventListener('click', () => {
      const id = 'g' + Date.now().toString(36);
      state.data.customGenres[id] = { label: '新类型', aliases: [], payoff: [], hook: [], trope: [] };
      state.lexOpen = id;
      save();
      render();
      toast('填好词表点保存，就能在诊断里用了');
    });
    $$('[data-lex-save]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-lex-save');
      const row = b.closest('.lex-row');
      const val = (f) => { const el = row.querySelector('[data-lex-f="' + f + '"]'); return el ? el.value : ''; };
      const g = {
        label: val('label').trim(),
        aliases: lexParse(val('aliases')),
        payoff: lexParse(val('payoff')),
        hook: lexParse(val('hook')),
        trope: lexParse(val('trope'))
      };
      if (!g.label) { toast('类型名不能为空'); return; }
      if (!g.payoff.length && !g.hook.length) { toast('爽点词和钩子词至少填一类，不然诊断没东西可查'); return; }
      state.data.customGenres[id] = g;
      save();
      render();
      toast('已保存：' + g.label + '（爽点 ' + g.payoff.length + ' · 钩子 ' + g.hook.length + ' · 套路 ' + g.trope.length + '）');
    }));
    $$('[data-lex-reset]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-lex-reset');
      delete state.data.customGenres[id];
      state.lexOpen = null;
      save();
      render();
      toast('已恢复内置词表');
    }));
    $$('[data-lex-del]').forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-lex-del');
      delete state.data.customGenres[id];
      state.lexOpen = null;
      save();
      render();
      toast('已删除自定义类型');
    }));
  }

        '<div class="btn-row" style="margin-top:6px">' +
        '<button class="btn ghost" id="pv-test">测试连接</button>' +
        '<span class="muted-note" id="pv-test-msg"></span></div>' +
        '</div>';
    } else {
      detail = '<div class="prov-detail"><div class="muted-note">' + esc(curProv.note) + '</div></div>';
    }

    const calls = (state.data.calls || []).slice(-12).reverse();
    const callRows = calls.length
      ? '<table class="call-table"><thead><tr><th>时间</th><th>读者</th><th>模型</th><th>token</th><th>耗时</th><th>丢弃引用</th></tr></thead><tbody>' +
        calls.map((c) => {
          const t = new Date(c.ts);
          return '<tr' + (c.error ? ' class="err"' : '') + '>' +
            '<td>' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + '</td>' +
            '<td>' + esc(c.persona || (c.kind === 'deep' ? '主笔' : '—')) + '</td>' +
            '<td>' + esc(c.error ? '失败' : (c.model || '—')) + '</td>' +
            '<td>' + (c.error ? '—' : (c.chars || 0)) + '</td>' +
            '<td>' + (c.error ? '—' : ((c.elapsed || 0) + 'ms')) + '</td>' +
            '<td>' + (c.error ? esc(String(c.error).slice(0, 30)) : ((c.dropped || 0) + (c.dropRate ? ' (' + Math.round(c.dropRate * 100) + '%)' : ''))) + '</td>' +
            '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="muted-note">还没有调用记录。切到本地 Ollama 或 OpenRouter 免费档跑一轮，这里会记下每次的 token、耗时与引用丢弃率。</div>';

    return '<div class="settings-card"><div class="sec-title">生成层</div>' +
      '<div class="muted-note" style="margin-bottom:10px">决定批评文本从哪来。三种都免费，' +
      '规则引擎离线可用，模型后端更会说话但会消耗本地算力或请求配额。</div>' +
      '<div class="prov-list">' + rows + '</div>' + detail +
      (cur === 'ollama' ? ollamaHelp() : '') +
      '</div>' +
      '<div class="settings-card"><div class="sec-title">调用记录</div>' + callRows + '</div>';
  }

  function bindProvider() {
    const radios = $$('input[name="prov"]');
    radios.forEach((r) => r.addEventListener('change', () => {
      state.data.settings.provider = r.value;
      save();
      render();
    }));
    const model = $('#pv-model');
    if (model) model.addEventListener('change', () => {
      const cur = state.data.settings.provider;
      providerConfigFor(cur).model = model.value.trim();
      save();
    });
    const key = $('#pv-key');
    if (key) key.addEventListener('change', () => {
      const cur = state.data.settings.provider;
      providerConfigFor(cur).apiKey = key.value.trim();
      save();
    });
    const ep = $('#pv-endpoint');
    if (ep) ep.addEventListener('change', () => {
      const cur = state.data.settings.provider;
      providerConfigFor(cur).endpoint = ep.value.trim();
      save();
    });
    const to = $('#pv-timeout');
    if (to) to.addEventListener('change', () => {
      const cur = state.data.settings.provider;
      const sec = Number(to.value);
      providerConfigFor(cur).timeout = (sec > 0 ? sec * 1000 : 240000);
      save();
    });
    const scan = $('#pv-scan');
    if (scan) scan.addEventListener('click', () => {
      const msg = $('#pv-scan-msg');
      const cur = state.data.settings.provider;
      const cfg = providerConfigFor(cur);
      if (msg) msg.textContent = '正在读…';
      PR.listLocalModels(cfg).then((list) => {
        state.data.localModels = list;
        save();
        if (msg) msg.textContent = list.length
          ? '找到 ' + list.length + ' 个：' + list.map((m) => m.name).join('、')
          : '服务能连上，但没有已下载的模型。先在终端跑 ollama pull qwen2.5:7b';
        render();
      }).catch((err) => {
        if (msg) msg.textContent = '读不到：' + String(err.message || err).slice(0, 60) + '（确认 Ollama 已在运行）';
      });
    });

    const test = $('#pv-test');
    if (test) test.addEventListener('click', () => {
      const msg = $('#pv-test-msg');
      const cur = state.data.settings.provider;
      const cfg = providerConfigFor(cur);
      if (msg) msg.textContent = '正在连…';
      PR.get(cur).test(cfg).then((r) => {
        if (msg) msg.textContent = r.msg;
        toast(r.ok ? '连接成功' : '连接失败');
      }).catch((err) => {
        if (msg) msg.textContent = '失败：' + String(err.message || err).slice(0, 80);
        toast('连接失败');
      });
    });
  }

  /* ================= 生成层 ================= */
  function activeProvider() {
    return PR.get(state.data.settings.provider || 'rule');
  }
  function providerConfigFor(id) {
    const pc = state.data.settings.providerConfig || {};
    return pc[id] || { endpoint: PR.defaults.endpoint(id), model: PR.defaults.model(id), apiKey: '', timeout: 240000 };
  }
  function recordCall(rec) {
    state.data.calls = state.data.calls || [];
    state.data.calls.push(Object.assign({ ts: Date.now() }, rec));
    if (state.data.calls.length > 100) state.data.calls.shift();
    save();
  }

  /* ================= 运行一轮 ================= */
  function ensureChatView() {
    if (state.workView === 'chat') return;
    state.workView = 'chat';
    const tabs = $('#view-tabs');
    if (tabs) {
      $$('#view-tabs button').forEach((b) => b.classList.toggle('on', b.getAttribute('data-view') === 'chat'));
      const st = $('#stream');
      if (st) st.classList.remove('ms-stream');
    }
  }

  async function runRound() {
    if (state.busy) { toast('读者还在读稿，等这一轮说完'); return; }
    const w = work();
    const m = E.analyze(w.text);
    if (m.charCount < 80) { toast('稿件太短了，至少给读者 80 字'); return; }

    const active = activePersonas(w);
    if (!active.length) { toast('至少留一位读者在场'); return; }

    await performRound(w, m, active);
  }

  /* 一轮批评的执行体：读者发言 → 辩论 → 聚合简报 → 深度批评（接 LLM 时） */
  async function performRound(w, m, active) {
    ensureChatView();
    state.busy = true;
    state.metrics = m;
    refreshWorkChrome();

    const base = E.scoreDims(m);
    const issues = E.detectIssues(m);
    const round = latestRound(w) + 1;

    w.log.push({ type: 'submit', round: round, charCount: m.charCount, textHash: hashText(w.text), ts: Date.now() });
    save();
    renderStreamArea();
    renderSidebar();

    const animate = state.data.settings.animate !== false;
    if (animate) await sleep(240);

    const made = [];
    const prov = activeProvider();
    const pcfg = providerConfigFor(prov.id);
    const useLLM = prov.id !== 'rule';
    const genreId = E.genreOf(w.genre);
    const genreCtx = genreId ? E.analyzeGenre(m, genreId) : null;
    if (useLLM) {
      w.log.push({
        type: 'system', ts: Date.now(),
        text: '本轮改用「' + prov.label + '」生成（' + prov.cost + '）'
      });
      renderStreamArea();
    }
    for (let i = 0; i < active.length; i++) {
      const p = active[i];
      let tip = null;
      if (animate) {
        tip = showTyping(p);
        await sleep(340 + Math.random() * 480);
      }
      const ctx = {
        persona: effectivePersona(p), metrics: m, issues: issues,
        baseDims: base, round: round, seedExtra: '', providerConfig: pcfg,
        golden: E.analyzeGolden(w.text), genre: genreCtx
      };
      let critique = null;
      if (useLLM) {
        try {
          const res = await prov.composeCritique(ctx);
          critique = res.critique || res;
          recordCall({
            provider: prov.id, model: pcfg.model, persona: p.name,
            chars: (res.usage && res.usage.totalTokens) || 0,
            elapsed: (res.usage && res.usage.elapsedMs) || 0,
            dropped: (res.dropped || []).length,
            dropRate: res.droppedRate || 0
          });
        } catch (err) {
          recordCall({ provider: prov.id, model: pcfg.model, persona: p.name, error: String(err.message || err) });
          w.log.push({
            type: 'system', ts: Date.now(),
            text: p.name + '这一轮没接上（' + String(err.message || err).slice(0, 80) + '），已回退到本地规则。'
          });
          critique = await PR.rule.composeCritique(ctx);
        }
      } else {
        critique = await prov.composeCritique(ctx);
      }
      if (tip) removeTyping(tip);
      w.log.push(Object.assign({ type: 'critique', ts: Date.now() }, critique));
      made.push({ persona: p, entry: critique });
      save();
      renderStreamArea();
      renderInspector();
      if (animate) await sleep(120);
    }

    const debates = E.buildDebates(made, m);
    for (let i = 0; i < debates.length; i++) {
      w.log.push(Object.assign({ type: 'debate', ts: Date.now() }, debates[i]));
      save();
      renderStreamArea();
      if (animate) await sleep(200);
    }

    /* 聚合简报：把这一轮 N 位读者的发言归并成一屏 */
    w.log.push(buildDigest(w, round));
    save();
    renderStreamArea();
    renderInspector();

    /* 深度批评：接 LLM 时由「主笔」做整篇批评；规则引擎模式自动降级 */
    const dp = activeProvider();
    if (dp.id !== 'rule') {
      const dpcfg = providerConfigFor(dp.id);
      w.log.push({ type: 'system', ts: Date.now(), text: '主笔正在通读全稿，做整篇深度批评（' + dp.label + '）…' });
      save();
      renderStreamArea();
      try {
        const sim = E.simulateReading(w.text, active);
        const roundSummary = made.map((x) =>
          x.persona.name + ' ' + (x.entry.score != null ? x.entry.score + ' 分' : '') + '：' +
          ((x.entry.issues || []).map((i) => i.title).join('、') || '没挑出问题')).join('\n');
        const simSummary = sim.results.map((r) =>
          r.name + '：' + (r.state.exit_chapter == null ? '读完全稿' : '第 ' + (r.state.exit_chapter + 1) + ' 章弃读（' + r.state.exit_reason + '）')).join('\n');
        const res = await dp.deepCritique({
          metrics: m, golden: E.analyzeGolden(w.text),
          simSummary: simSummary, roundSummary: roundSummary, providerConfig: dpcfg,
          genre: genreCtx
        });
        recordCall({
          provider: dp.id, model: dpcfg.model, kind: 'deep',
          chars: (res.usage && res.usage.totalTokens) || 0,
          elapsed: (res.usage && res.usage.elapsedMs) || 0,
          dropped: (res.dropped || []).length,
          dropRate: res.droppedRate || 0
        });
        w.log.push(Object.assign({ type: 'deep', ts: Date.now(), round: round, source: 'llm', provider: dp.id, model: dpcfg.model }, res.deep));
      } catch (err) {
        recordCall({ provider: dp.id, model: dpcfg.model, kind: 'deep', error: String(err.message || err) });
        w.log.push({
          type: 'system', ts: Date.now(),
          text: '主笔的深度批评没接上（' + String(err.message || err).slice(0, 80) + '），已自动降级为规则引擎批评，先看上面的聚合简报。'
        });
      }
    } else {
      w.log.push({
        type: 'system', ts: Date.now(),
        text: '深度批评需要接 LLM：设置 → 生成后端，切到 Ollama 或 OpenRouter 后再跑一轮。本轮已自动降级为规则引擎批评，看上面的聚合简报。'
      });
    }

    w.log.push({
      type: 'system',
      ts: Date.now(),
      text: '第 ' + round + ' 轮结束 · ' + active.length + ' 位读者发言' +
        (debates.length ? ' · ' + (debates.length / 2) + ' 处观点冲突' : '') + ' · 简报已出 · 报告已更新'
    });
    save();
    renderStreamArea();
    renderInspector();
    renderSidebar();

    state.busy = false;
    refreshWorkChrome();
  }

  /* ================= 一键全套流水线 ================= */
  function removeSuiteBar() {
    const b = document.getElementById('suite-bar');
    if (b && b.parentNode) b.parentNode.removeChild(b);
  }

  function mountSuiteBar() {
    removeSuiteBar();
    const bar = document.createElement('div');
    bar.className = 'suite-bar';
    bar.id = 'suite-bar';
    const STEPS = ['逐章分析', '逐章模拟', '黄金三章', '整轮批评'];
    bar.innerHTML = '<span class="sb-label">全套流水线</span>' +
      STEPS.map((s, i) => '<span class="sb-step" data-i="' + i + '">' + s + '</span>').join('');
    document.body.appendChild(bar);
    let cur = -1;
    return {
      update(n, label) {
        if (n === cur) return;
        cur = n;
        $$('.sb-step', bar).forEach((el, i) => {
          el.classList.toggle('on', i === n - 1);
          el.classList.toggle('done', i < n - 1);
        });
        const lbl = $('.sb-label', bar);
        if (lbl) lbl.textContent = '全套 · ' + n + '/4 ' + label;
      },
      done(msg) {
        bar.classList.add('fin');
        $$('.sb-step', bar).forEach((el) => el.classList.add('done'));
        const lbl = $('.sb-label', bar);
        if (lbl) lbl.textContent = msg;
        setTimeout(() => {
          bar.classList.add('out');
          setTimeout(removeSuiteBar, 450);
        }, 1800);
      }
    };
  }

  async function runFullSuite() {
    if (state.busy) { toast('全套流水线已经在跑'); return; }
    const w = work();
    const m = E.analyze(w.text);
    if (m.charCount < 80) { toast('稿件太短了，至少给读者 80 字'); return; }
    const active = activePersonas(w);
    if (!active.length) { toast('至少留一位读者在场'); return; }

    ensureChatView();
    state.busy = true;
    state.metrics = m;
    refreshWorkChrome();

    const bar = mountSuiteBar();
    bar.update(1, '逐章分析');
    await sleep(180);
    E.analyzeChapters(w.text);
    bar.update(2, '逐章模拟');
    await sleep(180);
    E.simulateReading(w.text, active);
    bar.update(3, '黄金三章');
    await sleep(180);
    E.analyzeGolden(w.text);
    bar.update(4, '整轮批评');

    await performRound(w, m, active);
    bar.done('全套完成：五个页签都齐了');
    toast('全套完成：对话、批注、三章、曲线、逐章都有货了');
  }

  /* ================= 追问 ================= */
  function resolveTarget(q) {
    const m = q.match(/@([^\s，,。！？!?]+)/);
    if (m) {
      const name = m[1];
      return allPersonas().find((p) => p.name === name) ||
        allPersonas().find((p) => p.name.indexOf(name) >= 0 || name.indexOf(p.name) >= 0) || null;
    }
    if (state.selected) return personaOf(state.selected);
    const cs = critsOf(work());
    if (cs.length) return personaOf(cs[cs.length - 1].personaId);
    return null;
  }

  async function ask(raw) {
    const w = work();
    const q = String(raw || '').trim();
    if (!q) return;

    const target = resolveTarget(q);
    if (!target) { toast('先用 @ 点一位读者的名字，比如 @老周'); return; }
    const history = w.log.filter((x) => x.type === 'critique' && x.personaId === target.id);
    const entry = history[history.length - 1];
    if (!entry) { toast(target.name + '还没发过言，先开一轮批评'); return; }

    ensureChatView();
    const clean = q.replace(/@[^\s，,。！？!?]+/, '').trim() || q;
    w.log.push({ type: 'ask', ts: Date.now(), text: clean, targetId: target.id });
    save();
    renderStreamArea();

    const m = state.metrics || E.analyze(w.text);
    const tip = showTyping(target);
    await sleep(460 + Math.random() * 380);
    const full = Object.assign({}, entry, { issues: E.detectIssues(m) });
    const prov = activeProvider();
    const pcfg = providerConfigFor(prov.id);
    let r = null;
    if (prov.id !== 'rule') {
      try {
        r = await prov.respond({
          persona: effectivePersona(target), question: clean, metrics: m,
          entry: full, providerConfig: pcfg, golden: E.analyzeGolden(w.text)
        });
      } catch (err) {
        recordCall({ provider: prov.id, model: pcfg.model, persona: target.name, error: String(err.message || err) });
        r = await PR.rule.respond({
          persona: effectivePersona(target), question: clean, metrics: m, entry: full, golden: E.analyzeGolden(w.text)
        });
      }
    } else {
      r = await prov.respond({
        persona: effectivePersona(target), question: clean, metrics: m, entry: full, golden: E.analyzeGolden(w.text)
      });
    }
    removeTyping(tip);

    w.log.push({ type: 'reply', ts: Date.now(), personaId: target.id, blocks: r.blocks });
    save();
    renderStreamArea();
  }

  /* ================= 打字指示 ================= */
  function showTyping(p) {
    const inner = $('.stream-inner');
    if (!inner) return null;
    const el = document.createElement('div');
    el.className = 'typing';
    el.innerHTML = '<div class="avatar" style="background:' + p.color + '">' + esc(p.initial) +
      '</div><div class="msg-body"><div class="msg-head"><span class="name">' + esc(p.name) +
      '</span><span class="role">正在读稿</span></div><div class="dots"><i></i><i></i><i></i></div></div>';
    inner.appendChild(el);
    const s = $('#stream');
    if (s) s.scrollTop = s.scrollHeight;
    return el;
  }

  function removeTyping(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

  /* ================= 导出 ================= */
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function exportMarkdown(round) {
    const r = buildReport(round);
    if (!r) return;
    const w = r.work;
    const lines = [];
    lines.push('# 《' + w.title + '》批评报告', '');
    lines.push('- 体裁：' + (w.genre || '未分类'));
    lines.push('- 字数：' + E.analyze(w.text).charCount);
    lines.push('- 轮次：第 ' + r.round + ' 轮');
    lines.push('- 在场读者：' + r.crits.length + ' 位');
    lines.push('- 综合评分：' + r.avgScore + ' / 100');
    if (r.prev) lines.push('- 对比：第 ' + r.prev.round + ' 轮 ' + r.prev.score + ' → ' + r.avgScore);
    lines.push('', '## 一、分维度评分', '', '| 维度 | 均分 | 区间 |', '| --- | --- | --- |');
    E.DIMS.forEach((k) => {
      lines.push('| ' + E.DIM_LABEL[k] + ' | ' + r.dims[k].avg + ' | ' + r.dims[k].min + '–' + r.dims[k].max + ' |');
    });
    lines.push('', '## 二、共识问题', '');
    if (!r.consensus.length) lines.push('本轮无显著共识问题。');
    r.consensus.forEach((c, i) => {
      lines.push('### ' + (i + 1) + '. ' + c.title + '（' + c.count + '/' + r.crits.length + '）', '');
      lines.push(c.detail, '', '> 改法：' + c.fix, '');
    });
    lines.push('## 三、修改清单', '');
    const checked = w.checked || [];
    r.consensus.slice(0, 8).forEach((f) => {
      lines.push('- [' + (checked.indexOf(f.id) >= 0 ? 'x' : ' ') + '] ' + f.fix + '（' + f.title + '）');
    });
    lines.push('', '## 四、各读者评分', '', '| 读者 | 身份 | 分数 | 主要意见 |', '| --- | --- | --- | --- |');
    r.crits.slice().sort((a, b) => b.score - a.score).forEach((c) => {
      const p = personaOf(c.personaId);
      const main = (c.issues && c.issues[0]) ? c.issues[0].title : '无硬伤';
      lines.push('| ' + p.name + ' | ' + p.role + ' | ' + c.score + ' | ' + main + ' |');
    });
    lines.push('', '---', '', '由「读者席」生成，评分基于文本体征统计与读者人格权重，仅供修改参考。');
    download('批评报告-' + (w.title || '未命名') + '.md', lines.join('\n'));
    toast('报告已导出');
  }

  function exportAnnotated() {
    const w = work();
    const round = latestRound(w);
    if (!round) { toast('还没有批注'); return; }
    const data = annotationsFor(w, round);
    const pl = E.paraLocate(w.text);
    const lines = ['# 《' + w.title + '》批注稿 · 第 ' + round + ' 轮', ''];
    data.paras.forEach((p, i) => {
      const chTag = pl.chOf[i] ? '（第' + pl.chOf[i] + '章）' : '';
      lines.push('**' + pad2(i + 1) + '**' + chTag + '　' + p, '');
      data.map[i].forEach((n) => {
        const per = personaOf(n.pid);
        const loc = n.ch
          ? '（第' + n.ch + '章 · 第' + (n.para != null ? n.para + 1 : i + 1) + '段）'
          : '';
        lines.push('> ' + per.name + loc + '（' + n.title + '）：' + n.note);
        lines.push('> 改法：' + n.fix, '');
      });
    });
    download('批注稿-' + (w.title || '未命名') + '.md', lines.join('\n'));
    toast('批注稿已导出');
  }

  /* ================= 弹层 ================= */
  function openModal(html) {
    $('#modal-root').innerHTML = '<div class="modal-mask"><div class="modal-card">' + html + '</div></div>';
    const mask = $('.modal-mask');
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) closeModal(); });
  }
  function closeModal() { $('#modal-root').innerHTML = ''; }

  function openEditor(isNew) {
    const w = work();
    const title = isNew ? '' : w.title;
    const genre = isNew ? '短篇小说' : w.genre;
    const text = isNew ? '' : w.text;
    const genres = ['短篇小说', '散文', '随笔', '剧本', '网文', '诗歌'];

    openModal('<div class="modal-head"><div><h3>' + (isNew ? '新建作品' : '编辑稿件') + '</h3>' +
      '<div class="sub">贴入正文即可，不要加标题行。读者只读你给的文字。</div></div>' +
      '<button class="x-btn" data-close="1">×</button></div>' +
      '<div class="modal-body">' +
      '<div class="field"><label>标题</label><input type="text" id="ed-title" value="' + esc(title) + '" placeholder="例如：雨夜的旧书店" /></div>' +
      '<div class="field"><label>体裁</label><select id="ed-genre">' +
      genres.map((g) => '<option ' + (g === genre ? 'selected' : '') + '>' + g + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>正文</label><textarea id="ed-text" placeholder="从这里开始贴你的稿子……">' + esc(text) + '</textarea>' +
      '<div class="file-row"><button class="link-btn" id="ed-file-btn">从 txt / md 文件导入</button>' +
      '<span id="ed-count">' + fmt(E.analyze(text).charCount) + ' 字</span>' +
      '<input type="file" id="ed-file" accept=".txt,.md,text/plain" hidden /></div></div></div>' +
      '<div class="modal-foot"><button class="btn ghost" data-close="1">取消</button>' +
      '<button class="btn primary" id="ed-save">' + (isNew ? '创建并放上桌' : '保存') + '</button></div>');

    $$('#modal-root [data-close]').forEach((b) => b.addEventListener('click', closeModal));
    const ta = $('#ed-text');
    ta.addEventListener('input', () => { $('#ed-count').textContent = fmt(E.analyze(ta.value).charCount) + ' 字'; });
    $('#ed-file-btn').addEventListener('click', () => $('#ed-file').click());
    $('#ed-file').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        ta.value = String(reader.result || '');
        ta.dispatchEvent(new Event('input'));
        if (!$('#ed-title').value) $('#ed-title').value = f.name.replace(/\.(txt|md)$/i, '');
      };
      reader.readAsText(f, 'utf-8');
    });

    $('#ed-save').addEventListener('click', () => {
      const t = $('#ed-title').value.trim() || '未命名作品';
      const g = $('#ed-genre').value;
      const body = ta.value;
      if (body.replace(/\s/g, '').length < 40) { toast('正文太短，至少 40 字'); return; }

      let targetId = w.id;
      if (isNew) {
        const id = 'w' + Date.now().toString(36);
        targetId = id;
        state.data.works.unshift({
          id: id, title: t, genre: g, text: body, createdAt: Date.now(),
          log: [], checked: [], active: allPersonas().map((p) => p.id)
        });
        state.data.activeWorkId = id;
        state.selected = null;
        state.reportRound = null;
      } else {
        w.title = t; w.genre = g; w.text = body;
      }
      save();
      closeModal();
      go('#/work/' + targetId);
      toast(isNew ? '作品已创建' : '稿件已更新');
    });
  }

  function openNewReader(editId) {
    const editing = editId ? state.data.customPersonas.find((x) => x.id === editId) : null;
    const dims = E.DIMS.map((k) =>
      '<label class="dim-check"><input type="checkbox" value="' + k + '" ' +
      ((editing ? (editing.weights[k] >= 1.2) : ['prose', 'character'].indexOf(k) >= 0) ? 'checked' : '') +
      ' />' + E.DIM_LABEL[k] + '</label>').join('');

    const patienceOpts = [
      ['veryLow', '极低 · 2 章没新信息就走'],
      ['low', '低 · 3 章'],
      ['mid', '中 · 4—5 章'],
      ['high', '高 · 6—7 章'],
      ['veryHigh', '很高 · 8 章以上，基本不弃读']
    ].map(([v, t]) =>
      '<label class="pat-opt"><input type="radio" name="nr-pat" value="' + v + '"' +
      ((editing ? editing.patience : 'mid') === v ? ' checked' : '') + ' /><span>' + t + '</span></label>').join('');

    const curStrict = editing ? Math.round((2.4 - editing.bias) / 0.065) : 55;

    openModal('<div class="modal-head"><div><h3>' + (editing ? '改一下「' + esc(editing.name) + '」' : '捏一个读者') + '</h3>' +
      '<div class="sub">给他一套标准，他就会用这套标准读你的稿子。</div></div>' +
      '<button class="x-btn" data-close="1">×</button></div>' +
      '<div class="modal-body">' +
      '<div class="field row2"><div><label>名字</label><input type="text" id="nr-name" placeholder="例如：老吴" value="' +
      (editing ? esc(editing.name) : '') + '" /></div>' +
      '<div><label>身份</label><input type="text" id="nr-role" placeholder="例如：退休语文老师" value="' +
      (editing ? esc(editing.role) : '') + '" /></div></div>' +
      '<div class="field"><label>他的一句话标准</label><input type="text" id="nr-tag" placeholder="例如：话要说得像人说的" value="' +
      (editing ? esc(editing.tagline) : '') + '" /></div>' +
      '<div class="field"><label>他在意什么（可多选）</label><div class="dim-checks">' + dims + '</div></div>' +
      '<div class="field"><label>毒舌程度</label><div class="slider-row"><span class="sl">温和</span>' +
      '<input type="range" id="nr-strict" min="0" max="100" value="' + curStrict + '" /><span class="sl">刻薄</span></div></div>' +
      '<div class="field"><label>口头禅（可选）</label><input type="text" id="nr-sign" placeholder="例如：这话我不爱听" value="' +
      (editing && editing.signs && editing.signs.length ? esc(editing.signs[0]) : '') + '" /></div>' +
      '<div class="field"><label>说话方式</label>' +
      '<textarea id="nr-voice" rows="2" placeholder="例如：话不多，克制，喜欢用短句下判断，讲话不绕弯子。">' +
      (editing ? esc(editing.voice || '') : '') + '</textarea>' +
      '<div class="muted-note" style="margin-top:6px">接上本地模型后，读者会照这段话调整口吻。留空则由他按身份自己发挥。</div></div>' +
      '<div class="field"><label>批注时重点关注</label>' +
      '<input type="text" id="nr-focus" placeholder="例如：动机是否可信，这段在推进还是在填充" value="' +
      (editing && editing.focus ? esc(editing.focus.join('，')) : '') + '" />' +
      '<div class="muted-note" style="margin-top:6px">逗号分隔。决定他会盯着稿子里的哪些地方挑毛病。</div></div>' +
      '<div class="field"><label>耐心</label><div class="pat-list">' + patienceOpts + '</div>' +
      '<div class="muted-note" style="margin-top:6px">决定他在逐章阅读时第几章会失去兴趣。耐心越低，越早弃读。</div></div>' +
      '</div>' +
      '<div class="modal-foot"><button class="btn ghost" data-close="1">取消</button>' +
      '<button class="btn primary" id="nr-save">' + (editing ? '改好了' : '让他入席') + '</button></div>');

    $$('#modal-root [data-close]').forEach((b) => b.addEventListener('click', closeModal));
    $('#nr-save').addEventListener('click', () => {
      const name = $('#nr-name').value.trim();
      if (!name) { toast('总得有个名字'); return; }
      const role = $('#nr-role').value.trim() || '自定读者';
      const tag = $('#nr-tag').value.trim() || '我有我的标准';
      const checkedDims = $$('.dim-checks input:checked').map((x) => x.value);
      const strict = Number($('#nr-strict').value);
      const sign = $('#nr-sign').value.trim();
      const voice = $('#nr-voice').value.trim();
      const focus = $('#nr-focus').value.trim().split(/[，,、]/).map((s) => s.trim()).filter(Boolean);
      const patienceEl = $('input[name="nr-pat"]:checked');
      const patience = patienceEl ? patienceEl.value : 'mid';

      const weights = {};
      E.DIMS.forEach((k) => { weights[k] = checkedDims.indexOf(k) >= 0 ? 1.6 : 0.7; });

      const palette = ['#8e6bd8', '#e07a5f', '#2a9d8f', '#c78a1e', '#4b7bec', '#c0568e', '#5b8c5a'];
      const idx = (state.data.customPersonas || []).length % palette.length;
      const id = editing ? editing.id : 'c' + Date.now().toString(36);

      const persona = {
        id: id,
        name: name,
        role: role,
        initial: name.slice(0, 1),
        color: editing ? editing.color : palette[idx],
        tagline: tag,
        bio: (editing && editing.bio) ? editing.bio
          : '你捏出来的读者。他在意 ' + (checkedDims.map((k) => E.DIM_LABEL[k]).join('、') || '几乎所有东西') +
            '，说话' + (strict > 66 ? '不太好听' : strict > 33 ? '还算客气' : '很温和') + '。',
        likes: checkedDims.map((k) => E.DIM_LABEL[k]).slice(0, 3),
        hates: E.DIMS.filter((k) => checkedDims.indexOf(k) < 0).map((k) => '敷衍的' + E.DIM_LABEL[k]).slice(0, 2),
        weights: weights,
        bias: 2.4 - strict * 0.065,
        verbosity: editing ? editing.verbosity : 2,
        signs: sign ? [sign] : [],
        praiseLead: '有一处得说：',
        fixLead: '要我改，就改这几处：',
        voice: voice,
        focus: focus,
        patience: patience,
        readingStyle: READING_STYLE[patience] || READING_STYLE.mid,
        custom: true
      };

      if (editing) {
        const arr = state.data.customPersonas;
        const at = arr.findIndex((x) => x.id === id);
        if (at >= 0) arr[at] = Object.assign({}, arr[at], persona);
      } else {
        state.data.customPersonas.push(persona);
      }
      const w = work();
      if (w.active.indexOf(id) < 0) w.active.push(id);
      save();
      closeModal();
      go('#/reader/' + id);
      toast(editing ? name + ' 已改好' : name + ' 已入席');
    });
  }

  /* ================= 提示 ================= */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ================= 全局事件 ================= */
  function bindGlobal() {
    $('#rail-logo').addEventListener('click', () => go('#/shelf'));

    $$('.rail-btn[data-route]').forEach((b) => {
      b.addEventListener('click', () => {
        const r = b.getAttribute('data-route');
        if (r === 'report') { go('#/report/' + work().id); return; }
        go('#/' + r);
      });
    });

    $('#sidebar').addEventListener('click', (e) => {
      const sgh = e.target.closest('.sb-group-head');
      if (sgh) {
        const g = sgh.parentElement;
        const id = g.getAttribute('data-sb-group');
        g.classList.toggle('folded');
        uiState.folds[id] = g.classList.contains('folded');
        saveUI();
        return;
      }

      const del = e.target.closest('[data-del]');
      if (del) { e.stopPropagation(); deleteWork(del.getAttribute('data-del')); return; }

      const tog = e.target.closest('[data-toggle]');
      if (tog) { e.stopPropagation(); toggleActive(tog.getAttribute('data-toggle')); return; }

      const sr = e.target.closest('[data-go-reader]');
      if (sr) { go('#/reader/' + sr.getAttribute('data-go-reader')); return; }

      const rd = e.target.closest('[data-round]');
      if (rd) { state.reportRound = Number(rd.getAttribute('data-round')); render(); return; }

      const rgo = e.target.closest('[data-round-goto]');
      if (rgo) { state.reportRound = Number(rgo.getAttribute('data-round-goto')); go('#/report/' + work().id); return; }

      const open = e.target.closest('[data-open]');
      if (open) { go('#/work/' + open.getAttribute('data-open')); return; }

      if (e.target.closest('[data-new-work]') || e.target.closest('#sb-new')) { openEditor(true); return; }
      if (e.target.closest('[data-new-reader]') || e.target.closest('#sb-new-reader')) { openNewReader(); return; }
      if (e.target.closest('[data-goto-report]')) { go('#/report/' + work().id); return; }
      if (e.target.closest('[data-print]')) { window.print(); return; }
    });

    $('#inspector').addEventListener('click', (e) => {
      const head = e.target.closest('.insp-group-head');
      if (!head) return;
      const g = head.parentElement;
      const id = g.getAttribute('data-insp-group');
      g.classList.toggle('folded');
      uiState.folds[id] = g.classList.contains('folded');
      saveUI();
    });

    $('#main').addEventListener('click', (e) => {
      const sort = e.target.closest('[data-sort]');
      if (sort) {
        uiState.shelfSort = sort.getAttribute('data-sort');
        saveUI();
        renderShelfTools();
        renderShelfGrid();
        return;
      }
      const open = e.target.closest('[data-open]');
      if (open) { go('#/work/' + open.getAttribute('data-open')); return; }
      if (e.target.closest('[data-new-work]')) { openEditor(true); return; }
      if (e.target.closest('[data-new-reader]')) { openNewReader(); return; }
      if (e.target.closest('[data-goto-readers]')) { go('#/readers'); return; }

      const delW = e.target.closest('[data-del]');
      if (delW) { deleteWork(delW.getAttribute('data-del')); return; }

      const rd = e.target.closest('[data-go-reader]');
      if (rd) { go('#/reader/' + rd.getAttribute('data-go-reader')); return; }

      const toggle = e.target.closest('[data-toggle-reader]');
      if (toggle) { toggleActive(toggle.getAttribute('data-toggle-reader')); render(); return; }

      const delR = e.target.closest('[data-del-reader]');
      if (delR) { deleteReader(delR.getAttribute('data-del-reader')); return; }

      const editR = e.target.closest('[data-edit-reader]');
      if (editR) { openNewReader(editR.getAttribute('data-edit-reader')); return; }

      if (e.target.closest('[data-back]')) { go('#/work/' + work().id); return; }
      if (e.target.closest('[data-print]')) { window.print(); return; }
      if (e.target.closest('[data-export-report]')) {
        exportMarkdown(state.reportRound || latestRound(work()));
        return;
      }
    });

    $('#main').addEventListener('input', (e) => {
      if (e.target && e.target.id === 'shelf-q') {
        uiState.shelfQ = e.target.value;
        saveUI();
        renderShelfGrid();
        return;
      }
    });

    $('#main').addEventListener('change', (e) => {
      if (e.target.id === 'round-select') {
        state.reportRound = Number(e.target.value);
        render();
        return;
      }
      const cb = e.target.closest('input[data-check]');
      if (cb) {
        const w = work();
        const arr = w.checked || (w.checked = []);
        const i = arr.indexOf(cb.getAttribute('data-check'));
        if (cb.checked && i < 0) arr.push(cb.getAttribute('data-check'));
        if (!cb.checked && i >= 0) arr.splice(i, 1);
        const label = cb.closest('.fix-check');
        if (label) label.classList.toggle('done', cb.checked);
        save();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && state.route.name === 'work') {
        e.preventDefault();
        runRound();
      }
    });

    window.addEventListener('hashchange', render);
  }

  function toggleActive(id) {
    const w = work();
    const i = w.active.indexOf(id);
    if (i >= 0) w.active.splice(i, 1); else w.active.push(id);
    save();
    renderSidebar();
    if (state.route.name === 'work') refreshWorkChrome();
  }

  function deleteWork(id) {
    if (state.data.works.length <= 1) { toast('至少保留一篇作品'); return; }
    const w = workById(id);
    if (!w) return;
    if (!window.confirm('删除《' + w.title + '》及它的全部批评记录？')) return;
    state.data.works = state.data.works.filter((x) => x.id !== id);
    if (state.data.activeWorkId === id) state.data.activeWorkId = state.data.works[0].id;
    state.selected = null;
    save();
    go('#/shelf');
    toast('已删除');
  }

  function deleteReader(id) {
    const p = allPersonas().find((x) => x.id === id);
    if (!p) return;
    if (!window.confirm('删除读者「' + p.name + '」？他留下的批评记录会保留。')) return;
    state.data.customPersonas = state.data.customPersonas.filter((x) => x.id !== id);
    state.data.works.forEach((w) => { w.active = w.active.filter((x) => x !== id); });
    save();
    go('#/readers');
    toast('已删除');
  }

  /* ================= 启动 ================= */
  function init() {
    loadUI();
    state.data = load();
    if (!state.data.works.some((w) => w.id === state.data.activeWorkId)) {
      state.data.activeWorkId = state.data.works[0].id;
    }
    save();   // 首次进入即落盘，避免关掉页面丢数据
    refreshMetrics();
    bindGlobal();
    if (!location.hash) location.hash = '#/shelf';
    render();
  }

  init();

  // 调试/打包钩子：单文件版与自动化测试需要访问内部状态
  window.RCS_APP = {
    state: state,
    save: save,
    render: render,
    provider: activeProvider,
    chapterData: chapterData
  };
})();

})();
</script>

          {

            "para_index": 0,

          {

            "ts": 0.0

          {
            "chapter_index": 1,
            "para_index": 1,
            "quote": "老板是一个五十多岁的男人，很瘦，戴着一副很旧的眼镜，看起来是一个很有故事的人。他没有再问什么，只是给她倒了一杯热水。水汽",

            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 2,
            "para_index": 0,
            "quote": "她想起陈默走的那天，也是下着雨。他站在车站的站台上，背着一个很旧的帆布包，对她说：“等我回来。”她点了点头。然后火车就开",
            "note": "这里的推进感偏弱，读者会在这里走神。",
            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 2,
            "para_index": 1,
            "quote": "她站在那里，很久很久都没有动，直到雨水打湿了她的头发和衣服。她忽然觉得有些不对，但又说不上来是哪里不对。",
            "note": "这里的推进感偏弱，读者会在这里走神。",
            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 3,
            "para_index": 2,
            "quote": "她站起身，把杯子轻轻地放在桌子上，对老板说：“我走了。”",
            "note": "这里的推进感偏弱，读者会在这里走神。",
            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 3,
            "para_index": 1,
            "quote": "老板没有说话。房间里只有雨声。她看着书架上的书，那些书脊上的字她一个一个看过去，什么也没有记住。",
            "note": "这里的推进感偏弱，读者会在这里走神。",
            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 4,
            "para_index": 0,
            "quote": "天亮的时候雨停了。窗外的天是灰白色的，云压得很低。她走出书店，深吸了一口气，空气里有一种潮湿的味道。",
            "note": "这里的推进感偏弱，读者会在这里走神。",
            "focus": "推进感",
            "ts": 0.0
          },
          {
            "chapter_index": 4,
            "para_index": 1,
            "quote": "她想，也许有些路，本来就是要一个人走的。她又想，也许不是。她自己也说不清。",
